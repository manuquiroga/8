      ol(test, c = '0') {
        const ins = (x, y) => test(x + 0.5, y + 0.5);
        for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++)
          if (!ins(x, y) && (ins(x - 1, y) || ins(x + 1, y) || ins(x, y - 1) || ins(x, y + 1))) h.p(x, y, c);
      },
      // esfera con luz real (arriba-izq) + especular
      sphere(cx, cy, r, ramp, o = {}) {
        const n = ramp.length;
        const t = C(cx, cy, r);
        if (o.ol !== false) h.ol(t, o.ol || '0');
        for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
          const nx = (x + 0.5 - cx) / r, ny = (y + 0.5 - cy) / r, d2 = nx * nx + ny * ny;
          if (d2 > 1) continue;
          const nz = Math.sqrt(1 - d2);
          const l = -0.5 * nx - 0.6 * ny + 0.62 * nz;
          const rp = o.rampAt ? o.rampAt(nx, ny) : ramp;
          let v = Math.max(0, Math.min(1, (l + 0.3) / 1.2)) * n; let i = Math.floor(v);
          if (v - i > 0.6 && (x + y) % 2 === 0) i++;
          let c = rp[Math.max(0, Math.min(n - 1, i))];
          if (o.spec !== false && l > 0.9) c = o.spec || '8';
          if (o.rimC && d2 > 0.72 && nx + ny > 0.6) c = o.rimC; // luz de rebote púrpura
          h.p(x, y, c);
        }
      },
      // bola de billar
      ball(cx, cy, r, o = {}) {
        const col = o.col || R.red;
        const stripe = !!o.stripe;
        h.sphere(cx, cy, r, col, {
          ol: o.ol, rimC: o.rimC,
          rampAt: stripe ? (nx, ny) => (Math.abs(ny - nx * (o.tilt || 0)) < 0.46 ? col : R.bone) : null,
        });
        if (o.num !== undefined && r >= 5) {
          const dx = cx - r * 0.12, dy = cy - r * 0.16, dr = Math.max(2.4, r * 0.46);
          h.fill(C(dx, dy, dr), '7');
          h.fill(D(C(dx, dy, dr), C(dx - 0.8, dy - 0.8, dr)), '6');
          const s = String(o.num); const glyphs = s.split('').map((ch) => F3[ch]);
          const tw = glyphs.reduce((a, gl) => a + gl[0].length, 0) + (glyphs.length - 1);
          let x0 = Math.round(dx - tw / 2), y0 = Math.round(dy - 2.5);
          glyphs.forEach((gl) => { h.glyph(x0, y0, gl, o.numC || '0'); x0 += gl[0].length + 1; });
        }
      },
      glyph(x, y, gl, c) { gl.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === '1') h.p(x + i, y + j, c); }); },
      txt(x, y, s, c, sh) {
        let xx = x;
        s.split('').forEach((ch) => { const gl = F3[ch]; if (!gl) { xx += 2; return; } if (sh) h.glyph(xx + 1, y + 1, gl, sh); h.glyph(xx, y, gl, c); xx += gl[0].length + 1; });
      },
      // texto con contorno completo (legible sobre cualquier fondo)
      txtO(x, y, s, c, oc = '0') {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) h.txt(x + dx, y + dy, s, oc);
        h.txt(x, y, s, c);
      },
      // glifo con contorno (filas de '1')
      glyphO(x, y, gl, c, oc = '0') {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) h.glyph(x + dx, y + dy, gl, oc);
        h.glyph(x, y, gl, c);
      },
      // palo diagonal en píxel limpio (abajo-izq -> arriba-der). k = x+y de la línea central.
      // segs: [{t0, t1, w, ramp:[claro..oscuro]}] con t = x - y
      diag(k, segs, oc = '0') {
        const seg = (t) => segs.find((s) => t >= s.t0 && t <= s.t1);
        const ins = (x, y) => { const s = seg(x - y); if (!s) return false; const o = x + y - k; const lo = -Math.floor((s.w - 1) / 2); return o >= lo && o < lo + s.w; };
        h.ol((x, y) => ins(Math.floor(x), Math.floor(y)), oc);
        for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) {
          if (!ins(x, y)) continue;
          const s = seg(x - y), o = x + y - k, lo = -Math.floor((s.w - 1) / 2);
          const u = (o - lo) / Math.max(1, s.w - 1);
          const rp = s.ramp; const i = Math.min(rp.length - 1, Math.round(u * (rp.length - 1)));
          h.p(x, y, s.fn ? s.fn(x, y, i) || rp[i] : rp[i]);
        }
      },
      line(x0, y0, x1, y1, c) { g.line(x0, y0, x1, y1, c); dirty(); },
      dash(x0, y0, x1, y1, c, on = 1, off = 1) {
        const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        for (let i = 0; i <= n; i++) if (i % (on + off) < on) h.p(Math.round(x0 + ((x1 - x0) * i) / n), Math.round(y0 + ((y1 - y0) * i) / n), c);
      },
      rows(x, y, rows, map) { g.rows(x, y, rows, map); dirty(); },
      // destello en cruz
      star(x, y, c = 'i', c2 = '8', s = 1) {
        h.p(x, y, c2);
        for (let k = 1; k <= s; k++) { h.p(x - k, y, c); h.p(x + k, y, c); h.p(x, y - k, c); h.p(x, y + k, c); }
      },
      // halo tramado detrás (solo píxeles vacíos)
      halo(cx, cy, r, c, c2) {
        for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
          const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy); if (d > r) continue;
          if (d < r * 0.55 && c2) { if ((x + y) % 2 === 0) h.under(x, y, c2); }
          else if (x % 2 === 0 && y % 2 === 0 && (x / 2 + y / 2) % 2 === 0) h.under(x, y, c);
          else if (d < r * 0.75 && (x + y) % 2 === 0 && y % 2 === 0) h.under(x, y, c);
        }
      },
      // moneda de oro de lado/frontal
      coin(cx, cy, r = 3) {
        h.sphere(cx, cy, r, R.gold, { spec: 'i' });
        h.fill(D(C(cx, cy, r - 1.2), C(cx, cy, r - 2.2)), 'g');
        if (r >= 3) h.p(Math.floor(cx), Math.floor(cy), 'e');
      },
      // ficha de póker azul (FICHAS)
      chip(cx, cy, rx = 4, col = R.blue) {
        const ry = rx * 0.55;
        h.shade(U(E(cx, cy + 1, rx, ry), Rc(cx - rx, cy, rx * 2, 1)), [col[0], col[1], col[1], col[2]], { bias: 0 });
        h.fill(E(cx, cy, rx - 0.2, ry - 0.2), col[2]);
        h.fill(E(cx, cy, rx * 0.5, ry * 0.5), col[3]);
        h.p(Math.floor(cx - rx + 1), Math.floor(cy), '8'); h.p(Math.floor(cx + rx - 2), Math.floor(cy), '8');
        h.p(Math.floor(cx), Math.floor(cy - ry + 0.5), '8');
      },
      // gota
      drop(cx, cy, r, ramp) {
        h.shade(U(C(cx, cy, r), P([[cx - r * 0.85, cy - r * 0.3], [cx, cy - r * 2.6], [cx + r * 0.85, cy - r * 0.3]])), ramp);
        h.p(Math.floor(cx - r * 0.4), Math.floor(cy - r * 0.2), '8');
      },
      // calavera parametrizable
      skull(cx, cy, s, ramp, o = {}) {
        const cran = E(cx, cy - 1 * s, 7 * s, 6.4 * s);
        const cheek = E(cx, cy + 2.2 * s, 6 * s, 3.4 * s);
        const jaw = Rc(cx - 4 * s, cy + 3 * s, 8 * s, 4.2 * s);
        h.shade(U(cran, cheek, jaw), ramp, { bias: 0.2, ol: o.ol });
        // cuencas
        const eyeC = o.eye || '0';
        const ey = cy + 1.1 * s;
        h.fill(E(cx - 3 * s, ey, 2.1 * s, 2.0 * s), eyeC);
        h.fill(E(cx + 3 * s, ey, 2.1 * s, 2.0 * s), eyeC);
        if (o.glow) {
          h.p(Math.floor(cx - 3 * s), Math.floor(ey), o.glow); h.p(Math.floor(cx + 3 * s), Math.floor(ey), o.glow);
          if (s >= 1.2) { h.p(Math.floor(cx - 3 * s) - 1, Math.floor(ey), o.glow2 || o.glow); h.p(Math.floor(cx + 3 * s), Math.floor(ey) - 1, o.glow2 || o.glow); }
        }
        // ceja superior sombreada
        h.p(Math.floor(cx - 3 * s), Math.floor(ey - 2 * s) - 0, ramp[1]); h.p(Math.floor(cx + 3 * s), Math.floor(ey - 2 * s), ramp[1]);
        // nariz
        const ny = Math.floor(cy + 3.4 * s);
        h.p(Math.floor(cx) - 1, ny, '0'); h.p(Math.floor(cx), ny, '0'); h.p(Math.floor(cx) - 1, ny - 1, '1');
        // dientes
        const ty = Math.floor(cy + 5.2 * s);
        for (let x = Math.floor(cx - 3 * s); x <= cx + 3 * s - 1; x++) h.p(x, ty, (x % 2 === 0) ? '0' : ramp[1]);
        for (let x = Math.floor(cx - 3 * s) + 1; x <= cx + 3 * s - 1; x += 2) h.p(x, ty - 1, ramp[0]);
      },
      // corona de llamas / llama individual
      flame(cx, by, w, hgt, ramp = R.fire) {
        const outer = P([[cx - w, by], [cx - w * 0.9, by - hgt * 0.45], [cx - w * 0.2, by - hgt * 0.75], [cx, by - hgt], [cx + w * 0.4, by - hgt * 0.6], [cx + w, by - hgt * 0.35], [cx + w, by]]);
        h.shade(U(outer, E(cx, by - 1, w, w * 0.8)), ramp, { ly: 1, lx: 0, bias: 0.4 });
        h.fill(U(E(cx, by - hgt * 0.25, w * 0.5, hgt * 0.32)), ramp[3]);
        h.fill(E(cx, by - hgt * 0.18, w * 0.25, hgt * 0.16), '8');
      },
    };
    return h;
  }

  // registra sprite con pincel extendido
  function mk(name, w, h, fn) { return PX.make(name, w, h, (g) => fn(H(g))); }

  // ======================================================================
  // Canvases y utilidades de cartas
  // ======================================================================
  const cv = (w, h) => PX.canvas(w, h);
  const Q = (c) => OM.PAL[c];

  const RAR = {
    comun: { ramp: ['p', 'q', 'r', '8'], dark: 'o', bg: ['1', 'o', 'p'], gem: R.blue, pips: 1 },
    raro: { ramp: ['k', 'l', 'm', 'n'], dark: 'j', bg: ['1', 'j', 'k'], gem: R.toxic, pips: 2 },
    epico: { ramp: ['a', 'b', 'c', 'd'], dark: '9', bg: ['1', '9', 'a'], gem: R.red, pips: 3 },
    legendario: { ramp: ['f', 'g', 'h', 'i'], dark: 'e', bg: ['1', 's', '4'], gem: R.gold, pips: 0 },
  };
  const KIND = {
    arcano: { ramp: ['s', 't', 'u', '8'], dark: '2', bg: ['1', '2', 's'] },
    grabado: { ramp: ['e', 'f', 'g', 'h'], dark: 'e', bg: ['1', '3', 'e'] },
    luna: { ramp: ['4', '5', '6', '7'], dark: '2', bg: ['1', 'o', '3'] },
  };

  // marco biselado genérico w x h (esquinas redondeadas 1px)
  function paintFrame(g, w, h, ramp) {
    g.rect(1, 0, w - 2, 1, '0'); g.rect(1, h - 1, w - 2, 1, '0'); g.rect(0, 1, 1, h - 2, '0'); g.rect(w - 1, 1, 1, h - 2, '0');
    // banda exterior (2px) biselada
    g.rect(1, 1, w - 2, 1, ramp[3]); g.rect(1, 1, 1, h - 2, ramp[3]);
    g.rect(2, 2, w - 4, 1, ramp[2]); g.rect(2, 2, 1, h - 4, ramp[2]);
    g.rect(1, h - 2, w - 2, 1, ramp[0]); g.rect(w - 2, 1, 1, h - 2, ramp[0]);
    g.rect(2, h - 3, w - 4, 1, ramp[1]); g.rect(w - 3, 2, 1, h - 4, ramp[1]);
    g.p(w - 2, 1, ramp[2]); g.p(1, h - 2, ramp[1]);
    g.frame(3, 3, w - 6, h - 6, '0');
  }
  // fondo radial tramado de la ventana de arte
  function paintArtBg(g, x0, y0, w, h, bg) {
    const cx = x0 + w / 2, cy = y0 + h / 2 - 1;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const d = Math.hypot(x + 0.5 - cx, (y + 0.5 - cy) * 1.05) / (w / 2);
      let c = bg[0];
      if (d < 0.5) c = (x + y) % 2 === 0 ? bg[2] : bg[1];
      else if (d < 0.78) c = bg[1];
      else if (d < 1.0) c = (x + y) % 2 === 0 ? bg[1] : bg[0];
      else if (d > 1.25 && (x + y) % 2 === 0) c = '0';
      g.p(x, y, c);
    }
    // polvo/estrellas
    let seed = (x0 * 7 + y0 * 13 + w) | 0;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    for (let k = 0; k < 6; k++) {
      const x = x0 + 1 + Math.floor(rnd() * (w - 2)), y = y0 + 1 + Math.floor(rnd() * (h - 2));
      g.p(x, y, bg[2]);
    }
  }

  // ----------------------------------------------------------------------
  // Construcción de la carta de comodín (40x54)
  // ----------------------------------------------------------------------
  function buildJokerCard(def) {
    const rr = RAR[def.rarity] || RAR.comun;
    const { c, ctx } = cv(40, 54);
    const g = PX.painter(ctx, 40, 54);
    paintFrame(g, 40, 54, rr.ramp);
    g.rect(4, 4, 32, 46, '1');
    paintArtBg(g, 4, 4, 32, 36, rr.bg);
    // separador con rombo central
    g.rect(4, 40, 32, 1, '0');
    g.rect(4, 41, 32, 1, rr.ramp[2]); g.p(4, 41, rr.ramp[3]); g.p(35, 41, rr.ramp[1]);
    g.rect(4, 42, 32, 1, '0');
    // placa inferior
    for (let y = 43; y < 50; y++) for (let x = 4; x < 36; x++) g.p(x, y, (y === 43) ? '3' : ((x + y) % 2 === 0 ? '2' : '1'));
    // filigrana lateral
    g.rect(7, 46, 5, 1, rr.ramp[0]); g.rect(28, 46, 5, 1, rr.ramp[0]);
    g.p(6, 46, rr.ramp[1]); g.p(33, 46, rr.ramp[1]);
    // emblema de rareza
    if (def.rarity === 'legendario') {
      g.rows(14, 43, [
        '.0..0..0..0.',
        '0h00i00h00h0',
        '0hh0hh0hh0h0',
        '0hhhhhhhhhh0',
        '0gcgggqgggg0',
        '0eeeeeeeeee0',
        '.0000000000.',
      ]);
      g.p(16, 47, 'c'); g.p(20, 47, 'q'); g.p(23, 47, 'c');
      g.rect(7, 46, 5, 1, rr.ramp[1]); g.rect(28, 46, 5, 1, rr.ramp[1]);
    } else {
      const n = rr.pips, sp = 7, x0 = 20 - ((n - 1) * sp) / 2;
      for (let k = 0; k < n; k++) {
        const cx = Math.round(x0 + k * sp);
        g.rows(cx - 3, 43, ['...0...', '..0a0..', '.0bab0.', '0cbabd0', '.0dbd0.', '..0d0..', '...0...'],
          { a: rr.gem[3], b: rr.gem[2], c: rr.gem[2], d: rr.gem[0] });
        g.p(cx - 1, 45, '8');
      }
    }
    // ilustración
    const spr = PX.get('joker_' + def.id);
    if (spr) ctx.drawImage(spr.c, 4, 6);
    // escuadras góticas en las esquinas de la ventana
    const L = rr.ramp[2], L2 = rr.ramp[3];
    [[4, 4, 1, 1], [35, 4, -1, 1], [4, 39, 1, -1], [35, 39, -1, -1]].forEach(([x, y, dx, dy]) => {
      g.p(x, y, L2); g.p(x + dx, y, L); g.p(x + 2 * dx, y, L); g.p(x, y + dy, L); g.p(x, y + 2 * dy, L);
      g.p(x + dx, y + dy, '0');
    });
    // rombo central del separador
    g.rows(18, 39, ['.00.', '0ab0', '0ba0', '.00.'], { a: rr.ramp[3], b: rr.ramp[1] });
    // remaches
    [[2, 2], [37, 2], [2, 51], [37, 51]].forEach(([x, y]) => { g.p(x, y, '8'); });
    return c;
  }

  // brillo animado del legendario: frames precalculados
  const LEG_FRAMES = 24, LEG_PERIOD = 2.6;
  function buildLegendFrames(base) {
    const frames = [];
    const data = base.getContext('2d').getImageData(0, 0, 40, 54).data;
    const isBand = (x, y) => (x <= 2 || x >= 37 || y <= 2 || y >= 51 || y === 41);
    for (let f = 0; f < LEG_FRAMES; f++) {
      const { c, ctx } = cv(40, 54);
      ctx.drawImage(base, 0, 0);
      const p = -20 + (f / LEG_FRAMES) * 150; // barrido + pausa
      for (let y = 0; y < 54; y++) for (let x = 0; x < 40; x++) {
        const a = data[(y * 40 + x) * 4 + 3]; if (!a) continue;
        const k = x + y - p;
        if (k < 0 || k > 4) continue;
        const col = data[(y * 40 + x) * 4] + data[(y * 40 + x) * 4 + 1];
        if (col < 30) continue; // no pintar contornos negros
        if (isBand(x, y)) { ctx.fillStyle = Q(k > 1 && k < 3 ? '8' : 'i'); ctx.globalAlpha = 1; }
        else { ctx.fillStyle = Q('8'); ctx.globalAlpha = 0.28; }
        ctx.fillRect(x, y, 1, 1);
      }
      ctx.globalAlpha = 1;
      // destellos en esquinas (titilan)
      const tw = [[2, 2], [37, 51], [37, 2], [2, 51]][Math.floor(f / 6) % 4];
      ctx.fillStyle = Q('8'); ctx.fillRect(tw[0], tw[1], 1, 1);
      ctx.fillStyle = Q('i');
      [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => { const xx = tw[0] + dx, yy = tw[1] + dy; if (xx >= 0 && yy >= 0 && xx < 40 && yy < 54) ctx.fillRect(xx, yy, 1, 1); });
      frames.push(c);
    }
    return frames;
  }

  // silueta (para sombra y halo)
  function silhouette(src, color) {
    const w = src.width, h = src.height;
    const { c, ctx } = cv(w, h);
    ctx.drawImage(src, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = Q(color); ctx.fillRect(0, 0, w, h);
    return c;
  }
  // halo de borde: anillo de 1px por fuera de la silueta (w+2 x h+2)
  function haloRing(src, color) {
    const w = src.width, h = src.height;
    const d = src.getContext('2d').getImageData(0, 0, w, h).data;
    const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
    const { c, ctx } = cv(w + 2, h + 2);
    ctx.fillStyle = Q(color);
    for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
      if (op(x, y)) continue;
      if (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1)) ctx.fillRect(x + 1, y + 1, 1, 1);
    }
    return c;
  }

  // ----------------------------------------------------------------------
  // Dibujo genérico de carta pre-renderizada con juice
  // ----------------------------------------------------------------------
  const scratch = cv(48, 64);
  const cache = { joker: {}, item: {}, back: {}, pack: {}, medal: {}, shadow: {}, halo: {}, haloSel: {} };
  function shapeKey(w, h) { return w + 'x' + h; }
  function getShadow(src) {
    const k = shapeKey(src.width, src.height);
    if (!cache.shadow[k]) cache.shadow[k] = silhouette(src, '0');
    return cache.shadow[k];
  }
  function getHalo(src, col) {
    const k = shapeKey(src.width, src.height) + col;
    if (!cache.halo[k]) cache.halo[k] = haloRing(src, col);
    return cache.halo[k];
  }

  function editionOverlay(ctx, w, h, edition, t) {
    // ctx: scratch ya con la carta; pinta encima con source-atop
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop';
    if (edition === 'foil') {
      const off = (t * 30) % 16;
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = Q('r');
      for (let k = -h; k < w + h; k += 8) for (let y = 0; y < h; y++) ctx.fillRect(Math.floor(k + off + y * 0.5), y, 2, 1);
    } else if (edition === 'holo') {
      const cols = ['u', 't', 'q', 'r', 'm', 'h'];
      ctx.globalAlpha = 0.22;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x += 2) {
        const i = Math.floor((x + y + t * 24) / 4) % cols.length;
        ctx.fillStyle = Q(cols[(i + cols.length) % cols.length]); ctx.fillRect(x + (y % 2), y, 1, 1);
      }
    } else if (edition === 'negativo' || edition === 'negative') {
      ctx.globalCompositeOperation = 'difference';
      ctx.globalAlpha = 0.85; ctx.fillStyle = Q('7'); ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-atop'; ctx.globalAlpha = 0.25; ctx.fillStyle = Q('t'); ctx.fillRect(0, 0, w, h);
    } else if (edition === 'poli' || edition === 'poly' || edition === 'polychrome') {
      const cols = ['c', 'v', 'h', 'm', 'q', 't'];
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = Q(cols[Math.floor(t * 3) % cols.length]);
      ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  }

  function drawCardCanvas(ctx, src, x, y, o) {
    o = o || {};
    const w = src.width, h = src.height;
    const t = o.t || 0;
    const sc = o.scale || 1;
    const lift = o.hover ? 2 : 0;
    ctx.save();
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    let ang = 0;
    if (o.wobble) {
      const amp = typeof o.wobble === 'number' ? o.wobble : 1;

    {

    let img = src;

  // ----------------------------------------------------------------------
  // Consumible (30x40)
  // ----------------------------------------------------------------------
  function buildItemCard(def) {
    const kk = KIND[def.kind] || KIND.arcano;
    const { c, ctx } = cv(30, 40);
    const g = PX.painter(ctx, 30, 40);
    paintFrame(g, 30, 40, kk.ramp);
    g.rect(4, 4, 22, 32, '1');
    if (def.kind === 'arcano') {
      // tarot: arco gótico en la ventana
      paintArtBg(g, 4, 4, 22, 26, kk.bg);
      g.p(4, 4, '0'); g.p(5, 4, '0'); g.p(4, 5, '0'); g.p(25, 4, '0'); g.p(24, 4, '0'); g.p(25, 5, '0');
      g.rect(4, 30, 22, 1, '0'); g.rect(4, 31, 22, 1, kk.ramp[2]); g.rect(4, 32, 22, 1, '0');
      for (let y = 33; y < 36; y++) for (let x = 4; x < 26; x++) g.p(x, y, (x + y) % 2 ? '2' : '1');
      // numeral romano pequeño
      g.rows(12, 33, ['0t0t0t', '.t0t0t'.replace(/0/g, '.')]);
    } else if (def.kind === 'grabado') {
      paintArtBg(g, 4, 4, 22, 26, kk.bg);
      g.rect(4, 30, 22, 1, '0'); g.rect(4, 31, 22, 1, kk.ramp[2]); g.rect(4, 32, 22, 1, '0');
      for (let y = 33; y < 36; y++) for (let x = 4; x < 26; x++) g.p(x, y, (x + y) % 2 ? 'e' : '1');
      // martillo y cincel diminutos
      g.rows(11, 33, ['.g.....g', 'ggg.6.ggg'.slice(0, 8), '.g.....g']);
    } else {
      paintArtBg(g, 4, 4, 22, 26, kk.bg);
      g.rect(4, 30, 22, 1, '0'); g.rect(4, 31, 22, 1, kk.ramp[2]); g.rect(4, 32, 22, 1, '0');
      for (let y = 33; y < 36; y++) for (let x = 4; x < 26; x++) g.p(x, y, (x + y) % 2 ? '3' : '2');
      // flecha de subir nivel
      g.rows(12, 33, ['..n..', '.nnn.', 'nnnnn'].map((r) => r));
      g.rows(17, 33, ['..n..', '.nnn.', 'nnnnn'].map((r) => r));
    }
    [[2, 2], [27, 2], [2, 37], [27, 37]].forEach(([x, y]) => g.p(x, y, '8'));
    const spr = PX.get('item_' + def.id);
    if (spr) ctx.drawImage(spr.c, 3, 5);
    return c;
  }

  // ----------------------------------------------------------------------
  // Reversos
  // ----------------------------------------------------------------------
  function buildBack(kind) {
    const W = kind === 'item' ? 30 : 40, Hh = kind === 'item' ? 40 : 54;
    const { c, ctx } = cv(W, Hh);
    const g = PX.painter(ctx, W, Hh);
    const h = H(g);
    paintFrame(g, W, Hh, kind === 'item' ? ['s', '4', '5', '6'] : ['e', 'f', 'g', 'h']);
    // celosía de rombos
    for (let y = 4; y < Hh - 4; y++) for (let x = 4; x < W - 4; x++) {
      const u = (x - 4 + y) % 6, v = (x - 4 - y + 600) % 6;
      let col = (x + y) % 2 ? '2' : '1';
      if (u === 0 || v === 0) col = kind === 'item' ? 's' : '9';
      if ((u === 0 && v === 0)) col = kind === 'item' ? 't' : 'a';
      g.p(x, y, col);
    }
    // borde interior
    g.frame(5, 5, W - 10, Hh - 10, kind === 'item' ? '4' : 'e');
    // medallón central con la bola 8 maldita
    const cx = W / 2, cy = Hh / 2;
    const r = kind === 'item' ? 7 : 10;
    h.fill(C(cx, cy, r + 3), '0');
    h.fill(D(C(cx, cy, r + 2), C(cx, cy, r + 1)), kind === 'item' ? 't' : 'g');
    // rayos
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 + Math.PI / 8;
      const x1 = Math.round(cx + Math.cos(a) * (r + 6)), y1 = Math.round(cy + Math.sin(a) * (r + 6));
      h.p(x1, y1, kind === 'item' ? 'u' : 'h');
    }
    h.ball(cx, cy, r - 1, { col: ['0', '1', '2', '4'], num: kind === 'item' ? undefined : 8, numC: 'b', ol: '0' });
    if (kind === 'item') { h.fill(C(cx - 1, cy - 1, 2.3), '7'); h.p(Math.floor(cx) - 1, Math.floor(cy) - 1, 'b'); }
    // cuernos
    const hr = kind === 'item' ? 0.7 : 1;
    h.shade(U(Cap(cx - 5 * hr, cy - r + 1, cx - 8 * hr, cy - r - 4 * hr, 1.6, 0.4)), R.bone, {});
    h.shade(U(Cap(cx + 5 * hr, cy - r + 1, cx + 8 * hr, cy - r - 4 * hr, 1.6, 0.4)), R.bone, {});
    // esquinas: velitas
    [[7, 8], [W - 8, 8], [7, Hh - 9], [W - 8, Hh - 9]].forEach(([x, y]) => { h.p(x, y, 'h'); h.p(x, y + 1, 'v'); });
    return c;
  }

  // ----------------------------------------------------------------------
  // Sobres
  // ----------------------------------------------------------------------
  const PACKS = {
    arcano: { ramp: ['s', 't', 'u', '8'], body: ['2', 's', 't', 'u'], emb: 'pack_emb_arcano' },
    luna: { ramp: ['p', 'q', 'r', '8'], body: ['o', 'p', 'q', 'r'], emb: 'pack_emb_luna' },
    grabado: { ramp: ['e', 'g', 'h', 'i'], body: ['e', 'f', 'g', 'h'], emb: 'pack_emb_grabado' },
    maldito: { ramp: ['9', 'a', 'b', 'c'], body: ['0', '9', 'a', 'b'], emb: 'pack_emb_maldito' },
  };
  function buildPack(kind) {
    const pk = PACKS[kind] || PACKS.arcano;
    const { c, ctx } = cv(40, 54);
    const g = PX.painter(ctx, 40, 54);
    const h = H(g);
    const B = pk.body; // oscuro -> claro
    // silueta: cuerpo + dentado (zigzag) arriba y abajo
    const zz = (x) => (Math.floor(x) % 2 === 0 ? 1 : 0);
    const shape = (x, y) => x >= 1 && x < 39 && y >= 1 + zz(x) && y < 53 - zz(x);
    h.ol(shape, '0');
    for (let y = 0; y < 54; y++) for (let x = 0; x < 40; x++) {
      if (!shape(x + 0.5, y + 0.5)) continue;
      // gradiente metalizado por columnas + brillo diagonal
      const u = (x - 1) / 37;
      let i = u < 0.08 ? 2 : u < 0.2 ? 3 : u < 0.55 ? 2 : u < 0.85 ? 1 : 0;
      const d = (x + y * 0.5) % 40;
      if (d > 30 && d < 33) i = Math.min(3, i + 1);
      if (u > 0.2 && u < 0.26 && (x + y) % 2) i = 2;
      if (u > 0.5 && u < 0.58 && (x + y) % 2) i = 1;
      g.p(x, y, B[i]);
    }
    // franjas selladas (crimpado)
    for (let x = 1; x < 39; x++) {
      for (let y = 1; y < 6; y++) if (shape(x + 0.5, y + 0.5)) g.p(x, y, x % 2 ? pk.ramp[1] : pk.ramp[2]);
      for (let y = 48; y < 53; y++) if (shape(x + 0.5, y + 0.5)) g.p(x, y, x % 2 ? pk.ramp[0] : pk.ramp[1]);
    }
    g.rect(1, 6, 38, 1, '0'); g.rect(1, 47, 38, 1, '0');
    g.rect(1, 7, 38, 1, pk.ramp[3]);
    // muesca de apertura
    g.p(1, 9, '0'); g.p(2, 9, '0'); g.p(38, 9, '0'); g.p(37, 9, '0');
    // ventana del emblema (arco gótico)
    const win = U(Rc(6, 16, 28, 26), E(20, 16, 14, 6));
    h.ol(win, '0');
    for (let y = 0; y < 54; y++) for (let x = 0; x < 40; x++) if (win(x + 0.5, y + 0.5)) g.p(x, y, (x + y) % 2 ? '1' : '0');
    for (let y = 10; y < 43; y++) for (let x = 5; x < 35; x++) {
      if (!win(x + 0.5, y + 0.5)) continue;
      if (!win(x + 0.5, y - 0.5) || !win(x - 0.5, y + 0.5)) g.p(x, y, pk.ramp[3]);
      else if (!win(x + 0.5, y + 1.5) || !win(x + 1.5, y + 0.5)) g.p(x, y, pk.ramp[0]);
    }
    const em = PX.get(pk.emb);
    if (em) ctx.drawImage(em.c, 8, 15);
    // pips: cuántas cartas trae (3)
    for (let k = 0; k < 3; k++) { const x = 15 + k * 4; g.p(x, 44, pk.ramp[3]); g.p(x + 1, 44, pk.ramp[2]); g.p(x, 45, pk.ramp[2]); g.p(x + 1, 45, pk.ramp[1]); }
    // destellos
    h.star(5, 11, pk.ramp[2], '8'); h.star(35, 43, pk.ramp[2], '8');
    return c;
  }

  // ----------------------------------------------------------------------
  // Medallón de jefe (48x48)
  // ----------------------------------------------------------------------
  function buildMedal(def, state) {
    const { c, ctx } = cv(48, 48);
    const g = PX.painter(ctx, 48, 48);
    const h = H(g);
    const fin = !!def.final;
    const ring = fin ? R.gold : ['2', '3', '5', '6'];
    // púas (4 grandes + 4 pequeñas)
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 - Math.PI / 2;
      const big = k % 2 === 0, L = big ? 23.8 : 22, wd = big ? 0.2 : 0.16;
      const tip = [24 + Math.cos(a) * L, 24 + Math.sin(a) * L];
      const l = [24 + Math.cos(a - wd) * 18, 24 + Math.sin(a - wd) * 18];
      const r = [24 + Math.cos(a + wd) * 18, 24 + Math.sin(a + wd) * 18];
      h.shade(P([l, tip, r]), fin ? R.gold : R.steel, { bias: 0.2 });
    }
    h.shade(C(24, 24, 20), ring, { bias: 0.25 });
    h.fill(D(C(24, 24, 20), C(24.6, 24.6, 19.6)), fin ? 'e' : '2');
    h.fill(C(24, 24, 17.5), '0');
    h.fill(D(C(24, 24, 17.2), C(24, 24, 16.4)), fin ? 'v' : 'a');
    // interior radial
    for (let y = 0; y < 48; y++) for (let x = 0; x < 48; x++) {
      const d = Math.hypot(x + 0.5 - 24, y + 0.5 - 24);
      if (d > 16.2) continue;
      let col = '1';
      if (d < 9) col = (x + y) % 2 ? (fin ? 'a' : '9') : (fin ? '9' : '2');
      else if (d < 13) col = fin ? '9' : '2';
      else if (d < 15) col = (x + y) % 2 ? '1' : (fin ? '9' : '2');
      g.p(x, y, col);
    }
    // remaches en el anillo
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 - Math.PI / 2 + Math.PI / 8;
      const x = Math.round(24 + Math.cos(a) * 18.5 - 0.5), y = Math.round(24 + Math.sin(a) * 18.5 - 0.5);
      g.p(x, y, fin ? 'i' : '7'); g.p(x + 1, y + 1, '0');
    }
    const spr = PX.get('boss_' + def.id);
    if (spr) ctx.drawImage(spr.c, 8, 8);
    if (state === 'defeated') {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.globalAlpha = 0.55; ctx.fillStyle = Q('1'); ctx.fillRect(0, 0, 48, 48);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      // tajo
      for (let k = 0; k < 30; k++) {
        ctx.fillStyle = Q('0'); ctx.fillRect(9 + k, 8 + k, 3, 2);
        ctx.fillStyle = Q('c'); ctx.fillRect(10 + k, 8 + k, 1, 1);
        ctx.fillStyle = Q('b'); ctx.fillRect(11 + k, 9 + k, 1, 1);
      }
    } else if (state === 'locked') {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.globalAlpha = 0.7; ctx.fillStyle = Q('1'); ctx.fillRect(8, 8, 32, 32);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    return c;
  }

  // ======================================================================
  // API pública

  OM.CARDS = {
    drawJoker(ctx, def, x, y, opts) {
      if (!def) return;
      opts = opts || {};

      }
      let src = ent.base;

        src = ent.frames[f];

      drawCardCanvas(ctx, src, x, y, opts);
    },
    drawItem(ctx, def, x, y, opts) {

      drawCardCanvas(ctx, src, x, y, opts || {});
    },
    drawBack(ctx, x, y, kind, opts) {

      drawCardCanvas(ctx, src, x, y, opts || {});
    },
    drawPack(ctx, packKind, x, y, opts) {
      opts = opts || {};

        const sc = opts.scale || 1;
        ctx.fillRect(Math.round(x + 9 * sc), Math.round(y + (16 - lift) * sc), Math.round(22 * sc), Math.round(22 * sc));

    },
    drawBossMedal(ctx, def, x, y, opts) {

      const sc = opts.scale || 1;
      const bob = opts.hover ? -2 : 0;
      ctx.translate(Math.round(x), Math.round(y + bob));

        ctx.drawImage(getHalo(src, def.final ? 'h' : 'b'), -1, -1);
        ctx.globalAlpha = ga;
      }
      ctx.drawImage(src, 0, 0);
      if (opts.hover) {
        ctx.globalAlpha = ga * (0.6 + 0.3 * Math.sin(t * 6));
        ctx.drawImage(getHalo(src, '8'), -1, -1);
        ctx.globalAlpha = ga;
      }
      ctx.restore();
    },
    // utilidades extra (no contractuales)
    RARITY_RAMP: RAR,
    _cache: cache,
  };

  // ======================================================================

})();

      { t0: 14, t1: 16, w: 2, ramp: ['8', '7'] },
      { t0: 17, t1: 19, w: 2, ramp: ['r', 'q'] },
    ]);
    h.coin(16, 19, 2.6); h.coin(20.5, 15.5, 2.3);
    h.star(3, 3, 'h', '8', 1);
  });
  CU('hueso', (h) => {
    // vértebras
    for (let k = 0; k < 6; k++) {
      const x = 4 + k * 3, y = 19 - k * 3;
      h.shade(U(Cap(x - 1.6, y - 1.6, x + 1.6, y + 1.6, 1.3), C(x, y, 1.9)), R.bone, { bias: 0.3 });
      h.p(x - 2, y + 2, '6'); h.p(x + 2, y - 2, '6');
    }
    h.diag(23, [{ t0: 14, t1: 16, w: 2, ramp: ['8', '7'] }, { t0: 17, t1: 19, w: 2, ramp: ['r', 'q'] }]);
    h.skull(4, 20, 0.42, R.bone, {});
  });

  // ======================================================================
  // EMBLEMAS DE SOBRE 24x24
  // ======================================================================
  EM('arcano', (h) => {
    // tres cartas de tarot en abanico
    const card = (x, y, rot) => {
      const cs = Math.cos(rot), sn = Math.sin(rot);
      const pts = [[-4, -6], [4, -6], [4, 6], [-4, 6]].map(([a, b]) => [x + a * cs - b * sn, y + a * sn + b * cs]);
      return P(pts);
    };
    h.shade(card(7, 14, -0.4), ['s', 't', 'u', '8'], {});
    h.shade(card(17, 14, 0.4), ['s', 't', 'u', '8'], {});
    h.shade(card(12, 12, 0), ['3', '5', '6', '7'], { bias: 0.3 });
    h.fill(E(12, 12, 2.8, 1.8), '0'); h.fill(C(12, 12, 1), 't'); h.p(12, 12, '8');
    h.p(12, 8, 'h'); h.p(12, 16, 'h');
    h.star(3, 3, 'u', '8'); h.star(21, 4, 'u', '8');
  });
  EM('luna', (h) => {
    h.sphere(12, 12, 9, R.ice, { spec: false });
    h.fill(C(16, 9, 8), '0');
    h.ol(D(C(12, 12, 9), C(16, 9, 8)), '0');
    h.star(18, 15, 'r', '8', 1); h.star(5, 3, 'q', '8'); h.p(21, 21, 'r'); h.p(20, 4, 'q');
  });
  EM('grabado', (h) => {
    seal(h, R.gold, () => {
      h.rows(8, 7, ['0.....0', '00...00', '.0...0.', '.00.00.', '..000..', '...0...', '...0...', '..000..'].map((r) => r), {});
    });
    h.shade(Cap(17, 18, 22, 23, 1), R.woodD, {}); h.shade(Cap(15, 16, 17, 18, 1.4), R.steel, {});
  });
  EM('maldito', (h) => {
    h.halo(12, 14, 11.5, 'b', 'a');
    [[3, 4], [21, 3], [2, 20], [22, 19]].forEach(([x, y], i) => h.p(x, y, i % 2 ? 'v' : 'd'));
    horns(h, 12, 8, 4.5, 8, R.bone);
    h.sphere(12, 15, 8, ['1', '2', '3', '5'], { spec: '7', rimC: 'a' });
    h.fill(C(11.5, 14, 3.9), '7'); h.fill(D(C(11.5, 14, 3.9), C(10.9, 13.4, 3.7)), '6'); h.ol(C(11.5, 14, 3.9), '1');
    h.glyph(10, 12, OM.CARDS._lib.F3['8'], 'b');
    h.p(7, 10, '8');
  });
})();

<script>/* src/art/table_art.js */
// OCHO MALDITO — arte de MESA: temas por círculo, mesa, troneras, fondos de sala,
// bolas (con rodadura esférica y grabados), sombras, tacos, guía de tiro, niebla.
// Contrato: docs/ART_CONTRACT.md (sección "Agente MESA"). Solo paleta OM.PAL.
window.OM = window.OM || {};
OM.ART_INIT = OM.ART_INIT || [];

(function () {
  'use strict';
  const L = OM.LAYOUT;
  const TB = L.table, FE = L.felt;
  const BR = L.ballR; // 6

  // ------------------------------------------------------------------
  // Utilidades de píxel: buffer con claves de paleta → canvas
  // ------------------------------------------------------------------
  const RGB = {};
  function rgb(k) {
    let c = RGB[k];
    if (!c) {
      const h = OM.PAL[k];
      c = RGB[k] = [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
    }
    return c;
  }
  function PB(w, h) {
    this.w = w; this.h = h;
    this.k = new Array(w * h).fill(null);
    this.a = new Uint8Array(w * h).fill(255);
  }
  PB.prototype.set = function (x, y, c, a) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = y * this.w + x;
    this.k[i] = c; this.a[i] = a === undefined ? 255 : a;
  };
  PB.prototype.get = function (x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.k[y * this.w + x];
  };
  PB.prototype.toImageData = function (ctx) {
    const id = ctx.createImageData(this.w, this.h), d = id.data;
    for (let i = 0; i < this.k.length; i++) {
      const k = this.k[i];
      if (!k) continue;
      const c = rgb(k);
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = this.a[i];
    }
    return id;
  };
  PB.prototype.toCanvas = function () {
    const { c, ctx } = OM.PX.canvas(this.w, this.h);
    ctx.putImageData(this.toImageData(ctx), 0, 0);
    return c;
  };
  // contorno 1px (4-vecinos) alrededor de lo opaco
  PB.prototype.outline = function (col) {
    const pts = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) pts.push(x, y);
    }
    for (let i = 0; i < pts.length; i += 2) this.set(pts[i], pts[i + 1], col);
  };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const bayer = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];
  // elige color de una rampa con tramado ordenado (v en 0..1)
  // sharp > 1 estrecha la franja tramada entre tonos (menos ruido, bandas más limpias)
  function pick(ramp, v, x, y, sharp) {
    const n = ramp.length - 1;
    let f = Math.max(0, Math.min(n, v * n));
    let i = Math.floor(f);
    let fr = f - i;
    if (sharp) fr = clamp((fr - 0.5) * sharp + 0.5, 0, 1);
    if (fr > bayer(x, y)) i++;
    return ramp[Math.min(n, i)];
  }
  function hash(x, y, s) {
    const h = Math.sin(x * 127.1 + y * 311.7 + (s || 0) * 74.7) * 43758.5453;
    return h - Math.floor(h);
  }
  // relleno de círculo nítido por filas (mismo criterio que g.circle)
  function fillCircle(ctx, cx, cy, r) {
    cx |= 0; cy |= 0;
    for (let y = -r; y <= r; y++) {
      const w = Math.floor(Math.sqrt(Math.max(0, r * r + r * 0.8 - y * y)));
      ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
    }
  }

  // ------------------------------------------------------------------
  // TEMAS
  // ------------------------------------------------------------------
  // Rampas de 5 niveles: [más oscuro, oscuro, medio, claro, brillo]
  const THEMES = {
    limbo: {
      id: 'limbo', name: 'Limbo',
      felt: ['0', 'j', 'j', 'k', 'l'], wood: ['0', '1', '2', '3', '4'], rim: ['1', '3', '5', '6', '7'],
      sight: 'skull', sightC: ['2', '6', '7', '8'], sigil: 'eye', accent: '7', glow: '6',
      wall: ['0', '1', '1', '2', '3'], wallKind: 'stone', particles: 'dust', wax: ['5', '6', '7'], flame: ['v', 'h', 'i'],
      lightC: 'i',
    },
    lujuria: {
      id: 'lujuria', name: 'Lujuria',
      felt: ['1', '9', '9', 'a', 'b'], wood: ['0', '1', '9', 'e', 'f'], rim: ['e', 'f', 'g', 'h', 'i'],
      sight: 'diamond', sightC: ['e', 'g', 'h', 'i'], sigil: 'heart', accent: 'h', glow: 'u',
      wall: ['0', '1', '9', '9', 'a'], wallKind: 'curtain', particles: 'petals', wax: ['a', 'b', 'c'], flame: ['c', 'u', '8'],
      lightC: 'u',
    },
    gula: {
      id: 'gula', name: 'Gula',
      felt: ['j', 'k', 'k', 'l', 'm'], wood: ['1', '4', '6', '6', '7'], rim: ['2', '5', '6', '7', '8'],
      sight: 'tooth', sightC: ['3', '6', '7', '8'], sigil: 'maw', accent: 'm', glow: 'n',
      wall: ['0', '1', 'j', 'j', 'k'], wallKind: 'tiles', particles: 'spores', wax: ['l', 'm', 'n'], flame: ['m', 'n', '8'],
      lightC: 'n',
    },
    avaricia: {
      id: 'avaricia', name: 'Avaricia',
      felt: ['1', '2', '3', '3', '4'], wood: ['0', '1', '1', '2', 'e'], rim: ['e', 'g', 'h', 'i', '8'],
      sight: 'coin', sightC: ['e', 'g', 'h', 'i'], sigil: 'coin', accent: 'h', glow: 'h',
      wall: ['0', '1', '2', '2', '3'], wallKind: 'damask', particles: 'glints', wax: ['g', 'h', 'i'], flame: ['v', 'h', 'i'],
      lightC: 'h',
    },
    ira: {
      id: 'ira', name: 'Ira',
      felt: ['0', '9', '9', 'a', 'a'], wood: ['0', '1', '2', '3', '5'], rim: ['0', '2', '3', '5', '6'],
      sight: 'rivet', sightC: ['9', 'a', 'v', 'd'], sigil: 'star', accent: 'v', glow: 'd',
      wall: ['0', '1', '1', '9', '2'], wallKind: 'basalt', particles: 'embers', wax: ['1', '2', '3'], flame: ['b', 'v', 'h'],
      lightC: 'v',
    },
    abismo: {
      id: 'abismo', name: 'Abismo',
      felt: ['0', '1', '1', '2', '3'], wood: ['0', '0', '1', 'o', '2'], rim: ['0', 'o', 'p', 'q', 'r'],
      sight: 'rune', sightC: ['o', 'p', 'q', 'r'], sigil: 'runes', accent: 'r', glow: 'q',
      wall: ['0', '0', '1', '1', 'o'], wallKind: 'void', particles: 'motes', wax: ['2', '3', '4'], flame: ['p', 'q', 'r'],
      lightC: 'r',
    },
  };
  const themeOf = (t) => (typeof t === 'string' ? THEMES[t] : t && t.id ? THEMES[t.id] || t : null) || THEMES.limbo;

  // ------------------------------------------------------------------
  // TRONERAS (fuente de verdad para la física)
  // ------------------------------------------------------------------
  // Esquinas: 1px por fuera de la esquina del paño (diagonal). Laterales: 3px por fuera del borde.
  const POCKETS = [
    { id: 'tl', x: FE.x - 1, y: FE.y - 1, corner: true },
    { id: 'tm', x: FE.x + FE.w / 2, y: FE.y - 3, corner: false },
    { id: 'tr', x: FE.x + FE.w + 1, y: FE.y - 1, corner: true },
    { id: 'bl', x: FE.x - 1, y: FE.y + FE.h + 1, corner: true },
    { id: 'bm', x: FE.x + FE.w / 2, y: FE.y + FE.h + 3, corner: false },
    { id: 'br', x: FE.x + FE.w + 1, y: FE.y + FE.h + 1, corner: true },
  ];
  function pockets() {
    return POCKETS.map((p) => ({ x: p.x, y: p.y, corner: p.corner, id: p.id, r: L.pocketR }));
  }

  // ------------------------------------------------------------------
  // SIGILOS tejidos en el paño (máscaras 400x200)
  // ------------------------------------------------------------------
  function sigilMask(kind) {
    const W = FE.w, H = FE.h, m = new Uint8Array(W * H);
    const cx = W / 2, cy = H / 2;
    const P = (x, y) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) m[y * W + x] = 1; };
    const ring = (r, step) => {
      const n = Math.ceil(2 * Math.PI * r * 1.2);
      for (let i = 0; i < n; i++) { if (step && (i % step) > step / 2) continue; const a = (i / n) * Math.PI * 2; P(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    };
    const line = (x0, y0, x1, y1) => {
      const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)));
      for (let i = 0; i <= n; i++) P(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n);
    };
    const polar = (r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    if (kind === 'eye') {
      ring(46); ring(42, 6);
      for (let x = -30; x <= 30; x++) { const h = 15 * (1 - (x / 30) * (x / 30)); P(cx + x, cy - h); P(cx + x, cy + h); }
      ring(7); ring(3);
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const [x0, y0] = polar(48, a), [x1, y1] = polar(54, a); line(x0, y0, x1, y1); }
    } else if (kind === 'heart') {
      ring(48); ring(44, 4);
      for (let i = 0; i < 400; i++) {
        const a = i / 400 * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(a), 3), y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
        P(cx + x * 1.8, cy + y * 1.8 - 2);
      }
      for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; const [x, y] = polar(51, a); P(x, y); P(x + 1, y); P(x, y + 1); }
    } else if (kind === 'maw') {
      ring(48); ring(40);
      for (let i = 0; i < 18; i++) {
        const a0 = i / 18 * Math.PI * 2, a1 = (i + 0.5) / 18 * Math.PI * 2, a2 = (i + 1) / 18 * Math.PI * 2;
        const p0 = polar(40, a0), p1 = polar(28, a1), p2 = polar(40, a2);
        line(p0[0], p0[1], p1[0], p1[1]); line(p1[0], p1[1], p2[0], p2[1]);
      }
      ring(8);
    } else if (kind === 'coin') {
      ring(48); ring(44); ring(30);
      for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; const p0 = polar(44, a), p1 = polar(48, a); line(p0[0], p0[1], p1[0], p1[1]); }
      line(cx, cy - 22, cx + 14, cy); line(cx + 14, cy, cx, cy + 22); line(cx, cy + 22, cx - 14, cy); line(cx - 14, cy, cx, cy - 22);
      line(cx, cy - 12, cx, cy + 12);
    } else if (kind === 'star') {
      ring(48); ring(44, 5);
      const pts = []; for (let i = 0; i < 5; i++) pts.push(polar(44, -Math.PI / 2 + Math.PI + i * Math.PI * 2 / 5));
      for (let i = 0; i < 5; i++) { const a = pts[i], b = pts[(i + 2) % 5]; line(a[0], a[1], b[0], b[1]); }
    } else if (kind === 'runes') {
      ring(50); ring(46); ring(22); ring(18, 4);
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + 0.2;
        const [x, y] = polar(34, a);
        const v = i % 4;
        // runitas 5x7
        if (v === 0) { line(x, y - 3, x, y + 3); line(x, y - 3, x + 2, y - 1); line(x, y, x + 2, y + 2); }
        if (v === 1) { line(x - 2, y - 3, x + 2, y + 3); line(x + 2, y - 3, x - 2, y + 3); }
        if (v === 2) { line(x, y - 3, x, y + 3); line(x - 2, y - 1, x + 2, y - 1); line(x - 2, y + 2, x, y); }
        if (v === 3) { line(x - 2, y + 3, x, y - 3); line(x, y - 3, x + 2, y + 3); line(x - 1, y + 1, x + 1, y + 1); }
      }
      for (let x = -12; x <= 12; x++) { const h = 6 * (1 - (x / 12) * (x / 12)); P(cx + x, cy - h); P(cx + x, cy + h); }
      ring(2);
    }
    return m;
  }

  // ------------------------------------------------------------------
  // MESA (cacheada por tema + opciones)
  // ------------------------------------------------------------------
  const tableCache = {};
  // posiciones (locales a la mesa) de las miras de banda
  function sightPos() {
    const fx0 = FE.x - TB.x, fy0 = FE.y - TB.y, W = TB.w, H = TB.h, m = (fy0 - 6) / 2, mx = (fx0 - 6) / 2;
    const out = [];
    for (const fx of [50, 100, 150, 250, 300, 350]) { out.push([fx0 + fx, m]); out.push([fx0 + fx, H - 1 - m]); }
    for (const fy of [50, 100, 150]) { out.push([mx, fy0 + fy, fy === 100]); out.push([W - 1 - mx, fy0 + fy, fy === 100]); }
    return out;
  }
  let runeGlowC = null;
  function runeGlow() {
    if (runeGlowC) return runeGlowC;
    const R = ['.3.3.', '.333.', '..3..', '.3.3.', '3...3'];
    const pb = new PB(9, 9);
    for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) if (R[j][i] === '3') {
      for (const [a, b] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) if (!pb.get(i + 2 + a, j + 2 + b)) pb.set(i + 2 + a, j + 2 + b, 'q', 110);
    }
    for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) if (R[j][i] === '3') pb.set(i + 2, j + 2, '8');
    return (runeGlowC = pb.toCanvas());
  }
  const PAD = 8; // margen extra del canvas (sombra y faldón)
  function buildTable(th, sealed, ps) {
    const W = TB.w, H = TB.h;
    const pb = new PB(W + PAD * 2, H + PAD * 2);
    const fx0 = FE.x - TB.x, fy0 = FE.y - TB.y, fx1 = fx0 + FE.w, fy1 = fy0 + FE.h; // paño local [fx0,fx1)
    const CUSH = 6; // ancho del cojín
    const rh = Math.max(3, Math.round(L.pocketR * ps) - 1); // radio visible del agujero
    const cutR = rh + 3; // corte de los cojines
    const pk = POCKETS.map((p) => ({ x: p.x - TB.x, y: p.y - TB.y, corner: p.corner }));
    const sig = sigilMask(th.sigil);
    const R = 9; // esquina redondeada exterior
    const insideRR = (x, y) => {
      if (x < 0 || y < 0 || x >= W || y >= H) return false;
      const cx = x < R ? R : x > W - 1 - R ? W - 1 - R : x, cy = y < R ? R : y > H - 1 - R ? H - 1 - R : y;
      const dx = x - cx, dy = y - cy;
      return dx * dx + dy * dy <= R * R + R * 0.6;
    };
    const S = (x, y, c, a) => pb.set(x + PAD, y + PAD, c, a);

    // sombra de la mesa sobre el suelo + faldón frontal
    for (let y = 0; y < H + PAD; y++) for (let x = -3; x < W + 5; x++) {
      if (insideRR(x, y)) continue;
      if (insideRR(x - 3, y - 6)) S(x, y, '0', 150);
      else if (insideRR(x - 2, y - 4) || insideRR(x - 4, y - 7)) S(x, y, '0', 70);
    }
    for (let x = 0; x < W; x++) for (let y = H - 1; y < H + 4; y++) {
      if (!insideRR(x, Math.min(y, H - 1)) || insideRR(x, y)) continue;
      if (!insideRR(x, H - 1 - (y - H + 1) * 0) ) continue;
      const v = y === H + 3 ? 0 : 0.35 - (y - H) * 0.08 + hash(x, 3) * 0.1;
      S(x, y, y === H + 3 ? '0' : pick(th.wood.slice(0, 3), v, x, y));
    }

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!insideRR(x, y)) continue;
      // tronera más cercana
      let dp = 1e9, P = null;
      for (const p of pk) { const d = Math.hypot(x + 0.5 - p.x - 0.5, y + 0.5 - p.y - 0.5); if (d < dp) { dp = d; P = p; } }
      const inFelt = x >= fx0 && x < fx1 && y >= fy0 && y < fy1;
      // distancia (fuera) al paño
      const ox = x < fx0 ? fx0 - x : x >= fx1 ? x - fx1 + 1 : 0;
      const oy = y < fy0 ? fy0 - y : y >= fy1 ? y - fy1 + 1 : 0;
      const dOut = Math.max(ox, oy);
      const sealedP = sealed && P && !P.corner;
      // --- agujero ---
      // las laterales solo muerden 4px del paño (boca recta, como en una mesa real)
      const sideClip = P && !P.corner && (P.y < fy0 ? y >= fy0 + 4 : y < fy1 - 4);
      if (dp <= rh && !sealedP && !sideClip) {
        const ang = Math.atan2(y - P.y, x - P.x);
        const edge = dp > rh - 2.2;
        let c = '0';
        const lipRow = P && !P.corner && (P.y < fy0 ? y === fy0 + 3 : y === fy1 - 4);
        if (lipRow) c = '0';
        else if (edge && Math.sin(ang) > 0.25) c = dp > rh - 1.2 ? th.felt[0] === '0' ? '2' : th.felt[1] : '1'; // pared lejana iluminada
        else if (dp > rh - 1.2) c = '0';
        else if (dp < rh * 0.55 && hash(x, y, 4) < 0.18) c = '1'; // red/bolsa
        S(x, y, c);
        continue;
      }
      if (inFelt) {
        // --- PAÑO ---
        const lx = x - fx0, ly = y - fy0;
        const dx = (lx - FE.w / 2) / (FE.w * 0.62), dy = (ly - FE.h / 2) / (FE.h * 0.7);
        let v = 0.82 - (dx * dx + dy * dy) * 0.62;
        // sombra de cojines (luz cenital ligeramente hacia el jugador)
        if (ly < 2) v -= (2 - ly) * 0.09;
        if (lx < 2) v -= (2 - lx) * 0.1;
        if (lx > FE.w - 3) v -= (lx - FE.w + 3) * 0.08;
        if (ly > FE.h - 2) v -= 0.05;
        // labio de la tronera
        if (!sealedP && !sideClip && dp <= rh + 2.5) v -= dp <= rh + 1.2 ? 0.5 : 0.22;
        if (sideClip && !sealedP && dp <= rh + 0.5 && (P.y < fy0 ? y === fy0 + 4 : y === fy1 - 5)) v -= 0.3;
        // pelusa del paño
        const hn = hash(lx, ly, 1);
        if (hn < 0.03) v += 0.1; else if (hn > 0.965) v -= 0.12;
        // vetas muy sutiles del tejido
        if (((lx + ly * 3) % 23) === 0 && hash(lx, ly, 2) < 0.5) v -= 0.06;
        let c = pick(th.felt, v, x, y, 2.6);
        // sigilo tejido
        if (sig[ly * FE.w + lx] && ((lx + ly) & 1) === 0) {
          const i = th.felt.indexOf(c);
          c = th.felt[Math.max(0, i - 1)];
          if (c === th.felt[Math.max(0, i)] && i > 0) c = th.felt[i - 1];
        }
        // puntos de salida / pie
        if ((lx === 100 || lx === 300) && ly === 100) c = th.felt[4];
        if (((lx === 99 || lx === 101) && ly === 100) || (lx === 100 && (ly === 99 || ly === 101))) c = th.felt[3];
        S(x, y, c);
        continue;
      }
      // --- fuera del paño ---
      const inCushBand = dOut >= 1 && dOut <= CUSH;
      if (inCushBand) {
        // ¿está cortado el cojín por la tronera? (mandíbulas en ángulo hacia la boca)
        let cut = false, along = 0, js = 0;
        if (ox > 0 && oy > 0) cut = true;
        else if (!sealedP && P) {
          along = oy > 0 ? Math.abs(x + 0.5 - P.x) : Math.abs(y + 0.5 - P.y);
          if (P.corner) js = rh + 2 + (CUSH - dOut) * 0.9;
          else js = rh + 0.5 + (CUSH - dOut) * 0.6;
          cut = along < js;
        }
        if (sealedP && dp <= cutR + 8) cut = false;
        if (cut) {
          // embudo/delantal de la tronera
          const v = 0.3 - (cutR - Math.min(dp, cutR)) * 0.05 + (hash(x, y, 7) - 0.5) * 0.08;
          S(x, y, pick(th.felt.slice(0, 3), v, x, y, 2));
          continue;
        }
        const jaw = js > 0 && along < js + 1;
        // cojín: d=1 sombra del morro, d=2 brillo del morro, cara superior, d=CUSH junta oscura
        const d = dOut;
        const top = y < fy0, left = x < fx0;
        const prof = top || left ? [0, 1, 4, 4, 3, 3, 1] : [0, 2, 4, 4, 3, 3, 1];
        let c = th.felt[prof[d]];
        if (d >= 3 && d <= 4 && hash(x, y, 13) < 0.12) c = th.felt[2];
        // cara de la mandíbula
        if (jaw) c = dOut <= 2 ? th.felt[4] : th.felt[3];
        S(x, y, c);
        continue;
      }
      // --- MADERA / aro metálico ---
      if (!sealedP && dp <= rh + 4.2) {
        // aro metálico
        const ang = Math.atan2(y - P.y, x - P.x);
        const lit = -Math.cos(ang + Math.PI * 0.25 + Math.PI); // luz arriba-izq
        let c;
        if (dp > rh + 3.3) c = '0';
        else c = pick(th.rim, 0.5 + lit * 0.42 + (dp < rh + 1 ? -0.25 : dp > rh + 2.4 ? 0.12 : 0), x, y, 2.5);
        if (hash(x, y, 9) < 0.06) c = th.rim[4];
        S(x, y, c);
        continue;
      }
      // madera
      const eo = Math.min(x, y, W - 1 - x, H - 1 - y); // distancia al borde exterior
      const rail = dOut; // 7..18
      const horiz = (y < fy0 - CUSH || y >= fy1 + CUSH) && x >= fx0 - CUSH && x < fx1 + CUSH;
      let c;
      if (!insideRR(x - 1, y) || !insideRR(x + 1, y) || !insideRR(x, y - 1) || !insideRR(x, y + 1)) c = '0';
      else if (rail === CUSH + 1) c = th.wood[0]; // junta con cojín
      else {
        const u = horiz ? x : y, w = horiz ? y : x;
        const grain = Math.sin(u * 0.045 + Math.sin(u * 0.011 + w * 0.9) * 2.2 + w * 1.7) * 0.5 + 0.5;
        let v = 0.42 + grain * 0.22 + (hash(u >> 2, w, 3) - 0.5) * 0.12;
        if (eo === 1) v = (y < H / 2 && horiz) || (x < W / 2 && !horiz) ? 0.95 : 0.6;
        else if (eo === 2) v += 0.12;
        if (rail === CUSH + 2) v -= 0.18;
        c = pick(th.wood, v, x, y, 2);
      }
      S(x, y, c);
    }

    // --- miras (diamantes) temáticas ---
    const sights = sightPos();
    const SIGHT = {
      skull: ['.111.', '13331', '12121', '.131.', '.1.1.'],
      diamond: ['..3..', '.323.', '32223', '.313.', '..1..'],
      tooth: ['.333.', '32223', '.323.', '.32.', '..1..'],
      coin: ['.111.', '13321', '13221', '12221', '.111.'],
      rivet: ['.000.', '01120', '01210', '02220', '.000.'],
      rune: ['.3.3.', '.333.', '..3..', '.3.3.', '3...3'],
    }[th.sight];
    for (const [sx, sy] of sights) {
      for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) {
        const ch = SIGHT[j][i];
        if (!ch || ch === '.') continue;
        if (th.sight === 'rune' && ch === '3') { S(sx - 2 + i, sy - 2 + j, th.sightC[2]); continue; }
        S(sx - 2 + i, sy - 2 + j, th.sightC[+ch]);
      }
    }
    // remaches de esquina / decoración por tema
    const rivet = (x, y) => { S(x, y, th.rim[3]); S(x + 1, y, th.rim[1]); S(x, y + 1, th.rim[1]); S(x + 1, y + 1, th.rim[0]); };
    if (th.id === 'ira' || th.id === 'lujuria' || th.id === 'avaricia') {
      for (let x = 30; x < W - 30; x += th.id === 'ira' ? 25 : 50) {
        if (Math.abs(x - W / 2) < 18) continue;
        if (sights.some((s) => Math.abs(s[0] - x) < 6)) continue;
        rivet(x, 3); rivet(x, H - 5);
      }
    }
    // placas en los centros de las bandas cortas (calavera / emblema)
    const PLATE = {
      limbo: ['..1111..', '.177771.', '17077071', '17777771', '.170071.', '..1771..', '..1..1..'],
      lujuria: ['.11.11..', '1hh1hh1.', '1hhhhh1.', '.1hhh1..', '..1h1...', '...1....'],
      gula: ['.111111.', '17777771', '1070070.', '17777771', '.1m11m1.', '..m..m..', '..m.....'],
      avaricia: ['..1111..', '.1hhhh1.', '1hh1hhh1', '1h1hhhh1', '1hh11hh1', '1hhhh1h1', '.1hhhh1.', '..1111..'],
      ira: ['1......1', '11....11', '.1aaaa1.', '1avvvva1', '1a0aa0a1', '.1aaaa1.', '..1111..'],
      abismo: ['...11...', '..1rr1..', '.1r00r1.', '1rr00rr1', '.1r00r1.', '..1rr1..', '...11...'],
    }[th.id];
    if (PLATE) {
      for (const px of [Math.round((fx0 - CUSH) / 2) - 4, W - 1 - Math.round((fx0 - CUSH) / 2) - 3]) {
        // ocultar la mira central (y=100) bajo la placa
        const py = fy0 + 100 - Math.floor(PLATE.length / 2);
        for (let j = -1; j <= PLATE.length; j++) for (let i = -1; i <= 8; i++) {
          const ch = PLATE[j] && PLATE[j][i];
          if (ch && ch !== '.') S(px + i, py + j, ch);
          else if (j >= 0 && j < PLATE.length && i >= 0 && i < 8) { /* deja la madera */ }
        }
      }
    }
    return pb.toCanvas();
  }

  function tableCanvas(th, sealed, ps) {
    const key = th.id + '|' + (sealed ? 1 : 0) + '|' + Math.round(ps * 100);
    let c = tableCache[key];
    if (!c) c = tableCache[key] = buildTable(th, !!sealed, ps);
    return c;
  }

  // tablón sellador con cadena para troneras laterales
  let sealSprite = null;
  function getSeal() {
    if (sealSprite) return sealSprite;
    const pb = new PB(38, 18);
    // dos tablones clavados
    for (const [y0, x0, x1] of [[2, 1, 36], [9, 2, 35]]) {
      for (let y = y0; y < y0 + 6; y++) for (let x = x0; x <= x1; x++) {
        const r = y - y0;
        let c = r === 0 ? 'g' : r === 5 ? 'e' : 'f';
        if ((r === 2 || r === 3) && hash(x >> 2, y0 + r, 5) < 0.3) c = 'e';
        if (x === x0 || x === x1) c = 'e';
        pb.set(x, y, c);
      }
      for (const nx of [x0 + 2, x1 - 2]) { pb.set(nx, y0 + 2, '7'); pb.set(nx, y0 + 3, '3'); }
    }
    // cadena horizontal
    for (let x = 0; x < 38; x += 5) {
      pb.set(x, 7, '5'); pb.set(x + 1, 6, '6'); pb.set(x + 2, 6, '6'); pb.set(x + 3, 7, '5');
      pb.set(x + 1, 8, '3'); pb.set(x + 2, 8, '3'); pb.set(x + 4, 7, '6');
    }
    // candado
    pb.set(17, 4, '6'); pb.set(18, 3, '7'); pb.set(19, 3, '7'); pb.set(20, 4, '6'); pb.set(17, 5, '5'); pb.set(20, 5, '5');
    for (let y = 6; y < 12; y++) for (let x = 16; x < 22; x++) pb.set(x, y, y === 6 ? 'i' : y === 11 ? 'g' : x === 16 ? 'i' : 'h');
    pb.set(18, 8, '0'); pb.set(18, 9, '0'); pb.set(19, 8, '0');
    pb.outline('0');
    return (sealSprite = pb.toCanvas());
  }

  function drawTable(ctx, theme, t, opts) {
    const th = themeOf(theme);
    opts = opts || {};
    t = t || 0;
    const ps = opts.pocketScale || 1;
    ctx.drawImage(tableCanvas(th, opts.sealedSides, ps), TB.x - PAD, TB.y - PAD);
    if (opts.sealedSides) {
      const s = getSeal();
      for (const p of POCKETS) if (!p.corner) ctx.drawImage(s, p.x - 19, (p.y < FE.y ? FE.y - 14 : FE.y + FE.h - 4));
    }
    // animados por tema
    ctx.save();
    if (th.id === 'abismo') {
      // el sigilo respira en cian
      const a = 0.08 + 0.06 * Math.sin(t * 1.3);
      ctx.globalAlpha = a;
      ctx.drawImage(sigilGlow(th), FE.x, FE.y);
      // runas de banda que se encienden en ola
      const rg = runeGlow();
      sightPos().forEach((sp, i) => {
        if (sp[2]) return;
        const k = Math.max(0, Math.sin(t * 1.6 - (sp[0] + sp[1]) * 0.02));
        ctx.globalAlpha = k * k * 0.85;
        ctx.drawImage(rg, TB.x + sp[0] - 4, TB.y + sp[1] - 4);
      });
    } else if (th.id === 'ira') {
      // grietas incandescentes en los raíles
      ctx.fillStyle = OM.PAL.v;
      for (let i = 0; i < 14; i++) {
        const k = Math.max(0, Math.sin(t * 1.7 + i * 2.3));
        ctx.globalAlpha = k * 0.55;
        const x = TB.x + 24 + ((i * 97) % (TB.w - 48)), top = i % 2 === 0;
        const y = top ? TB.y + 2 : TB.y + TB.h - 4;
        ctx.fillRect(x, y, 3, 1); ctx.fillRect(x + 2, y + 1, 2, 1); ctx.fillRect(x - 1, y + (top ? 1 : -1), 1, 1);
      }
    } else if (th.id === 'gula') {
      // gotas de baba resbalando por el canto
      ctx.fillStyle = OM.PAL.m;
      for (let i = 0; i < 5; i++) {
        const ph = (t * 0.25 + i * 0.37) % 1;
        const x = TB.x + 40 + i * 83;
        ctx.globalAlpha = 0.8 * (1 - ph);
        ctx.fillRect(x, TB.y + TB.h, 1, 1 + Math.floor(ph * 5));
        ctx.fillRect(x, TB.y + TB.h + 1 + Math.floor(ph * 5), 2, 1);
      }
    } else {
      // destello lento sobre los aros de tronera
      const p = POCKETS[Math.floor(t / 2.5) % 6], ph = (t % 2.5) / 2.5;
      if (ph < 0.35) {
        ctx.globalAlpha = Math.sin(ph / 0.35 * Math.PI) * 0.9;
        ctx.fillStyle = OM.PAL[th.rim[4]];
        const ang = -2.2 + ph * 2;
        const x = Math.round(p.x + Math.cos(ang) * (L.pocketR * ps + 1)), y = Math.round(p.y + Math.sin(ang) * (L.pocketR * ps + 1));
        ctx.fillRect(x, y, 1, 1); ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
      }
    }
    ctx.restore();
  }

  const sigilGlowCache = {};
  function sigilGlow(th) {
    if (sigilGlowCache[th.id]) return sigilGlowCache[th.id];
    const m = sigilMask(th.sigil), pb = new PB(FE.w, FE.h);
    for (let i = 0; i < m.length; i++) if (m[i]) pb.k[i] = th.accent;
    return (sigilGlowCache[th.id] = pb.toCanvas());
  }

  // ------------------------------------------------------------------
  // FONDOS DE SALA
  // ------------------------------------------------------------------
  const backCache = {};
  const SCONCES = [[186, 118], [186, 262], [634, 118], [634, 262]];
  function inUI(x, y) { return (x >= 4 && x <= 184 && y >= 4 && y <= 356) || (y >= 4 && y <= 66 && x >= 186 && x <= 636); }
  function buildBackdrop(th) {
    const W = OM.W, H = OM.H, pb = new PB(W, H);
    const tcx = TB.x + TB.w / 2, tcy = TB.y + TB.h / 2;
    const floorY = 318;
    const w = th.wall;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      // luz: charco alrededor de la mesa + viñeta
      const lx = (x - tcx) / 330, ly = (y - tcy) / 230;
      let light = 0.74 - (lx * lx + ly * ly) * 0.62;
      const vx = (x - W / 2) / (W / 2), vy = (y - H / 2) / (H / 2);
      light -= Math.max(0, vx * vx + vy * vy - 0.7) * 0.35;
      let v = light, c = null;
      if (y >= floorY) {
        // suelo de tablones en ligera perspectiva
        const fy = y - floorY;
        const plank = Math.floor((x - tcx) / (22 + fy * 0.8) + 100);
        const edge = Math.abs(((x - tcx) / (22 + fy * 0.8)) % 1) < 0.06;
        v = light * 0.8 + (hash(plank, 1, 3) - 0.5) * 0.12 - 0.05;
        if (edge || fy === 0) v -= 0.25;
        if (fy === 1) v += 0.1;
        c = pick(['0', '1', '2', 'e', 'f'], v * 0.85, x, y, 2);
      } else {
        let k = 0;
        switch (th.wallKind) {
          case 'stone': {
            const row = Math.floor(y / 14), off = (row % 2) * 13;
            const bx = (x + off) % 26, by = y % 14;
            const id = Math.floor((x + off) / 26) + row * 31;
            if (bx === 0 || by === 0) k = -0.3; else if (by === 1 || bx === 1) k = 0.06;
            k += (hash(id, row, 1) - 0.5) * 0.18 + (hash(x, y, 2) < 0.05 ? -0.12 : 0);
            if (hash(x >> 1, y >> 1, 8) < 0.02 && by > 9) c = 'j'; // musgo
            break;
          }
          case 'curtain': {
            const f = Math.sin(x * 0.19 + Math.sin(x * 0.031) * 3);
            k = f * 0.22 - (y < 30 ? 0 : 0) + (y > 280 ? -0.1 : 0);
            if (y === 22 || y === 23) c = y === 22 ? 'h' : 'g'; // barra de latón
            if (y < 22) k -= 0.15;
            break;
          }
          case 'tiles': {
            const tx = x % 14, ty = y % 14;
            if (tx === 0 || ty === 0) k = -0.3;
            else if (tx === 1 || ty === 1) k = 0.12;
            k += (hash(Math.floor(x / 14), Math.floor(y / 14), 5) - 0.5) * 0.2;
            // chorretones de baba
            const col = Math.floor(x / 9);
            const len = hash(col, 0, 6) < 0.3 ? 10 + hash(col, 1, 6) * 70 : 0;
            const xo = x % 9;
            const bulb = y > len - 4 && y < len && xo >= 2 && xo <= 5;
            if ((y < len && xo >= 3 && xo <= 4) || bulb) { c = pick(['j', 'k', 'l', 'm'], light * 0.9 + (xo === 3 ? 0.15 : 0) - y / 400, x, y, 2); }
            break;
          }
          case 'damask': {
            const px = (x % 24) - 12, py = (y % 30) - 15;
            const dm = Math.abs(px) / 12 + Math.abs(py) / 15;
            if (Math.abs(dm - 0.75) < 0.07 || (Math.abs(px) < 2 && Math.abs(py) < 2)) k = 0.18;
            if (y > 230 && y < 236) { c = y === 230 ? 'h' : y === 235 ? 'e' : 'g'; }
            if (y >= 236) { k = (x % 40 === 0 || x % 40 === 1) ? -0.2 : 0.05; }
            break;
          }
          case 'basalt': {
            // placas de basalto (voronoi) con grietas de lava
            const gx = Math.floor(x / 30), gy = Math.floor(y / 26);
            let d1 = 1e9, d2 = 1e9, id = 0;
            for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
              const cx = (gx + i) * 30 + hash(gx + i, gy + j, 1) * 30, cy = (gy + j) * 26 + hash(gx + i, gy + j, 2) * 26;
              const d = Math.hypot(x - cx, y - cy);
              if (d < d1) { d2 = d1; d1 = d; id = (gx + i) * 57 + gy + j; } else if (d < d2) d2 = d;
            }
            const e = d2 - d1;
            k = (hash(id, 0, 3) - 0.5) * 0.3 + (e > 3 && e < 5 ? 0.08 : 0) + (hash(x, y, 1) < 0.06 ? -0.12 : 0);
            const hot = hash(id, 1, 4) < 0.45;
            if (e < 1.1) c = hot && light > 0.3 ? (e < 0.5 && light > 0.45 ? 'v' : 'b') : '9';
            else if (e < 2.2 && hot && light > 0.35) c = (x + y) & 1 ? '9' : null;
            break;
          }
          case 'void': {
            k = -0.1 + Math.sin(x * 0.01 + y * 0.02) * 0.08;
            if (hash(x, y, 11) < 0.004) c = hash(x, y, 12) < 0.5 ? '4' : 'p';
            break;
          }
        }
        v = light + k;
        if (!c) c = pick(w, v, x, y, 2);
      }
      pb.set(x, y, c || '0');
    }
    // apliques de vela: soporte de latón
    for (const [sx, sy] of SCONCES) {
      for (let j = 0; j < 4; j++) pb.set(sx - 2 + j, sy + 10, 'g');
      pb.set(sx - 2, sy + 11, 'f'); pb.set(sx + 1, sy + 11, 'f'); pb.set(sx - 1, sy + 12, 'e'); pb.set(sx, sy + 12, 'e');
      pb.set(sx - 1, sy + 13, 'e'); pb.set(sx - 2, sy + 9, '0'); pb.set(sx + 1, sy + 9, '0');
      for (let j = 0; j < 9; j++) { pb.set(sx - 1, sy + 1 + j, th.wax[j < 2 ? 2 : 1]); pb.set(sx, sy + 1 + j, th.wax[j < 1 ? 2 : 0]); }
      pb.set(sx - 1, sy + 3, th.wax[2]); pb.set(sx - 1, sy + 4, th.wax[2]); // goterón
      pb.set(sx - 2, sy + 1, '0'); pb.set(sx + 1, sy + 1, '0');
    }
    return pb.toCanvas();
  }

  let glowSprites = {};
  function glowSprite(col, r) {
    const key = col + r;
    if (glowSprites[key]) return glowSprites[key];
    const pb = new PB(r * 2 + 1, r * 2 + 1);
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const d = Math.sqrt(x * x + y * y) / r;
      if (d > 1) continue;
      const a = (1 - d) * (1 - d);
      if (a > bayer(x + r, y + r) * 0.9) pb.set(x + r, y + r, col, Math.round(40 + a * 120));
    }
    return (glowSprites[key] = pb.toCanvas());
  }

  function drawBackdrop(ctx, theme, t) {
    const th = themeOf(theme);
    t = t || 0;
    let c = backCache[th.id];
    if (!c) c = backCache[th.id] = buildBackdrop(th);
    ctx.drawImage(c, 0, 0);
    ctx.save();
    // velas
    for (let i = 0; i < SCONCES.length; i++) {
      const [sx, sy] = SCONCES[i];
      const fl = Math.sin(t * 9 + i * 2.1) * 0.5 + Math.sin(t * 23 + i) * 0.3;
      ctx.globalAlpha = 0.55 + fl * 0.15;
      const gs = glowSprite(th.flame[1], 16);
      ctx.drawImage(gs, sx - 16, sy - 18);
      ctx.globalAlpha = 1;
      const h = 4 + (fl > 0.3 ? 1 : 0), lean = Math.round(Math.sin(t * 3.1 + i) * 0.7);
      ctx.fillStyle = OM.PAL[th.flame[0]]; ctx.fillRect(sx - 1, sy - h + 1, 2, h - 1);
      ctx.fillRect(sx - 1 + lean, sy - h, 1, 1);
      ctx.fillStyle = OM.PAL[th.flame[1]]; ctx.fillRect(sx - 1, sy - h + 2, 2, h - 3);
      ctx.fillStyle = OM.PAL[th.flame[2]]; ctx.fillRect(sx - 1, sy - 1, 1, 1);
      ctx.fillStyle = OM.PAL['0']; ctx.fillRect(sx, sy, 1, 1);
    }
    // partículas ambientales deterministas
    const P = th.particles;
    const N = 46;
    for (let i = 0; i < N; i++) {
      const r1 = hash(i, 1, 21), r2 = hash(i, 2, 21), r3 = hash(i, 3, 21);
      let x, y, col, a;
      if (P === 'dust') {
        x = (r1 * 640 + t * (3 + r3 * 4) + Math.sin(t * 0.5 + i) * 6) % 640;

  // ------------------------------------------------------------------

  // ------------------------------------------------------------------
  const BALL_RAMP = {

  // world -> local (inversa de la rotación por rodadura)
  function toLocal(x, y, z, ax, ay) {

  function genBall(ctx, num, kind, holoF, ix, iy, ox, oy) {
    const ax = (ix / STEPS) * Math.PI * 2, ay = (iy / STEPS) * Math.PI * 2;
    const pb = new PB(CELL, CELL);

    const base = BALL_RAMP[num <= 8 ? num : num - 8];

    for (let py = 0; py < CELL; py++) for (let px = 0; px < CELL; px++) {
      const dx = px - 6, dy = py - 6;

    if (kind === 'cristal') { pb.set(8, 9, 'r', 255); pb.set(9, 8, 'r', 255); pb.set(3, 3, '8', 255); }

  }

  function ballCell(num, kind, holoF, ix, iy) {
    const key = num + '|' + kind + (kind === 'holo' ? holoF : '');
    let A = atlases[key];
    if (!A) {
      const { c, ctx } = OM.PX.canvas(STEPS * CELL, STEPS * CELL);

    }

  // sprites auxiliares de bola
  let shadowC = null, auraC = null;

    let pb = new PB(15, 9);

  function drawBallShadow(ctx, x, y) {

  function drawBall(ctx, ball, x, y, t) {

      ctx.globalAlpha = ga;

      ctx.fillStyle = P.g; ctx.fillRect(X + 1, Y - 10, 1, 2); ctx.fillRect(X + 2, Y - 11, 1, 1);
      ctx.fillStyle = P.e; ctx.fillRect(X + 1, Y - 9, 1, 1);

      ctx.fillStyle = P[['v', 'h', 'd'][k]];
      if (k === 0) { ctx.fillRect(X + 4, Y - 13, 1, 1); ctx.fillRect(X + 2, Y - 13, 1, 1); }
      if (k === 1) { ctx.fillRect(X + 4, Y - 12, 1, 1); ctx.fillRect(X + 3, Y - 14, 1, 1); }

  // ------------------------------------------------------------------

  // ------------------------------------------------------------------
  const CUE_L = 180, CUE_H = 17, CUE_CY = 8;
  const cueCache = {};
  function cueSpec(id) {

    const S = {

        [0, 3, ['0', '1', '2']], [4, 5, ['f', 'g', 'h']], [6, 34, ['9', 'e', 'f'], 'grain'],
        [35, 36, ['6', '7', '8']], [37, 62, ['1', '2', '3'], 'wrap'], [63, 64, ['6', '7', '8']],
        [65, 102, ['f', 'g', 'i'], 'points'], [103, 106, ['g', 'h', 'i']], [107, 171, ['g', 'i', '8'], 'grain'],
        [172, 176, ['6', '7', '8']], [177, 179, ['p', 'q', 'r']],
      ],
      sangriento: [
        [0, 3, ['0', '1', '9']], [4, 40, ['0', '9', 'a'], 'spikes'], [41, 42, ['5', '6', '7']],
        [43, 66, ['0', '1', '2'], 'wrap'], [67, 68, ['5', '6', '7']], [69, 104, ['9', 'a', 'b'], 'drips'],
        [105, 108, ['3', '5', '6']], [109, 171, ['e', 'f', 'g'], 'bloodfade'], [172, 176, ['6', '7', '8']], [177, 179, ['a', 'b', 'c']],
      ],

        [0, 4, ['g', 'h', 'i']], [5, 44, ['0', '1', '2'], 'coins'], [45, 46, ['h', 'i', '8']],
        [47, 70, ['e', 'g', 'h'], 'stripes'], [71, 72, ['h', 'i', '8']], [73, 104, ['1', '2', '3'], 'coins'],
        [105, 109, ['g', 'h', 'i']], [110, 171, ['f', 'g', 'h'], 'grain'], [172, 176, ['h', 'i', '8']], [177, 179, ['p', 'q', 'r']],
      ],
      hueso: [
        [0, 11, ['5', '6', '7'], 'skull'], [12, 104, ['5', '6', '7'], 'spine'], [105, 108, ['4', '5', '6']],
        [109, 171, ['6', '7', '8'], 'bone'], [172, 176, ['7', '8', '8']], [177, 179, ['p', 'q', 'r']],

  function buildCue(id) {

  }
  function drawCue(ctx, cueId, tipX, tipY, angle, pull, t) {

    ctx.rotate(angle);
    ctx.drawImage(C.s, -(CUE_L + 1), -CUE_CY);
    ctx.restore();
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(Math.round(bx), Math.round(by));
    ctx.rotate(angle);

  // ------------------------------------------------------------------
  // GUÍA DE TIRO
  // ------------------------------------------------------------------

      const seg = Math.hypot(B.x - A.x, B.y - A.y);
      while (next <= acc + seg) {
        const k = (next - acc) / seg;
        const x = Math.round(A.x + (B.x - A.x) * k), y = Math.round(A.y + (B.y - A.y) * k);

  }

  // ------------------------------------------------------------------
  // RESPLANDOR DE TRONERA, NIEBLA, RACK
  // ------------------------------------------------------------------
  function drawPocketGlow(ctx, pocket, t, color) {

    t = t || 0;

  let fogC = null;
  function drawFog(ctx, cx, cy, radius, t) {
    t = t || 0;
    if (!fogC) fogC = OM.PX.canvas(OM.W, OM.H);
    const f = fogC.ctx;
    f.globalCompositeOperation = 'source-over';
    f.globalAlpha = 1;
    f.clearRect(0, 0, OM.W, OM.H);
    f.fillStyle = OM.PAL['0'];
    f.fillRect(0, 0, OM.W, OM.H);
    // jirones de niebla: vetas horizontales tramadas que derivan
    for (let i = 0; i < 42; i++) {
      const len = 40 + hash(i, 3, 30) * 140, sp = 4 + (i % 5) * 2;
      const x = ((hash(i, 1, 30) * (OM.W + len) + t * sp) % (OM.W + len)) - len;
      const y = Math.round(hash(i, 2, 30) * OM.H + Math.sin(t * 0.5 + i) * 3);
      f.fillStyle = OM.PAL[i % 3 ? '2' : '3'];
      f.globalAlpha = 0.35;
      f.fillRect(Math.round(x), y, Math.round(len), 1);
      f.globalAlpha = 0.18;
      f.fillRect(Math.round(x + len * 0.15), y - 1, Math.round(len * 0.6), 1);
      f.fillRect(Math.round(x + len * 0.25), y + 1, Math.round(len * 0.5), 1);

    for (const [r, a] of steps) { f.globalAlpha = a; fillCircle(f, cx, cy, Math.max(1, Math.round(r))); }
    f.globalCompositeOperation = 'source-over';
    f.globalAlpha = 1;
    ctx.save();

    ctx.drawImage(fogC.c, 0, 0);
    ctx.restore();
  }

  // Devuelve [{x,y,r,i}] (centros) para hacer clic en las bolas.
  function drawRackPreview(ctx, balls, x, y, t) {
    const out = [];
    const n = balls.length;
    const sp = 14;
    let i = 0;
    if (n === 15) {
      for (let row = 0; row < 5; row++) for (let k = 0; k <= row; k++) {
        const bx = x + 35 - row * sp / 2 + k * sp, by = y + 7 + row * 12;
        out.push({ x: bx, y: by, r: 7, i });
        i++;
      }
    } else {
      for (; i < n; i++) out.push({ x: x + 7 + i * sp, y: y + 7, r: 7, i });
    }
    for (const o of out) {
      const b = balls[o.i];
      if (!b) continue;
      drawBallShadow(ctx, o.x, o.y);
      drawBall(ctx, { num: b.num, kind: b.kind, rollX: 0, rollY: 0 }, o.x, o.y, t || 0);
    }
    return out;
  }

  // ------------------------------------------------------------------
  OM.TABLE = {
    themes: THEMES,
    pockets, drawTable, drawBackdrop, drawBall, drawBallShadow, drawCue, drawAim,
    drawPocketGlow, drawFog, drawRackPreview,
    // extras (no contractuales)
    theme: themeOf,
    warm(theme) { const th = themeOf(theme); tableCanvas(th, false, 1); if (!backCache[th.id]) backCache[th.id] = buildBackdrop(th); },
  };

  OM.ART_INIT.push(function () {
    initBallSprites();
    for (const c of OM.CUES || [{ id: 'peregrino' }]) cueCache[c.id] = buildCue(c.id);
  });
})();

<script>/* src/audio/audio.js */

  var voices = [];

    N.delay = ctx.createDelay(2); N.delay.delayTime.value = 0.43;

        I.arp(L.arp, t, 64 + ch[0] + ARP[(st + (bar % 2) * 4) % 16], d * 0.8, st % 4 === 0 ? 0.9 : 0.6, 'sawtooth');
        if (st === 0 && bar % 4 === 0) I.toll(L.toll, t, 52, 1);
        if (st === 0 && bar % 2 === 0) I.pad(L.pad, t, [52 + ch[0], 58 + ch[0], 59 + ch[0]], d * 32, 0.8, 900);
        if ((st === 0 || st === 3 || st === 6) && bar % 2 === 1) I.pad(L.stab, t, [52 + ch[0], 59 + ch[0], 64 + ch[0]], d * 1.2, 2.5, 2600);
        if (st % 2 === 0) {
          var ph = (bar % 4) * 8 + st / 2;
          if (hash(ph * 17 + Math.floor(bar / 16) * 3) < 0.45) I.lead(L.lead, t, 76 + scaleStep(PD, Math.floor(hash(ph * 7 + Math.floor(bar / 16)) * 8)), d * 2, 0.9);
        }
      }
    };
  })();

  // GAMEOVER: lúgubre, Re menor, 54 bpm. Órgano, tañidos, bajo descendente
  (function () {
    var PROG = [[0, 'm'], [5, 'm'], [-2, 'M'], [7, 'M']]; // Dm Gm C A
    var BASS = [38, 36, 34, 33]; // D C Bb A
    TRACKS.gameover = {
      bpm: 54, echoSteps: 4,
      layers: { organ: { rev: 0.8 }, bass: { rev: 0.2 }, toll: { rev: 0.8 }, bell: { rev: 0.7, echo: 0.4 }, drum: { rev: 0.5 }, choir: { rev: 0.8, minI: 0.4 } },
      step: function (p, s, t, d) {
        var bar = Math.floor(s / 16), st = s % 16, ch = PROG[bar % 4], L = p.L;
        if (st === 0) {
          I.organ(L.organ, t, chord(ch[0] + 62, ch[1], 57), d * 16, 0.9);
          I.sub(L.bass, t, BASS[bar % 4], d * 16, 0.8);
          if (bar % 2 === 0) I.toll(L.toll, t, 50, 0.9);
          if (bar % 2 === 1) I.kick(L.drum, t, 0.45);
          I.choir(L.choir, t, chord(ch[0] + 62, ch[1], 60), d * 16, 0.7);
        }
        if (st === 8 && bar % 2 === 0) I.kick(L.drum, t, 0.3);
        var mel = [[0, 81], [4, 77], [8, 76], [12, 74]], cyc = Math.floor(bar / 4);
        for (var i = 0; i < mel.length; i++)
          if (st === mel[i][0] && hash(bar * 4 + i + cyc * 13) < 0.45) I.bell(L.bell, t, mel[i][1] - (bar % 4) * 2 + (ch[1] === 'M' && i === 2 ? 1 : 0), 0.6, 3);
      }
    };
  })();

  // ---------------------------------------------------------------- secuenciador (lookahead)
  var players = [], current = null, curName = null, timer = null;
  function layerLevel(cfg) { return cfg.minI ? clamp((curIntensity - cfg.minI) / 0.15 + 0.0001, 0, 1) : 1; }
  function Player(name) {
    var def = TRACKS[name], t = now();
    this.name = name; this.def = def;
    this.out = gain(0.0001, N.musicIn);
    this.out.gain.setValueAtTime(0.0001, t);
    this.out.gain.exponentialRampToValueAtTime(def.gain || 1, t + (name === 'boss' || name === 'gameover' ? 0.6 : 1.4));
    this.L = {}; this.cfg = def.layers;
    for (var k in def.layers) {
      var c = def.layers[k], g = gain(layerLevel(c), this.out);
      if (c.rev) g.connect(gain(c.rev, N.musicRev));
      if (c.echo) g.connect(gain(c.echo, N.echoIn));
      this.L[k] = g;
    }
    this.sd = 60 / def.bpm / 4;
    this.step = 0; this.next = t + 0.08; this.stopAt = Infinity;
    N.delay.delayTime.setTargetAtTime(Math.min(1.9, this.sd * (def.echoSteps || 3)), t, 0.05);
  }
  Player.prototype.stepDur = function (s) {
    var sw = this.def.swing || 0; return this.sd * (sw ? (s % 2 === 0 ? 1 + sw : 1 - sw) : 1);
  };
  Player.prototype.fadeOut = function (secs) {
    var t = now(), g = this.out.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(Math.max(0.0001, g.value), t);
    g.exponentialRampToValueAtTime(0.0001, t + secs);
    this.stopAt = t + secs + 0.1;
  };
  Player.prototype.updateLayers = function () {
    var t = now();
    for (var k in this.L) this.L[k].gain.setTargetAtTime(layerLevel(this.cfg[k]), t, 0.5);
  };
  function tick() {
    timer = null;
    if (!ctx) return;
    try {
      var t = now(), la = (document.hidden ? 1.2 : 0.14);
      for (var i = players.length - 1; i >= 0; i--) {
        var p = players[i];
        if (t > p.stopAt) { try { p.out.disconnect(); } catch (e) { /* */ } players.splice(i, 1); continue; }
        if (p.next < t - 0.2) p.next = t + 0.02; // tras pestaña congelada: realinear
        var guard = 0;
        while (p.next < t + la && p.next < p.stopAt && guard++ < 64) {
          var d = p.stepDur(p.step);
          try { p.def.step(p, p.step, p.next, p.sd); } catch (e) { /* nunca romper el bucle */ }
          p.next += d; p.step++;
        }
      }
    } catch (e) { /* */ }
    if (players.length) timer = setTimeout(tick, 25);
  }
  function startTimer() { if (!timer) timer = setTimeout(tick, 0); }
  function setIntensityNodes(instant) {
    if (!ctx || !N.tone) return;
    var f = 4200 + curIntensity * 14000;
    if (instant) N.tone.frequency.value = f; else N.tone.frequency.setTargetAtTime(f, now(), 0.4);
  }

  function startMusic(name) {
    if (name === curName && current) return;
    if (current) current.fadeOut(name ? 1.6 : 1.2);
    current = null; curName = name || null;
    if (!name || !TRACKS[name]) return;
    current = new Player(name);
    players.push(current);
    startTimer();
  }

  // ---------------------------------------------------------------- API pública
  var A = OM.AUDIO = OM.AUDIO || {};
  A.ctx = null;
  A.available = !!AC;
  A.SFX = Object.keys(META);
  A._nodes = N; // depuración / medidores
  A.TRACKS = Object.keys(TRACKS);

  A.unlock = function () {
    try {
      if (!AC) return false;
      if (!ctx) {
        ctx = new AC({ latencyHint: 'interactive' });
        A.ctx = ctx;
        buildBuffers(); buildWaves(); buildGraph();
        // buffer silencioso (iOS)
        var s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); s.connect(ctx.destination); s.start(0);
      }
      if (ctx.state === 'suspended' && ctx.resume) { var pr = ctx.resume(); if (pr && pr.catch) pr.catch(function () {}); }
      if (pendingTrack !== undefined) { var pt = pendingTrack; pendingTrack = undefined; startMusic(pt); }
      return true;
    } catch (e) { return false; }
  };

  A.sfx = function (name, opts) {
    try {
      if (!ctx || !S[name]) return;
      if (ctx.state === 'suspended') { var pr = ctx.resume(); if (pr && pr.catch) pr.catch(function () {}); }
      var o = opts || {};
      var v = newVoice(name, o);
      var t = now() + 0.005;
      var dur = S[name](v.g, t, o) || 1;
      v.end = t + dur + 0.1;
    } catch (e) { /* silencio */ }
  };

  A.music = function (track) {
    try {
      if (track !== null && track !== undefined && !TRACKS[track]) return;
      if (!ctx) { pendingTrack = track || null; return; }
      startMusic(track || null);
    } catch (e) { /* */ }
  };
  A.currentTrack = function () { return curName; };

  A.setVolume = function (master, music, sfx) {
    try {
      if (master != null) vol.master = clamp(+master || 0, 0, 1);
      if (music != null) vol.music = clamp(+music || 0, 0, 1);
      if (sfx != null) vol.sfx = clamp(+sfx || 0, 0, 1);
      applyVolumes();
    } catch (e) { /* */ }
  };
  A.getVolume = function () { return { master: vol.master, music: vol.music, sfx: vol.sfx }; };

  Object.defineProperty(A, 'muted', {
    get: function () { return isMuted; },
    set: function (v) { isMuted = !!v; try { applyVolumes(); } catch (e) { /* */ } },
    enumerable: true, configurable: true
  });
  A.toggleMute = function () { A.muted = !isMuted; return isMuted; };

  A.intensity = function (x) {
    try {
      if (x == null) return curIntensity;
      curIntensity = clamp(+x || 0, 0, 1);
      if (!ctx) return curIntensity;
      for (var i = 0; i < players.length; i++) players[i].updateLayers();
      setIntensityNodes(false);
    } catch (e) { /* */ }
    return curIntensity;
  };

  // auto-unlock en el primer gesto (inofensivo si el motor ya llama a unlock)
  try {
    var gest = function () {
      A.unlock();
      if (ctx && ctx.state === 'running') ['pointerdown', 'keydown', 'touchend'].forEach(function (ev) { window.removeEventListener(ev, gest, true); });
    };
    ['pointerdown', 'keydown', 'touchend'].forEach(function (ev) { window.addEventListener(ev, gest, true); });
  } catch (e) { /* */ }
})();
