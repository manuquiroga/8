<script>/* src/game/physics.js */
// OCHO MALDITO — física de billar 2D.
// Bolas como círculos con masa; bandas = bordes del paño con aberturas en las troneras;
// "mandíbulas" de tronera = puntos de colisión donde termina cada banda.
window.OM = window.OM || {};

OM.Physics = (function () {
  const L = OM.LAYOUT;
  const DECEL = 150;        // px/s² fricción de rodadura
  const DAMP = 0.12;        // amortiguación lineal (1/s)
  const STOP = 5;           // px/s → se detiene
  const E_BALL = 0.94, E_CUSH = 0.72;
  const MAXV = 1050;

  function create(opts) {
    const W = {
      balls: [], pockets: [], jaws: [], t: 0,
      decel: DECEL * (opts.frictionMul || 1),
      pocketMul: opts.pocketMul || 1,
      sealedSides: !!opts.sealedSides,
      noScratch: !!opts.noScratch,
      tilt: opts.tilt || 0,
      events: [],
    };
    setPockets(W);
    return W;
  }

  function setPockets(W) {
    const F = L.felt;
    let src = OM.TABLE && OM.TABLE.pockets ? OM.TABLE.pockets() : null;
    if (!src || src.length !== 6) {
      src = [
        { x: F.x - 2, y: F.y - 2, corner: true }, { x: F.x + F.w / 2, y: F.y - 5, corner: false },
        { x: F.x + F.w + 2, y: F.y - 2, corner: true }, { x: F.x - 2, y: F.y + F.h + 2, corner: true },
        { x: F.x + F.w / 2, y: F.y + F.h + 5, corner: false }, { x: F.x + F.w + 2, y: F.y + F.h + 2, corner: true },
      ];
    }
    W.pockets = src.map((p, i) => ({ x: p.x, y: p.y, corner: !!p.corner, id: p.id || i, sealed: W.sealedSides && !p.corner }));
    // radio de captura y de "boca" (zona sin banda)
    W.pockets.forEach((p) => {
      p.r = L.pocketR * W.pocketMul;
      p.mouth = p.r * (p.corner ? 1.55 : 1.3);
    });
    // mandíbulas: intersección del círculo de boca con las líneas de banda
    W.jaws = [];
    const lines = [
      { axis: 'y', v: F.y, min: F.x, max: F.x + F.w }, { axis: 'y', v: F.y + F.h, min: F.x, max: F.x + F.w },
      { axis: 'x', v: F.x, min: F.y, max: F.y + F.h }, { axis: 'x', v: F.x + F.w, min: F.y, max: F.y + F.h },
    ];
    W.pockets.forEach((p) => {
      if (p.sealed) return;
      lines.forEach((ln) => {
        const d = ln.axis === 'y' ? ln.v - p.y : ln.v - p.x;
        if (Math.abs(d) >= p.mouth) return;
        const h = Math.sqrt(p.mouth * p.mouth - d * d);
        const c = ln.axis === 'y' ? p.x : p.y;
        [c - h, c + h].forEach((u) => {
          if (u < ln.min - 1 || u > ln.max + 1) return;
          W.jaws.push(ln.axis === 'y' ? { x: u, y: ln.v } : { x: ln.v, y: u });
        });
      });
    });
  }

  function addBall(W, b) {
    const m = b.kind === 'plomo' ? 2 : 1;
    const ball = Object.assign({ vx: 0, vy: 0, r: L.ballR, m, rollX: 0, rollY: 0, alive: true, sink: 0 }, b);
    W.balls.push(ball);
    return ball;
  }

  function inMouth(W, b) {
    for (const p of W.pockets) {
      if (p.sealed) continue;
      const dx = b.x - p.x, dy = b.y - p.y;
      if (dx * dx + dy * dy < p.mouth * p.mouth) return p;
    }
    return null;
  }

  function moving(W) {
    for (const b of W.balls) if (b.alive && (b.vx || b.vy)) return true;
    for (const b of W.balls) if (b.sinking) return true;
    return false;
  }

  function emit(W, e) { W.events.push(e); }

  function step(W, dt) {
    W.t += dt;
    // animación de caída en tronera
    for (const b of W.balls) if (b.sinking) {
      b.sink += dt * 4;
      b.x += (b.sinkTo.x - b.x) * Math.min(1, dt * 14);
      b.y += (b.sinkTo.y - b.y) * Math.min(1, dt * 14);
      if (b.sink >= 1) { b.sinking = false; }
    }
    let maxv = 0;
    for (const b of W.balls) if (b.alive) maxv = Math.max(maxv, Math.hypot(b.vx, b.vy));
    const n = Math.max(1, Math.ceil((maxv * dt) / 1.5));
    const h = dt / n;
    for (let s = 0; s < n; s++) substep(W, h);
  }

  function substep(W, h) {
    const F = L.felt;
    const balls = W.balls;
    // integrar
    for (const b of balls) {
      if (!b.alive) continue;
      if (W.tilt && (b.vx || b.vy || W.tiltActive)) {
        b.vx += Math.sin(W.t * 1.3) * W.tilt * h;
        b.vy += Math.cos(W.t * 0.9) * W.tilt * 0.4 * h;
      }
      let sp = Math.hypot(b.vx, b.vy);
      if (sp > 0) {
        const nsp = Math.max(0, sp - (W.decel + DAMP * sp) * h);
        if (nsp < STOP && !W.tiltActive) { b.vx = b.vy = 0; }
        else { const k = nsp / sp; b.vx *= k; b.vy *= k; }
        b.x += b.vx * h; b.y += b.vy * h;
        b.rollX += b.vx * h; b.rollY += b.vy * h;
      }
    }
    // bola-bola
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i]; if (!a.alive) continue;
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j]; if (!b.alive) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        // separar
        const overlap = rr - d, tm = a.m + b.m;
        a.x -= nx * overlap * (b.m / tm); a.y -= ny * overlap * (b.m / tm);
        b.x += nx * overlap * (a.m / tm); b.y += ny * overlap * (a.m / tm);
        const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rv <= 0) continue;
        const jimp = ((1 + E_BALL) * rv) / (1 / a.m + 1 / b.m);
        a.vx -= (jimp / a.m) * nx; a.vy -= (jimp / a.m) * ny;
        b.vx += (jimp / b.m) * nx; b.vy += (jimp / b.m) * ny;
        emit(W, { type: 'hit', a, b, speed: rv, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
      }
    }
    // bandas, mandíbulas y troneras
    for (const b of balls) {
      if (!b.alive) continue;
      const mouth = inMouth(W, b);
      if (!mouth) {
        let hit = false, sp = 0;
        if (b.x < F.x + b.r) { b.x = F.x + b.r; if (b.vx < 0) { sp = -b.vx; b.vx = -b.vx * E_CUSH; b.vy *= 0.94; hit = true; } }
        if (b.x > F.x + F.w - b.r) { b.x = F.x + F.w - b.r; if (b.vx > 0) { sp = b.vx; b.vx = -b.vx * E_CUSH; b.vy *= 0.94; hit = true; } }
        if (b.y < F.y + b.r) { b.y = F.y + b.r; if (b.vy < 0) { sp = -b.vy; b.vy = -b.vy * E_CUSH; b.vx *= 0.94; hit = true; } }
        if (b.y > F.y + F.h - b.r) { b.y = F.y + F.h - b.r; if (b.vy > 0) { sp = b.vy; b.vy = -b.vy * E_CUSH; b.vx *= 0.94; hit = true; } }
        if (hit) emit(W, { type: 'cushion', ball: b, speed: sp, x: b.x, y: b.y });
      } else {
        // mandíbulas
        for (const j of W.jaws) {
          const dx = b.x - j.x, dy = b.y - j.y, d2 = dx * dx + dy * dy;
          if (d2 < b.r * b.r && d2 > 0) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
            b.x = j.x + nx * b.r; b.y = j.y + ny * b.r;
            const vn = b.vx * nx + b.vy * ny;
            if (vn < 0) {
              b.vx -= (1 + E_CUSH * 0.8) * vn * nx; b.vy -= (1 + E_CUSH * 0.8) * vn * ny;
              emit(W, { type: 'cushion', ball: b, speed: -vn, x: b.x, y: b.y, jaw: true });
            }
          }
        }
        // captura: dentro del radio o habiendo cruzado la línea de banda en la boca
        const dx = b.x - mouth.x, dy = b.y - mouth.y;
        const outside = b.x < F.x - 1 || b.x > F.x + F.w + 1 || b.y < F.y - 1 || b.y > F.y + F.h + 1;
        if (dx * dx + dy * dy < mouth.r * mouth.r || outside) {
          if (b.num === 0 && W.noScratch) {
            // la blanca fantasma rebota hacia el centro
            const cx = F.x + F.w / 2, cy = F.y + F.h / 2;
            const ang = Math.atan2(cy - b.y, cx - b.x), sp = Math.max(120, Math.hypot(b.vx, b.vy) * 0.6);
            b.x = mouth.x + Math.cos(ang) * (mouth.mouth + b.r); b.y = mouth.y + Math.sin(ang) * (mouth.mouth + b.r);
            b.x = Math.min(Math.max(b.x, F.x + b.r), F.x + F.w - b.r); b.y = Math.min(Math.max(b.y, F.y + b.r), F.y + F.h - b.r);
            b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
            emit(W, { type: 'ghostBounce', ball: b, x: b.x, y: b.y });
            continue;
          }
          b.alive = false; b.sinking = true; b.sink = 0; b.sinkTo = { x: mouth.x, y: mouth.y };
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = b.vy = 0;
          emit(W, { type: 'pocket', ball: b, pocket: mouth, speed: sp, x: mouth.x, y: mouth.y });
        }
      }
      // red de seguridad
      if (b.alive && (b.x < F.x - 30 || b.x > F.x + F.w + 30 || b.y < F.y - 30 || b.y > F.y + F.h + 30)) {
        b.x = Math.min(Math.max(b.x, F.x + b.r), F.x + F.w - b.r);
        b.y = Math.min(Math.max(b.y, F.y + b.r), F.y + F.h - b.r);
        b.vx = b.vy = 0;
      }
    }
  }

  // Golpe sobre la blanca
  function shoot(W, cue, angle, power) {
    const v = Math.min(MAXV * 1.45, power);
    cue.vx = Math.cos(angle) * v; cue.vy = Math.sin(angle) * v;
  }

  // Explosión (grabado Bomba)
  function explode(W, x, y, radius, force) {
    for (const b of W.balls) {
      if (!b.alive) continue;
      const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy);
      if (d < radius && d > 0.01) {
        const k = force * (1 - d / radius);
        b.vx += (dx / d) * k; b.vy += (dy / d) * k;
      }
    }
  }

  // Impulso de saque (arcade): dispersa el triángulo para que el saque sea espectacular
  function breakBoost(W, cue, power) {
    const objs = W.balls.filter((b) => b.alive && b !== cue);
    if (!objs.length) return;
    const cx = objs.reduce((a, b) => a + b.x, 0) / objs.length, cy = objs.reduce((a, b) => a + b.y, 0) / objs.length;
    for (const b of objs) {
      let dx = b.x - cx, dy = b.y - cy; const d = Math.hypot(dx, dy) || 1;
      dx /= d; dy /= d;
      const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.9;
      const k = (120 + Math.random() * 260) * power * (0.4 + Math.min(1, d / 25));
      b.vx += Math.cos(a) * k; b.vy += Math.sin(a) * k;
    }
  }

  // ¿Posición libre para colocar una bola?
  function freeSpot(W, x, y, r, ignore) {
    const F = L.felt;
    if (x < F.x + r || x > F.x + F.w - r || y < F.y + r || y > F.y + F.h - r) return false;
    for (const b of W.balls) {
      if (!b.alive || b === ignore) continue;
      if (Math.hypot(b.x - x, b.y - y) < b.r + r + 0.5) return false;
    }
    return true;
  }

  // Trazado de la guía: devuelve {pts, ghost, target, objDir, cueDir}
  function trace(W, cue, angle, maxBounces, maxLen) {
    const F = L.felt;
    let x = cue.x, y = cue.y, dx = Math.cos(angle), dy = Math.sin(angle);
    const pts = [{ x, y }];
    let len = 0;
    for (let bounce = 0; bounce <= maxBounces; bounce++) {
      // primer contacto con bola
      let best = Infinity, hitBall = null;
      for (const b of W.balls) {
        if (!b.alive || b === cue) continue;
        const ox = b.x - x, oy = b.y - y;
        const proj = ox * dx + oy * dy;
        if (proj <= 0) continue;
        const perp2 = ox * ox + oy * oy - proj * proj;
        const rr = (cue.r + b.r) ** 2;
        if (perp2 > rr) continue;
        const tHit = proj - Math.sqrt(rr - perp2);
        if (tHit < best) { best = tHit; hitBall = b; }
      }
      // banda
      let tw = Infinity, nx = 0, ny = 0;
      const r = cue.r;
      if (dx > 0) { const t = (F.x + F.w - r - x) / dx; if (t < tw) { tw = t; nx = -1; ny = 0; } }
      if (dx < 0) { const t = (F.x + r - x) / dx; if (t < tw) { tw = t; nx = 1; ny = 0; } }
      if (dy > 0) { const t = (F.y + F.h - r - y) / dy; if (t < tw) { tw = t; nx = 0; ny = -1; } }
      if (dy < 0) { const t = (F.y + r - y) / dy; if (t < tw) { tw = t; nx = 0; ny = 1; } }
      if (hitBall && best <= tw) {
        const gx = x + dx * best, gy = y + dy * best;
        pts.push({ x: gx, y: gy });
        const ox = hitBall.x - gx, oy = hitBall.y - gy, od = Math.hypot(ox, oy);
        const odx = ox / od, ody = oy / od;
        // la blanca sale tangente
        const dot = dx * odx + dy * ody;
        let tx = dx - dot * odx, ty = dy - dot * ody; const tl = Math.hypot(tx, ty) || 1;
        tx /= tl; ty /= tl;
        return { pts, ghost: { x: gx, y: gy }, target: hitBall, objDir: { x: odx, y: ody, k: dot }, cueDir: { x: tx, y: ty, k: Math.sqrt(Math.max(0, 1 - dot * dot)) } };
      }
      len += tw;
      x += dx * tw; y += dy * tw;
      pts.push({ x, y });
      if (len > maxLen) break;
      if (nx) dx = -dx; if (ny) dy = -dy;
    }
    return { pts, ghost: null, target: null };
  }

  return { create, addBall, breakBoost, step, shoot, moving, explode, freeSpot, trace, setPockets, MAXV };
})();

<script>/* src/game/run.js */
// OCHO MALDITO — estado de partida, puntuación (Fichas × Mult), comodines, tienda.
window.OM = window.OM || {};

// RNG con semilla (mulberry32)
OM.RNG = function (seed) {
  let s = seed >>> 0;
  const r = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  r.state = () => s;
  return r;
};
OM.seedToStr = (n) => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) { s += A[n % 32]; n = Math.floor(n / 32); } return s; };

OM.jokerDef = (id) => OM.JOKERS.find((j) => j.id === id);
OM.itemDef = (id) => OM.ITEMS.find((j) => j.id === id);
OM.bossDef = (id) => OM.BOSSES.find((j) => j.id === id);
OM.cueDef = (id) => OM.CUES.find((j) => j.id === id);

OM.Run = (function () {
  function newJoker(id) {
    const def = OM.jokerDef(id);
    const r = OM.RARITY[def.rarity];
    const price = Math.round((r.price[0] + r.price[1]) / 2);
    return { id, def, st: def.state ? def.state() : {}, price, uid: Math.random().toString(36).slice(2) };
  }

  function create(cueId, seed) {
    seed = seed == null ? Math.floor(Math.random() * 1e9) : seed;
    const cue = OM.cueDef(cueId);
    const rng = OM.RNG(seed);
    const R = {
      seed, seedStr: OM.seedToStr(seed), rng, cue: cueId,
      money: cue.money, baseShots: cue.shots, interestCap: cue.interestCap || 5,
      jokerSlots: 5 + (cue.slots || 0), itemSlots: 2,
      jokers: [], items: [],
      balls: [], // el "mazo": 15 bolas con grabados
      levels: { simple: 1, doblete: 1, triplete: 1, masacre: 1, limpia: 1 },
      circle: 0, tableIdx: 0, bosses: [], infinite: false,
      rerollCost: 5, stats: { bestShot: 0, balls: 0, shots: 0, tables: 0, money: 0 },
      seen: {},
    };
    for (let n = 1; n <= 15; n++) R.balls.push({ num: n, kind: 'normal' });
    if (cue.joker) R.jokers.push(newJoker(cue.joker));
    if (cue.randomEng) {
      const kinds = ['oro', 'cristal', 'plomo', 'fuego', 'holo', 'bomba'];
      rng.shuffle(R.balls.filter((b) => b.num !== 8)).slice(0, cue.randomEng).forEach((b) => (b.kind = rng.pick(kinds)));
    }
    // jefes por círculo
    const pool = rng.shuffle(OM.BOSSES.filter((b) => !b.final).map((b) => b.id));
    for (let i = 0; i < 5; i++) R.bosses.push(pool[i]);
    R.bosses.push('boca');
    return R;
  }

  function target(R, circle = R.circle, tableIdx = R.tableIdx) {
    let base;
    if (circle < OM.CIRCLES.length) base = OM.CIRCLES[circle].base;
    else base = OM.CIRCLES[OM.CIRCLES.length - 1].base * Math.pow(2.4, circle - OM.CIRCLES.length + 1);
    const v = base * OM.TABLE_KINDS[tableIdx].mul;
    const mag = Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 1));
    return Math.round(v / mag) * mag;
  }
  function circleDef(R) { return OM.CIRCLES[Math.min(R.circle, OM.CIRCLES.length - 1)]; }
  function bossId(R) { return R.bosses[R.circle % R.bosses.length]; }
  function isBoss(R) { return R.tableIdx === 2; }
  function boss(R) { return isBoss(R) ? bossId(R) : null; }

  // ---- comodines: modificadores pasivos agregados ----
  function resolve(R, i, depth = 0) {
    const J = R.jokers[i];
    if (!J) return null;
    if (J.def.copy) { if (depth > 5) return null; return resolve(R, i + 1, depth + 1); }
    return J;
  }
  function mods(R) {
    const m = { extraShots: 0, pocketMul: 1, powerMul: 1, guide: 1, noScratch: false, eightSafe: false, scratchScores: false, retriggerFirst: false };
    R.jokers.forEach((_, i) => {
      const J = resolve(R, i); if (!J || !J.def.mods) return;
      const d = J.def.mods;
      if (d.extraShots) m.extraShots += d.extraShots;
      if (d.pocketMul) m.pocketMul *= d.pocketMul;
      if (d.powerMul) m.powerMul *= d.powerMul;
      if (d.guide) m.guide = Math.max(m.guide, d.guide);
      ['noScratch', 'eightSafe', 'scratchScores', 'retriggerFirst'].forEach((k) => { if (d[k]) m[k] = true; });
    });
    return m;
  }

  // ---- PUNTUACIÓN ----
  // shot = {balls:[{ball,pocket,banked}], scratch, cueContacts, cueCushions, shotIndex, shotsLeft, isBreak, ballsLeft, cursed, clearBonus}
  function score(R, shot) {
    const M = mods(R);
    const bossId_ = boss(R);
    const ev = [];
    const S = Object.assign({}, shot, { chips: 0, mult: 0, events: ev });
    S.add = (o, J) => {
      const src = J ? { type: 'joker', uid: J.uid } : S._src;
      if (o.chips) { S.chips += o.chips; ev.push({ k: 'chips', v: o.chips, src }); }
      if (o.mult) { S.mult += o.mult; ev.push({ k: 'mult', v: o.mult, src }); }
      if (o.xmult) { S.mult *= o.xmult; ev.push({ k: 'xmult', v: o.xmult, src }); }
      if (o.money) { ev.push({ k: 'money', v: o.money, src }); }
    };
    const callJ = (hook, ...args) => {
      R.jokers.forEach((inst, i) => {
        const J = resolve(R, i);
        if (!J || !J.def[hook]) return;
        // "this" = carta que se ilumina (la copia si es Espejo Roto); J = dueño del estado
        const self = { uid: inst.uid, st: J.st, def: J.def };
        J.def[hook].call(self, S, ...args, self);
      });
    };

    // falta / maldición
    if (shot.scratch && !M.scratchScores) {
      ev.push({ k: 'msg', v: 'FALTA', color: 'c' });
      callJ('onScratch');
      S.total = 0; return S;
    }
    if (shot.scratch) callJ('onScratch');
    if (shot.cursed && !M.eightSafe) {
      ev.push({ k: 'msg', v: '¡MALDICIÓN!', color: 'b', curse: true });
      S.total = 0; return S;
    }
    let counted = shot.balls.slice();
    if (bossId_ === 'coleccionista') counted = counted.filter((b) => b.ball.num >= 9 || (b.ball.num === 8 && shot.clear));
    S.balls = counted;
    const n = counted.length;
    if (!n) { ev.push({ k: 'msg', v: 'FALLO', color: '6' }); S.total = 0; return S; }
    const typeId = shot.clear ? 'limpia' : n >= 4 ? 'masacre' : n === 3 ? 'triplete' : n === 2 ? 'doblete' : 'simple';
    const T = OM.SHOT_TYPES[typeId], lvl = R.levels[typeId];
    S.typeId = typeId;
    S.chips = T.chips + T.lvlChips * (lvl - 1);
    S.mult = T.mult + T.lvlMult * (lvl - 1);
    ev.push({ k: 'type', v: typeId, lvl, chips: S.chips, mult: S.mult });

    counted.forEach((b, idx) => {
      const reps = idx === 0 && M.retriggerFirst ? 2 : 1;
      for (let rep = 0; rep < reps; rep++) {
        S._src = { type: 'ball', ball: b.ball, x: b.pocket.x, y: b.pocket.y, rep };
        if (rep) ev.push({ k: 'msg', v: '¡ECO!', color: 't', src: S._src });
        const gl = bossId_ === 'gloton' && idx === 0;
        const base = b.ball.num === 8 ? 40 : b.ball.num * 5;
        if (gl) ev.push({ k: 'msg', v: 'DEVORADA', color: 'b', src: S._src });
        else S.add({ chips: base });
        if (b.banked) S.add({ chips: 10 });
        const k = b.ball.kind;
        if (k === 'oro') S.add({ money: 3 });
        if (k === 'plomo') S.add({ chips: 50 });
        if (k === 'holo') S.add({ mult: 10 });
        if (k === 'fuego') S.add({ mult: 3 * n });
        if (k === 'bomba') S.add({ chips: 30 });
        if (k === 'cristal') S.add({ xmult: 2 });
        callJ('onBall', b);
        S._src = null;
      }
    });
    callJ('onShot');
    if (bossId_ === 'sanguijuela') ev.push({ k: 'money', v: -1, src: { type: 'boss' } });
    S.total = Math.floor(S.chips * S.mult);
    return S;
  }

  // efectos de comodín que no dependen de embocar (dinero por tiro, etc.) se ejecutan en score.
  function afterShot(R, S) {
    R.jokers.forEach((J) => { if (J.def.onAfter) J.def.onAfter.call(J, S, J); });
  }

  // ---- ECONOMÍA ----
  function cashout(R, shotsLeft) {
    const kind = OM.TABLE_KINDS[R.tableIdx];
    const lines = [{ label: kind.name, v: kind.reward }];
    if (shotsLeft > 0) lines.push({ label: 'Tiros sobrantes', v: shotsLeft });
    const interest = Math.min(R.interestCap, Math.floor(Math.max(0, R.money) / 5));
    if (interest > 0) lines.push({ label: 'Interés ($1 cada $5)', v: interest });
    return lines;
  }

  function sellPrice(J) { return Math.max(1, Math.floor((J.price || 4) / 2)); }

  // ---- TIENDA ----
  function rollRarity(rng, allowLegend) {
    const r = rng() * 100;
    if (allowLegend && r < 3) return 'legendario';
    if (r < 5) return 'epico';
    if (r < 30) return 'raro';
    return 'comun';
  }
  function randomJoker(R, allowLegend, exclude = []) {
    const owned = new Set(R.jokers.map((j) => j.id).concat(exclude));
    for (let tries = 0; tries < 30; tries++) {
      const rar = rollRarity(R.rng, allowLegend);
      const pool = OM.JOKERS.filter((j) => j.rarity === rar && !owned.has(j.id));
      if (pool.length) return R.rng.pick(pool).id;
    }
    const pool = OM.JOKERS.filter((j) => j.rarity !== 'legendario' && !owned.has(j.id));
    return pool.length ? R.rng.pick(pool).id : null;
  }
  function randomItem(R, kind) {
    const pool = OM.ITEMS.filter((i) => !kind || i.kind === kind);
    return R.rng.pick(pool).id;
  }
  function itemPrice(id) { const d = OM.itemDef(id); return d.kind === 'luna' ? 3 : d.kind === 'grabado' ? 3 : 4; }

  function makeShop(R) {
    const slots = [];
    const ex = [];
    for (let i = 0; i < 2; i++) {
      const id = randomJoker(R, false, ex); if (!id) continue; ex.push(id);
      const J = newJoker(id);
      slots.push({ type: 'joker', id, J, price: J.price });
    }
    const items = [];
    for (let i = 0; i < 2; i++) {
      const roll = R.rng();
      const id = randomItem(R, roll < 0.4 ? 'arcano' : roll < 0.7 ? 'luna' : 'grabado');
      items.push({ type: 'item', id, price: itemPrice(id) });
    }
    const packs = [];
    const pk = ['arcano', 'luna', 'grabado', 'maldito'];
    for (let i = 0; i < 2; i++) {
      const kind = R.rng() < 0.25 ? 'maldito' : R.rng.pick(pk.slice(0, 3));
      packs.push({ type: 'pack', kind, price: kind === 'maldito' ? 6 : 4 });
    }
    return { slots, items, packs };
  }
  function openPack(R, kind) {
    const opts = [];
    if (kind === 'maldito') {
      const ex = [];
      for (let i = 0; i < 3; i++) { const id = randomJoker(R, true, ex); if (id) { ex.push(id); opts.push({ type: 'joker', id, J: newJoker(id) }); } }
    } else {
      const ex = new Set();
      for (let i = 0; i < 3; i++) {
        let id, t = 0;
        do { id = randomItem(R, kind); t++; } while (ex.has(id) && t < 20);
        ex.add(id); opts.push({ type: 'item', id });
      }
    }
    return opts;
  }

  return { create, target, circleDef, bossId, isBoss, boss, mods, score, afterShot, cashout, sellPrice, makeShop, openPack, newJoker, randomJoker };
})();

<script>/* src/game/main.js */
// OCHO MALDITO — bucle principal, entrada, GUI inmediata, persistencia.
window.OM = window.OM || {};

(function () {
  const W = OM.W, H = OM.H;
  const screen = document.getElementById('screen');
  const sctx = screen.getContext('2d');
  const buf = OM.PX.canvas(W, H);
  const ctx = buf.ctx;
  OM.ctx = ctx; OM.buf = buf.c;

  // ---------- persistencia ----------
  OM.META = { best: 0, runs: 0, wins: 0, bestShot: 0, seen: {}, crt: true, music: true, sfx: true, tutorial: false };
  try { Object.assign(OM.META, JSON.parse(localStorage.getItem('om_meta') || '{}')); } catch (e) {}
  OM.saveMeta = () => { try { localStorage.setItem('om_meta', JSON.stringify(OM.META)); } catch (e) {} };

  // ---------- entrada ----------
  const IN = OM.IN = { mx: -99, my: -99, down: false, pressed: false, released: false, rpressed: false, wheel: 0, keys: {}, kp: {}, pressX: 0, pressY: 0, touch: false, consumed: false };
  let scale = 2, offX = 0, offY = 0;
  function toLocal(cx, cy) {
    const r = screen.getBoundingClientRect();
    IN.mx = ((cx - r.left) / r.width) * W;
    IN.my = ((cy - r.top) / r.height) * H;
  }
  function unlockAudio() { try { OM.AUDIO && OM.AUDIO.unlock && OM.AUDIO.unlock(); } catch (e) {} }
  screen.addEventListener('mousemove', (e) => toLocal(e.clientX, e.clientY));
  screen.addEventListener('mousedown', (e) => {
    toLocal(e.clientX, e.clientY); unlockAudio();
    if (e.button === 2) { IN.rpressed = true; return; }
    IN.down = true; IN.pressed = true; IN.pressX = IN.mx; IN.pressY = IN.my;
  });
  window.addEventListener('mouseup', (e) => { if (e.button === 2) return; if (IN.down) IN.released = true; IN.down = false; });
  screen.addEventListener('contextmenu', (e) => e.preventDefault());
  screen.addEventListener('wheel', (e) => { IN.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  screen.addEventListener('touchstart', (e) => { const t = e.touches[0]; IN.touch = true; toLocal(t.clientX, t.clientY); unlockAudio(); IN.down = true; IN.pressed = true; IN.pressX = IN.mx; IN.pressY = IN.my; e.preventDefault(); }, { passive: false });
  screen.addEventListener('touchmove', (e) => { const t = e.touches[0]; toLocal(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  screen.addEventListener('touchend', (e) => { IN.down = false; IN.released = true; e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    unlockAudio();
    if (!IN.keys[e.code]) IN.kp[e.code] = true;
    IN.keys[e.code] = true;
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { IN.keys[e.code] = false; });

  // ---------- GUI inmediata ----------
  const G = OM.G = {
    hot: null, tip: null, cursor: 'normal',
    inside(x, y, w, h) { return IN.mx >= x && IN.mx < x + w && IN.my >= y && IN.my < y + h; },
    clicked(x, y, w, h) {
      if (IN.consumed) return false;
      const ok = IN.released && G.inside(x, y, w, h) && IN.pressX >= x && IN.pressX < x + w && IN.pressY >= y && IN.pressY < y + h;
      if (ok) IN.consumed = true;
      return ok;
    },
    button(x, y, w, h, label, style = 'red', disabled = false, key) {
      const hov = !disabled && G.inside(x, y, w, h);
      const st = disabled ? 'disabled' : hov && IN.down ? 'down' : hov ? 'hover' : 'idle';
      OM.UI.button(ctx, x, y, w, h, label, st, style);
      if (hov) G.cursor = 'grab';
      if (hov && !G['_h' + label]) { G['_h' + label] = true; }
      if (disabled) return false;
      const hit = G.clicked(x, y, w, h) || (key && IN.kp[key]);
      if (hit) OM.sfx('click');
      return hit;
    },
    tooltip(x, y, title, body, color, sub) { G.tip = { x, y, title, body, color, sub }; },
    drawTooltip() {
      const t = G.tip; if (!t) return;
      const w = 156;
      const lines = OM.FONT.wrap(t.body || '', w - 12, 1);
      const lh = OM.FONT.lineH(1);
      const h = 22 + lines.length * lh + (t.sub ? lh + 2 : 0) + 4;
      let x = Math.round(Math.min(Math.max(4, t.x - w / 2), W - w - 4));
      let y = Math.round(t.y);
      if (y + h > H - 4) y = H - 4 - h;
      OM.UI.panel(ctx, x, y, w, h, 'tooltip');
      OM.FONT.draw(ctx, t.title, x + w / 2, y + 6, { color: '8', align: 'center', shadow: '0' });
      let yy = y + 20;
      if (t.sub) { OM.FONT.draw(ctx, t.sub, x + w / 2, yy - 2, { color: t.color || '6', align: 'center' }); yy += lh + 2; }
      lines.forEach((ln, i) => OM.FONT.draw(ctx, ln, x + 6, yy + i * lh, { color: '7' }));
    },
  };

  // colorea descripciones: "+4 Mult" rojo, "Fichas" azul, "$" oro
  OM.colorize = (s) => s
    .replace(/((?:\+|x)\s?[\d.]+\s?Mult)/g, '{c}$1{/}')
    .replace(/(x[\d.]+)(?! Mult)/g, '{c}$1{/}')
    .replace(/(\+\d+\s?Fichas)/g, '{q}$1{/}')
    .replace(/(\$\d+)/g, '{h}$1{/}')
    .replace(/\b(LISA|LISAS|RAYADA|RAYADAS|ESQUINA|LATERALES|SIMPLE|DOBLETE|TRIPLETE|MASACRE|MESA LIMPIA|ORO|CRISTAL|PLOMO|FUEGO|HOLO|BOMBA)\b/g, '{i}$1{/}')
    .replace(/\{i\}/g, '{h}');

  OM.fmt = (n) => {
    n = Math.floor(n);
    if (Math.abs(n) >= 1e11) return n.toExponential(2).replace('+', '');
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  };
  OM.sfx = (name, o) => { try { if (OM.META.sfx && OM.AUDIO) OM.AUDIO.sfx(name, o); } catch (e) {} };
  OM.music = (name) => { try { if (OM.AUDIO) OM.AUDIO.music(OM.META.music ? name : null); } catch (e) {} OM._track = name; };

  // ---------- escenas ----------
  OM.scene = null;
  OM.go = (name, arg, trans = 'dither') => {
    const doSwitch = () => {
      const S = OM.SCENES[name];
      OM.scene = S; OM.sceneName = name;
      if (S.enter) S.enter(arg);
    };
    if (trans && OM.FX && OM.FX.transition) {
      OM.FX.transition(trans, 0.5);
      OM._pendingSwitch = { fn: doSwitch, at: 0.25 };
    } else doSwitch();
  };

  // ---------- tamaño ----------
  function resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    let s = Math.min(ww / W, wh / H);
    if (s >= 2) s = Math.floor(s);
    scale = s;
    const cw = Math.floor(W * s), ch = Math.floor(H * s);
    const dpr = window.devicePixelRatio || 1;
    screen.style.width = cw + 'px'; screen.style.height = ch + 'px';
    screen.width = Math.floor(cw * dpr); screen.height = Math.floor(ch * dpr);
    sctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- bucle ----------
  let last = performance.now(), t = 0, transT = 0;
  OM.time = 0;
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt; OM.time = t;
    if (OM._pendingSwitch) {
      OM._pendingSwitch.at -= dt;
      if (OM._pendingSwitch.at <= 0) { const f = OM._pendingSwitch.fn; OM._pendingSwitch = null; f(); }
    }
    G.tip = null; G.cursor = 'normal'; IN.consumed = false;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = OM.PAL['0']; ctx.fillRect(0, 0, W, H);
    try {
      if (OM.scene) {
        OM.scene.update && OM.scene.update(dt, t);
        OM.scene.draw && OM.scene.draw(ctx, t);
        if (!OM.scene.drawsFX) OM.FX.draw(ctx);
      }
      OM.FX.update(dt);
      G.drawTooltip();
      OM.FX.drawTransition(ctx);
      if (!IN.touch) OM.UI.cursor(ctx, Math.round(IN.mx), Math.round(IN.my), G.cursor);
    } catch (err) {
      console.error(err);
      ctx.fillStyle = '#300'; ctx.fillRect(0, 0, W, 12);
      ctx.fillStyle = '#fff'; ctx.font = '8px monospace'; ctx.fillText(String(err).slice(0, 120), 4, 9);
    }
    // global keys
    if (IN.kp.KeyM) { OM.META.music = !OM.META.music; OM.saveMeta(); OM.music(OM._track); }
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    OM.FX.post(buf.c, sctx, screen.width, screen.height, t, { crt: OM.META.crt });
    IN.pressed = IN.released = IN.rpressed = false; IN.wheel = 0; IN.kp = {};
    requestAnimationFrame(frame);
  }

  OM.boot = function () {
    (OM.ART_INIT || []).forEach((fn) => { try { fn(); } catch (e) { console.error('ART_INIT', e); } });
    document.fonts && document.fonts.ready;
    OM.go('title', null, null);
    requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
  };
})();
