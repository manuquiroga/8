<script>/* src/game/hud.js */
// OCHO MALDITO — HUD compartido: comodines, consumibles, panel izquierdo, selector de bolas.
window.OM = window.OM || {};

OM.HUD = (function () {
  const L = OM.LAYOUT;
  const H = {
    sel: null,        // {type:'joker'|'item', idx}
    drag: null,       // {idx, ox, x}
    jiggle: {},       // uid -> tiempo restante de rebote
    picker: null,     // {title, onPick(ball), filter}
    itemMode: 'map',
  };

  function jokerX(R, i) {
    const n = Math.max(R.jokerSlots, 1);
    const sp = n > 1 ? Math.min(65, (L.jokers.w - L.cardW) / (n - 1)) : 0;
    return Math.round(L.jokers.x + i * sp);
  }
  function itemX(i) { return L.consum.x + 22 + i * 46; }
  H.jokerX = jokerX; H.itemX = itemX;
  H.bump = (uid) => { H.jiggle[uid] = 0.35; };

  function rarityLabel(def) { const r = OM.RARITY[def.rarity]; return { text: r.name, color: r.color }; }
  function jokerDesc(J) {
    let d = J.def.desc;
    if (J.st && J.st.v !== undefined) d = d.replace('{v}', Math.round(J.st.v * 100) / 100);
    return OM.colorize(d);
  }
  H.jokerDesc = jokerDesc;

  // ---------- fila de comodines ----------
  H.drawJokers = function (ctx, R, t, opts = {}) {
    const IN = OM.IN, G = OM.G;
    const y0 = L.jokers.y + 2;
    // ranuras vacías
    for (let i = 0; i < R.jokerSlots; i++) {
      const x = jokerX(R, i);
      ctx.globalAlpha = 0.35; OM.UI.panel(ctx, x, y0, L.cardW, L.cardH, 'inset'); ctx.globalAlpha = 1;
    }
    OM.FONT.draw(ctx, R.jokers.length + '/' + R.jokerSlots, L.jokers.x + L.jokers.w - 2, L.jokers.y + L.jokers.h + 1, { color: '6', align: 'right' });
    // arrastre
    if (H.drag) {
      if (!IN.down) {
        const d = H.drag; H.drag = null;
        if (d.moved) {
          let ni = 0; for (let i = 0; i < R.jokers.length; i++) if (IN.mx > jokerX(R, i) + L.cardW / 2) ni = i;
          const [J] = R.jokers.splice(d.idx, 1); R.jokers.splice(ni, 0, J);
          H.sel = null; OM.sfx('card_flip');
        }
      } else if (Math.abs(IN.mx - H.drag.sx) > 3) H.drag.moved = true;
    }
    let hoverIdx = -1;
    R.jokers.forEach((J, i) => {
      let x = jokerX(R, i), y = y0;
      const dragging = H.drag && H.drag.idx === i && H.drag.moved;
      if (dragging) { x = Math.round(IN.mx - H.drag.ox); y = y0 + 4; }
      const hov = !H.drag && G.inside(x, y, L.cardW, L.cardH) && !H.picker;
      if (hov) hoverIdx = i;
      const sel = H.sel && H.sel.type === 'joker' && H.sel.idx === i;
      const jig = H.jiggle[J.uid] || 0;
      if (jig > 0) H.jiggle[J.uid] = jig - 1 / 60;
      const sc = 1 + Math.max(0, jig) * 0.6;
      OM.CARDS.drawJoker(ctx, J.def, x, y - (sel ? 6 : 0), { t, hover: hov || dragging, selected: sel, scale: sc, wobble: !dragging, seed: i });
      if (hov && IN.pressed && opts.interactive !== false) { H.drag = { idx: i, ox: IN.mx - x, sx: IN.mx, moved: false }; }
      if (hov && IN.released && H.drag === null && opts.interactive !== false && !IN.consumed) {
        H.sel = sel ? null : { type: 'joker', idx: i }; IN.consumed = true; OM.sfx('card_flip');
      }
    });
    // los clics de arrastre sin mover = seleccionar
    if (H.drag && !IN.down) H.drag = null;
    if (hoverIdx >= 0) {
      const J = R.jokers[hoverIdx];
      const rl = rarityLabel(J.def);
      G.cursor = 'grab';
      G.tooltip(jokerX(R, hoverIdx) + L.cardW / 2, y0 + L.cardH + 6, J.def.name, jokerDesc(J), rl.color, rl.text);
    }
    // botón vender
    if (H.sel && H.sel.type === 'joker' && R.jokers[H.sel.idx] && opts.interactive !== false) {
      const J = R.jokers[H.sel.idx];
      const x = jokerX(R, H.sel.idx);
      const p = OM.Run.sellPrice(J);
      if (G.button(x - 2, y0 + L.cardH - 2, 44, 14, 'VENDER $' + p, 'gold')) {
        R.money += p; R.jokers.splice(H.sel.idx, 1); H.sel = null;
        OM.sfx('sell'); OM.FX.burst(x + 20, y0 + 30, 'gold', 14); OM.FX.popText(x + 20, y0 + 20, '+$' + p, 'h');
        opts.onChange && opts.onChange();
      }
    }
  };

  // ---------- consumibles ----------
  H.drawItems = function (ctx, R, t, mode, api) {
    const G = OM.G, IN = OM.IN;
    const y0 = L.consum.y + 8;
    for (let i = 0; i < R.itemSlots; i++) {
      ctx.globalAlpha = 0.35; OM.UI.panel(ctx, itemX(i), y0, L.smallCardW, L.smallCardH, 'inset'); ctx.globalAlpha = 1;
    }
    OM.FONT.draw(ctx, R.items.length + '/' + R.itemSlots, L.consum.x + L.consum.w - 2, L.consum.y + L.consum.h + 1, { color: '6', align: 'right' });
    R.items.forEach((id, i) => {
      const def = OM.itemDef(id);
      const x = itemX(i), y = y0;
      const hov = G.inside(x, y, L.smallCardW, L.smallCardH) && !H.picker;
      const sel = H.sel && H.sel.type === 'item' && H.sel.idx === i;
      OM.CARDS.drawItem(ctx, def, x, y - (sel ? 5 : 0), { t, hover: hov, selected: sel });
      if (hov) {
        G.cursor = 'grab';
        G.tooltip(x + 15, y + L.smallCardH + 6, def.name, OM.colorize(def.desc), def.kind === 'luna' ? 'r' : def.kind === 'grabado' ? 'g' : 't', def.kind === 'luna' ? 'Luna Negra' : def.kind === 'grabado' ? 'Grabado' : 'Arcano');
        if (G.clicked(x, y, L.smallCardW, L.smallCardH)) { H.sel = sel ? null : { type: 'item', idx: i }; OM.sfx('card_flip'); }
      }
    });
    if (H.sel && H.sel.type === 'item' && R.items[H.sel.idx]) {
      const idx = H.sel.idx, id = R.items[idx], def = OM.itemDef(id);
      const x = itemX(idx) - 8, y = y0 + L.smallCardH - 3;
      const can = canUse(R, def, mode, api);
      if (G.button(x, y, 46, 13, 'USAR', 'green', !can)) { H.sel = null; useItem(R, idx, mode, api); }
      const sp = 1;
      if (G.button(x, y + 14, 46, 13, 'VENDER $' + sp, 'gold')) { R.items.splice(idx, 1); R.money += sp; H.sel = null; OM.sfx('sell'); }
    }
  };

  function canUse(R, def, mode, api) {
    if (def.when === 'table' && mode !== 'table') return false;
    if (mode === 'table' && api && !api.canUseItem()) return false;
    if (def.id === 'juicio' && R.jokers.length >= R.jokerSlots) return false;
    return true;
  }
  H.canUse = canUse;

  // Aplica un consumible. fromPack: no está en R.items.
  function useItem(R, idx, mode, api, fromPackId) {
    const id = fromPackId || R.items[idx];
    const def = OM.itemDef(id);
    const consume = () => { if (!fromPackId) R.items.splice(R.items.indexOf(id), 1); };
    const cx = 320, cy = 180;
    if (def.kind === 'luna') {
      consume();
      R.levels[def.shot]++;
      OM.sfx('level_up');
      OM.FX.flash('r', 0.25, 0.3);
      OM.FX.popText(cx, cy, OM.SHOT_TYPES[def.shot].name.toUpperCase() + ' NV.' + R.levels[def.shot], 'r', { size: 2 });
      return;
    }
    if (def.kind === 'grabado') {
      H.picker = {
        title: 'Elige una bola para ' + def.name.toUpperCase(),
        eng: def.eng,
        onPick(ball) {
          consume(); ball.kind = def.eng; OM.sfx('level_up'); H.picker = null;
          OM.FX.popText(cx, cy, OM.ENGRAVINGS[def.eng].name.toUpperCase() + '!', 'h', { size: 2 });
          api && api.onEngrave && api.onEngrave(ball);
        },
        onCancel() { H.picker = null; },
      };
      return;
    }
    consume();
    OM.sfx('card_flip');
    switch (id) {
      case 'tiza': api.addShot(1); OM.FX.popText(cx, cy, '+1 TIRO', 'q', { size: 2 }); break;
      case 'mano': api.ballInHand(); break;
      case 'rueda': api.rerack(); break;
      case 'ojo': api.fullGuide(); OM.FX.popText(cx, cy, 'GUÍA COMPLETA', 'r', { size: 2 }); break;
      case 'ermitano': { const g = Math.min(20, Math.max(0, R.money)); R.money += g; OM.sfx('coin'); OM.FX.popText(cx, cy, '+$' + g, 'h', { size: 2 }); break; }
      case 'alquimista': {
        const pool = R.balls.filter((b) => b.kind === 'normal');
        R.rng.shuffle(pool).slice(0, 2).forEach((b) => (b.kind = 'oro'));
        OM.sfx('coin'); OM.FX.popText(cx, cy, '¡ORO!', 'h', { size: 2 }); api && api.onEngrave && api.onEngrave(); break;
      }
      case 'juicio': {
        const jid = OM.Run.randomJoker(R, false);
        if (jid) { R.jokers.push(OM.Run.newJoker(jid)); OM.META.seen[jid] = 1; OM.saveMeta(); OM.sfx('pack_open'); }
        break;
      }
    }
  }
  H.useItem = useItem;

  // ---------- selector de bola (grabados) ----------
  H.drawPicker = function (ctx, R, t) {
    const P = H.picker; if (!P) return false;
    const G = OM.G;
    ctx.globalAlpha = 0.75; ctx.fillStyle = OM.PAL['0']; ctx.fillRect(0, 0, OM.W, OM.H); ctx.globalAlpha = 1;
    const w = 360, h = 150, x = (OM.W - w) / 2, y = 100;
    OM.UI.panel(ctx, x, y, w, h, 'gold');
    OM.FONT.draw(ctx, P.title, OM.W / 2, y + 10, { color: 'i', align: 'center', shadow: '0' });
    const balls = R.balls;
    let hov = null;
    balls.forEach((b, i) => {
      const col = i % 8, row = Math.floor(i / 8);
      const bx = x + 40 + col * 40, by = y + 48 + row * 40;
      const isH = G.inside(bx - 14, by - 14, 28, 28);
      if (isH) { hov = b; OM.UI.panel(ctx, bx - 15, by - 15, 30, 30, 'inset'); }
      ctx.save(); ctx.translate(bx, by); ctx.scale(2, 2);
      OM.TABLE.drawBall(ctx, { num: b.num, kind: b.kind, rollX: 0, rollY: 0 }, 0, 0, t);
      ctx.restore();
      if (isH && G.clicked(bx - 14, by - 14, 28, 28)) { P.onPick(b); }
    });
    if (hov) {
      const e = OM.ENGRAVINGS[hov.kind];
      OM.FONT.draw(ctx, 'Bola ' + hov.num + (hov.kind !== 'normal' ? ' · ' + e.name + ': ' + e.desc : ''), OM.W / 2, y + h - 34, { color: '7', align: 'center' });
    }
    if (P.onCancel && G.button(OM.W / 2 - 40, y + h - 20, 80, 14, 'CANCELAR', 'dark', false, 'Escape')) P.onCancel();
    return true;
  };

  // ---------- visor de bolas (solo lectura) ----------
  H.drawBallsView = function (ctx, R, t, onClose) {
    const G = OM.G;
    ctx.globalAlpha = 0.75; ctx.fillStyle = OM.PAL['0']; ctx.fillRect(0, 0, OM.W, OM.H); ctx.globalAlpha = 1;
    const w = 380, h = 200, x = (OM.W - w) / 2, y = 80;
    OM.UI.panel(ctx, x, y, w, h, 'dark');
    OM.FONT.draw(ctx, 'TU SET DE BOLAS', OM.W / 2, y + 8, { color: '8', align: 'center', shadow: '0', size: 2 });
    let hov = null;
    R.balls.forEach((b, i) => {
      const col = i % 8, row = Math.floor(i / 8);
      const bx = x + 50 + col * 40, by = y + 50 + row * 40;
      if (G.inside(bx - 14, by - 14, 28, 28)) hov = b;
      ctx.save(); ctx.translate(bx, by); ctx.scale(2, 2);
      OM.TABLE.drawBall(ctx, { num: b.num, kind: b.kind, rollX: t * 6, rollY: 0 }, 0, 0, t);
      ctx.restore();
    });
    // niveles de tiro
    const types = Object.keys(OM.SHOT_TYPES);
    types.forEach((k, i) => {
      const T = OM.SHOT_TYPES[k], lv = R.levels[k];
      const tx = x + 14 + i * 72, ty = y + 128;
      OM.FONT.draw(ctx, T.name, tx, ty, { color: '7' });
      OM.FONT.draw(ctx, 'nv.' + lv, tx, ty + 10, { color: 'r' });
      OM.FONT.draw(ctx, '{q}' + (T.chips + T.lvlChips * (lv - 1)) + '{/} x {c}' + (T.mult + T.lvlMult * (lv - 1)) + '{/}', tx, ty + 20, { color: '7' });
    });
    if (hov) {
      const e = OM.ENGRAVINGS[hov.kind];
      OM.FONT.draw(ctx, 'Bola ' + hov.num + ' · ' + (hov.num === 8 ? 40 : hov.num * 5) + ' Fichas' + (hov.kind !== 'normal' ? ' · ' + e.name + ': ' + e.desc : ''), OM.W / 2, y + 112, { color: 'i', align: 'center' });
    }
    if (G.button(OM.W / 2 - 40, y + h - 22, 80, 15, 'CERRAR', 'dark', false, 'Escape') || OM.IN.rpressed) onClose();
  };

  // ---------- panel izquierdo ----------
  H.drawPanel = function (ctx, R, t, info) {
    const P = L.panel, G = OM.G;
    OM.UI.panel(ctx, P.x, P.y, P.w, P.h, 'dark');
    const cx = P.x + P.w / 2;
    // bloque mesa/objetivo
    const boss = info.bossId ? OM.bossDef(info.bossId) : null;
    OM.UI.panel(ctx, P.x + 4, P.y + 4, P.w - 8, 62, boss ? 'blood' : 'inset');
    OM.FONT.draw(ctx, info.title, cx, P.y + 9, { color: boss ? 'd' : '7', align: 'center', shadow: '0' });
    if (boss) {
      if (OM.PX.has('boss_' + boss.id)) OM.PX.draw(ctx, 'boss_' + boss.id, P.x + 10, P.y + 22);
      OM.FONT.draw(ctx, 'OBJETIVO', P.x + 48, P.y + 24, { color: '6' });
      OM.FONT.draw(ctx, OM.fmt(info.target), P.x + 48, P.y + 36, { color: 'c', size: 2, shadow: '0' });
      if (G.inside(P.x + 4, P.y + 4, P.w - 8, 62)) G.tooltip(cx, P.y + 70, boss.name, boss.desc, 'b', 'Jefe');
    } else if (info.target) {
      OM.FONT.draw(ctx, 'OBJETIVO', cx, P.y + 24, { color: '6', align: 'center' });
      OM.FONT.draw(ctx, OM.fmt(info.target), cx, P.y + 36, { color: 'c', size: 2, align: 'center', shadow: '0' });
    }
    if (info.sub) OM.FONT.draw(ctx, info.sub, cx, P.y + 55, { color: '5', align: 'center' });
    // puntos
    let y = P.y + 72;
    OM.UI.panel(ctx, P.x + 4, y, P.w - 8, 36, 'inset');
    OM.FONT.draw(ctx, 'PUNTOS', P.x + 10, y + 5, { color: '6' });
    const sc = info.score || 0;
    const reached = info.target && sc >= info.target;
    OM.FONT.draw(ctx, OM.fmt(info.scoreShown != null ? info.scoreShown : sc), P.x + P.w - 10, y + 16, { color: reached ? 'n' : '8', size: 2, align: 'right', shadow: '0' });
    if (info.target) OM.UI.bar(ctx, P.x + 10, y + 30, P.w - 20, 3, Math.min(1, (info.scoreShown || 0) / info.target), reached ? 'm' : 'c');
    // tipo de tiro + fichas x mult
    y += 42;
    OM.UI.panel(ctx, P.x + 4, y, P.w - 8, 54, 'inset');
    OM.FONT.draw(ctx, info.shotName || ' ', cx, y + 5, { color: info.shotColor || '7', align: 'center', shadow: '0' });
    const bump = info.bump || { c: 0, m: 0 };
    const bw = 66;
    ctx.save();
    OM.UI.valueBox(ctx, P.x + 10 - Math.round(bump.c * 2), y + 18 - Math.round(bump.c * 2), bw + Math.round(bump.c * 4), 28 + Math.round(bump.c * 4), OM.fmt(info.chips || 0), 'chips');
    OM.UI.valueBox(ctx, P.x + P.w - 10 - bw - Math.round(bump.m * 2), y + 18 - Math.round(bump.m * 2), bw + Math.round(bump.m * 4), 28 + Math.round(bump.m * 4), info.multStr || OM.fmt(info.mult || 0), 'mult');
    ctx.restore();
    OM.FONT.draw(ctx, 'x', cx, y + 26, { color: 'c', align: 'center', size: 2, shadow: '0' });
    // tiros y dinero
    y += 60;
    OM.UI.panel(ctx, P.x + 4, y, 82, 40, 'inset');
    OM.FONT.draw(ctx, 'TIROS', P.x + 45, y + 4, { color: 'q', align: 'center' });
    OM.FONT.draw(ctx, info.shots != null ? String(info.shots) : '-', P.x + 45, y + 16, { color: 'q', size: 2, align: 'center', shadow: '0' });
    OM.UI.panel(ctx, P.x + 90, y, 82, 40, 'inset');
    OM.FONT.draw(ctx, 'DINERO', P.x + 131, y + 4, { color: 'h', align: 'center' });
    OM.FONT.draw(ctx, '$' + R.money, P.x + 131, y + 16, { color: 'h', size: 2, align: 'center', shadow: '0' });
    // círculo
    y += 46;
    OM.UI.panel(ctx, P.x + 4, y, P.w - 8, 34, 'inset');
    const cd = OM.Run.circleDef(R);
    OM.FONT.draw(ctx, R.infinite ? 'INFINITO ' + (R.circle + 1) : 'CÍRCULO ' + cd.name.split(' · ')[0] + ' / VI', P.x + 10, y + 5, { color: 't' });
    OM.FONT.draw(ctx, cd.name.split(' · ')[1] || '', P.x + 10, y + 18, { color: '6' });
    for (let i = 0; i < 3; i++) {
      const done = i < R.tableIdx, cur = i === R.tableIdx;
      const px = P.x + P.w - 50 + i * 14;
      if (OM.PX.has('ui_dot')) {}
      ctx.fillStyle = OM.PAL[done ? 'm' : cur ? (i === 2 ? 'c' : 'h') : '3'];
      ctx.fillRect(px, y + 13, 8, 8);
      ctx.fillStyle = OM.PAL['0']; ctx.fillRect(px, y + 21, 8, 1);
    }
    // botones
    y += 40;
    if (info.buttons) info.buttons(y);
    OM.FONT.draw(ctx, 'Semilla ' + R.seedStr, cx, P.y + P.h - 11, { color: '4', align: 'center' });
  };

  return H;
})();

</script>
<script>/* src/game/scene_table.js */
// OCHO MALDITO — escena de mesa: apuntar, tirar, simular, puntuar, cobrar.
window.OM = window.OM || {};
OM.SCENES = OM.SCENES || {};

(function () {
  const L = OM.LAYOUT, F = L.felt;
  const HEAD_X = F.x + F.w * 0.25;
  const FOOT = { x: F.x + F.w * 0.72, y: F.y + F.h / 2 };
  let T = null; // estado de la mesa

  function rackPositions() {
    const d = L.ballR * 2 + 0.15, pos = [];
    for (let k = 0; k < 5; k++) for (let j = 0; j <= k; j++)
      pos.push({ x: FOOT.x + k * d * 0.866 + (Math.random() - 0.5) * 0.3, y: FOOT.y + (j - k / 2) * d + (Math.random() - 0.5) * 0.3, k, j });
    return pos;
  }

  function placeRack(R, sources) {
    const pos = rackPositions();
    const eightIdx = 4; // fila 3, centro
    const others = R.rng.shuffle(sources.filter((b) => b.num !== 8));
    const eight = sources.find((b) => b.num === 8);
    // esquinas traseras: una lisa y una rayada si es posible
    const order = [];
    const slots = pos.map((_, i) => i).filter((i) => i !== eightIdx);
    const placed = new Array(15).fill(null);
    if (eight) placed[eightIdx] = eight;
    const solids = others.filter((b) => b.num < 8), stripes = others.filter((b) => b.num > 8);
    if (solids.length && stripes.length) {
      placed[10] = solids.pop(); placed[14] = stripes.pop();
    }
    const rest = R.rng.shuffle(solids.concat(stripes));
    slots.forEach((i) => { if (!placed[i] && rest.length) placed[i] = rest.pop(); });
    placed.forEach((src, i) => { if (src) order.push({ src, p: pos[i] }); });
    return order;
  }

  function newWorld(R) {
    const M = OM.Run.mods(R);
    const boss = OM.Run.boss(R);
    let pocketMul = M.pocketMul;
    if (boss === 'boca') pocketMul *= 0.62;
    const W = OM.Physics.create({
      pocketMul,
      sealedSides: boss === 'sepulturero',
      noScratch: M.noScratch,
      frictionMul: boss === 'cienaga' ? 2 : boss === 'escarcha' ? 0.45 : 1,
      tilt: boss === 'pendulo' ? 70 : 0,
    });
    return W;
  }

  function rack(full) {
    const R = OM.R, W = T.W;
    W.balls = W.balls.filter((b) => b.num === 0 && b.alive);
    const srcs = full ? R.balls.slice() : T.remaining();
    placeRack(R, srcs).forEach(({ src, p }) => {
      OM.Physics.addBall(W, { num: src.num, kind: src.kind, src, x: p.x, y: p.y });
    });
    W.balls.forEach((b) => { if (b.num !== 0) { b.rollX = Math.random() * 40; b.rollY = Math.random() * 40; } });
  }

  function cueBall() { return T.W.balls.find((b) => b.num === 0); }

  function ensureCue(anywhere) {
    let c = cueBall();
    if (!c || !c.alive) {
      T.W.balls = T.W.balls.filter((b) => b.num !== 0);
      c = OM.Physics.addBall(T.W, { num: 0, kind: 'normal', x: F.x + F.w * 0.2, y: F.y + F.h / 2 });
    }
    T.phase = 'place'; T.placeAny = !!anywhere;
    return c;
  }

  OM.SCENES.table = {
    drawsFX: true,
    enter() {
      const R = OM.R;
      const M = OM.Run.mods(R);
      const boss = OM.Run.boss(R);
      T = {
        W: null, phase: 'place', placeAny: false, angle: 0, power: 0, charging: false, strike: 0,
        shots: R.baseShots + M.extraShots, shotIndex: 0, score: 0, scoreShown: 0,
        target: OM.Run.target(R), boss, guide: M.guide, cur: null, play: null, endT: 0,
        chips: 0, mult: 0, shotName: '', shotColor: '7', bump: { c: 0, m: 0 }, multStr: '0',
        showBalls: false, paused: false, lastHit: 0, cashout: null, msg: null, t0: OM.time, aimKey: false,
      };
      T.remaining = () => {
        const onTable = new Set(T.W.balls.filter((b) => b.alive && b.num !== 0).map((b) => b.src));
        return R.balls.filter((b) => onTable.has(b));
      };
      T.W = newWorld(R);
      rack(true);
      const c = ensureCue(false);
      c.x = HEAD_X - 30; c.y = F.y + F.h / 2;
      T.angle = 0;
      R.jokers.forEach((J) => J.def.onTableStart && J.def.onTableStart(R, J));
      OM.FX.clear();
      OM.music(boss ? 'boss' : 'table');
      if (boss) { setTimeout(() => OM.sfx('boss'), 400); OM.FX.flash('a', 0.35, 0.6); }
      OM.HUD.sel = null;
      T.intro = 1.6;
    },

    api: {
      canUseItem: () => T && (T.phase === 'aim' || T.phase === 'place') && !T.charging,
      addShot(n) { T.shots += n; },
      ballInHand() { ensureCue(true); },
      rerack() {
        const c = cueBall();
        const rem0 = T.remaining();
        T.W.balls = T.W.balls.filter((b) => b.num === 0);
        const rem = rem0;
        placeRack(OM.R, rem).forEach(({ src, p }) => OM.Physics.addBall(T.W, { num: src.num, kind: src.kind, src, x: p.x, y: p.y }));
        if (c && !OM.Physics.freeSpot(T.W, c.x, c.y, c.r, c)) ensureCue(true);
        OM.sfx('reroll');
      },
      fullGuide() { T.guide = 2; },
      onEngrave() {
        // refrescar el aspecto de las bolas en mesa
        T.W.balls.forEach((b) => { if (b.src) { b.kind = b.src.kind; b.m = b.kind === 'plomo' ? 2 : 1; } });
      },
    },

    update(dt, t) {
      const R = OM.R, IN = OM.IN, W = T.W;
      if (T.intro > 0) T.intro -= dt;
      T.bump.c = Math.max(0, T.bump.c - dt * 5); T.bump.m = Math.max(0, T.bump.m - dt * 5);
      if (IN.kp.Escape && !OM.HUD.picker && !T.showBalls && T.phase !== 'won') T.paused = !T.paused;
      if (T.paused || OM.HUD.picker || T.showBalls) return;
      // suavizar marcador
      T.scoreShown += (T.score - T.scoreShown) * Math.min(1, dt * 8);
      if (Math.abs(T.score - T.scoreShown) < 1) T.scoreShown = T.score;

      if (T.phase === 'place') updatePlace(dt);
      else if (T.phase === 'aim') updateAim(dt);
      else if (T.phase === 'strike') {
        T.strike -= dt;
        if (T.strike <= 0) doShoot();
      } else if (T.phase === 'rolling') updateRolling(dt);
      else if (T.phase === 'scoring') updateScoring(dt);
      else if (T.phase === 'lost') {
        T.endT -= dt;
        if (T.endT <= 0) OM.go('gameover', { reason: 'score', score: T.score, target: T.target });
      }
      if (T.phase !== 'rolling') OM.Physics.step(W, dt); // animaciones de caída
    },

    draw(ctx, t) { drawTable(ctx, t); },
  };

  // ---------------- colocar blanca ----------------
  function updatePlace(dt) {
    const IN = OM.IN, c = cueBall();
    const maxX = T.placeAny ? F.x + F.w - c.r : HEAD_X;
    let x = Math.min(Math.max(IN.mx, F.x + c.r), maxX), y = Math.min(Math.max(IN.my, F.y + c.r), F.y + F.h - c.r);
    const overTable = OM.G.inside(L.table.x, L.table.y, L.table.w, L.table.h);
    if (overTable) {
      if (OM.Physics.freeSpot(T.W, x, y, c.r, c)) { c.x = x; c.y = y; }
      OM.G.cursor = 'grab';
      if (IN.released && !IN.consumed && OM.Physics.freeSpot(T.W, c.x, c.y, c.r, c)) {
        IN.consumed = true; T.phase = 'aim'; OM.sfx('click');
        OM.FX.burst(c.x, c.y, 'dust', 6);
      }
    }
    if (IN.kp.Enter || IN.kp.Space) { T.phase = 'aim'; }
  }

  // ---------------- apuntar ----------------
  function inPlayArea() { const IN = OM.IN; return IN.my > 66 && IN.mx > 186 && !OM.HUD.sel; }
  function updateAim(dt) {
    const IN = OM.IN, c = cueBall(), R = OM.R;
    const M = OM.Run.mods(R);
    if (!T.charging) {
      if (IN.kp.ArrowLeft || IN.kp.ArrowRight || IN.keys.ArrowLeft || IN.keys.ArrowRight) {
        const sp = IN.keys.ShiftLeft || IN.keys.ShiftRight ? 0.03 : 0.004;
        if (IN.keys.ArrowLeft) T.angle -= sp; if (IN.keys.ArrowRight) T.angle += sp;
        T.aimKey = true; T.lastMouse = { x: IN.mx, y: IN.my };
      }
      if (IN.wheel) { T.angle += IN.wheel * 0.006; T.aimKey = true; T.lastMouse = { x: IN.mx, y: IN.my }; }
      const moved = !T.lastMouse || Math.hypot(IN.mx - T.lastMouse.x, IN.my - T.lastMouse.y) > 2;
      if (inPlayArea() && (!T.aimKey || moved)) {
        T.aimKey = false;
        const dx = IN.mx - c.x, dy = IN.my - c.y;
        if (dx * dx + dy * dy > 16) T.angle = Math.atan2(dy, dx);
      }
      if (inPlayArea()) OM.G.cursor = 'aim';
      if (IN.pressed && inPlayArea() && !IN.consumed) {
        const dx = IN.mx - c.x, dy = IN.my - c.y;
        if (dx * dx + dy * dy > 16 && !T.aimKey) T.angle = Math.atan2(dy, dx);
        T.charging = true; T.chargeFrom = { x: IN.mx, y: IN.my }; T.power = 0; T.kbd = false;
      }
      if (IN.kp.Space) { T.charging = true; T.kbd = true; T.power = 0; T.kdir = 1; }
    } else {
      if (T.kbd) {
        T.power += T.kdir * dt * 0.9;
        if (T.power >= 1) { T.power = 1; T.kdir = -1; } if (T.power <= 0) { T.power = 0; T.kdir = 1; }
        if (!IN.keys.Space) release();
      } else {
        const dx = IN.mx - T.chargeFrom.x, dy = IN.my - T.chargeFrom.y;
        // solo cuenta el arrastre hacia atrás (opuesto al tiro)
        const back = -(dx * Math.cos(T.angle) + dy * Math.sin(T.angle));
        const raw = Math.max(Math.hypot(dx, dy) * 0.35, back);
        T.power = Math.min(1, Math.max(0, raw / 90));
        OM.G.cursor = 'grab';
        if (!IN.down) release();
      }
      if (IN.rpressed || IN.kp.Escape) { T.charging = false; T.power = 0; }
    }
    function release() {
      T.charging = false;
      if (T.power < 0.03) { T.power = 0; return; }
      T.phase = 'strike'; T.strike = 0.08; T.strikePow = T.power;
    }
    void M;
  }

  function doShoot() {
    const R = OM.R, c = cueBall(), M = OM.Run.mods(R);
    const pw = T.strikePow;
    const v = (60 + Math.pow(pw, 1.25) * 960) * M.powerMul;
    OM.Physics.shoot(T.W, c, T.angle, v);
    OM.sfx('cue_hit', { vol: 0.4 + pw * 0.6 });
    OM.FX.burst(c.x - Math.cos(T.angle) * 6, c.y - Math.sin(T.angle) * 6, 'dust', 4 + Math.round(pw * 8));
    if (pw > 0.85) OM.FX.shake(2, 0.15);
    T.cur = {
      pocketed: [], scratch: false, cueContacts: new Set(), cueCushions: 0, banked: new Set(), eight: false,
      isBreak: T.W.balls.filter((b) => b.alive && b.num !== 0).length === R.balls.length && T.shotIndex === 0,
    };
    T._lastRemaining = null;
    T.phase = 'rolling';
    T.W.tiltActive = false;
    T.power = 0;
    R.stats.shots++;
  }

  // ---------------- simulación ----------------
  function updateRolling(dt) {
    const W = T.W, cur = T.cur;
    // cámara lenta si una bola va a la tronera rápido (solo un pelín de drama)
    OM.Physics.step(W, dt);
    for (const e of W.events) {
      if (e.type === 'hit') {
        const vol = Math.min(1, e.speed / 600);
        if (OM.time - T.lastHit > 0.015 || vol > 0.5) { OM.sfx('clack', { vol: 0.15 + vol * 0.85, pan: (e.x - 320) / 320 }); T.lastHit = OM.time; }
        if (e.speed > 250) OM.FX.burst(e.x, e.y, 'spark', 2 + Math.round(vol * 5));
        if (e.speed > 700) OM.FX.shake(1.5, 0.1);
        const cue = e.a.num === 0 ? e.a : e.b.num === 0 ? e.b : null;
        if (cue) cur.cueContacts.add(cue === e.a ? e.b : e.a);
        if (cue && cur.isBreak && !cur.boosted) {
          cur.boosted = true;
          OM.Physics.breakBoost(W, cue, T.strikePow);
          OM.FX.shake(2 + T.strikePow * 4, 0.3); OM.FX.burst(e.x, e.y, 'spark', 16);
          OM.sfx('clack', { vol: 1 }); OM.sfx('clack', { vol: 0.8, pitch: 0.9 });
        }
        [e.a, e.b].forEach((b) => {
          if (b.kind === 'bomba' && !b.exploded && b.alive) {
            b.exploded = true;
            OM.Physics.explode(W, b.x, b.y, 70, 560);
            OM.FX.burst(b.x, b.y, 'explosion', 30); OM.FX.shake(5, 0.35); OM.FX.flash('v', 0.3, 0.2);
            OM.sfx('explosion');
          }
        });
      } else if (e.type === 'cushion') {
        if (e.speed > 30) OM.sfx('cushion', { vol: Math.min(1, e.speed / 600), pan: (e.x - 320) / 320 });
        if (e.ball.num === 0) { if (!e.jaw) cur.cueCushions++; } else cur.banked.add(e.ball);
      } else if (e.type === 'pocket') {
        const b = e.ball;
        OM.sfx('pocket', { vol: 0.5 + Math.min(0.5, e.speed / 800), pan: (e.x - 320) / 320 });
        OM.FX.burst(e.x, e.y, 'pocket', 14);
        T.glow = { p: e.pocket, t: 0.6, color: b.num === 0 ? 'c' : b.num === 8 ? 'b' : 'h' };
        if (b.num === 0) { cur.scratch = true; OM.sfx('scratch'); OM.FX.popText(e.x, e.y - 10, 'FALTA', 'c'); }
        else {
          cur.pocketed.push({ ball: b.src, pocket: e.pocket, banked: cur.banked.has(b), phys: b });
          if (b.num === 8) cur.eight = true;
          const n = cur.pocketed.length;
          OM.FX.popText(e.x, e.y - 12, n > 1 ? 'x' + n + '!' : '¡DENTRO!', n > 1 ? 'n' : '8');
          if (b.num !== 8) OM.FX.burst(e.x, e.y, 'ember', 6);
        }
      } else if (e.type === 'ghostBounce') {
        OM.FX.burst(e.x, e.y, 'smoke', 10); OM.sfx('curse', { vol: 0.4 });
      }
    }
    W.events.length = 0;
    if (!OM.Physics.moving(W)) finishShot();
  }

  function finishShot() {
    const R = OM.R, cur = T.cur;
    const remainingObj = T.W.balls.filter((b) => b.alive && b.num !== 0).length;
    const eightLeftOnTable = T.W.balls.some((b) => b.alive && b.num === 8);
    const cursed = cur.eight && remainingObj > 0;
    const clear = cur.eight && remainingObj === 0 && !cur.scratch;
    T._lastRemaining = new Set(T.W.balls.filter((b) => b.alive && b.num !== 0).map((b) => b.src));
    T.shots--;
    const shot = {
      balls: cur.pocketed, scratch: cur.scratch, cueContacts: cur.cueContacts.size, cueCushions: cur.cueCushions,
      shotIndex: T.shotIndex, shotsLeft: T.shots, isBreak: cur.isBreak, ballsLeft: remainingObj, cursed, clear,
    };
    const S = OM.Run.score(R, shot);
    T.S = S;
    T.play = { i: 0, timer: 0.25, events: S.events, done: false, totalT: 0 };
    T.chips = 0; T.mult = 0; T.multStr = '0'; T.shotName = ''; T.shotColor = '7';
    T.phase = 'scoring';
    void eightLeftOnTable;
  }

  function evPos(src) {
    if (!src) return { x: F.x + F.w / 2, y: F.y + 40 };
    if (src.type === 'joker') {
      const i = OM.R.jokers.findIndex((j) => j.uid === src.uid);
      if (i >= 0) { OM.HUD.bump(src.uid); return { x: OM.HUD.jokerX(OM.R, i) + 20, y: L.jokers.y + 62 }; }
    }
    if (src.type === 'ball') return { x: Math.min(Math.max(src.x, F.x + 10), F.x + F.w - 10), y: Math.min(Math.max(src.y, F.y + 12), F.y + F.h - 10) };
    return { x: F.x + F.w / 2, y: F.y + 40 };
  }
  const fmtMult = (m) => (Math.abs(m - Math.round(m)) < 0.01 ? OM.fmt(m) : m.toFixed(1));

  function updateScoring(dt) {
    const P = T.play, R = OM.R;
    P.timer -= dt;
    if (P.timer > 0) return;
    if (P.i < P.events.length) {
      const e = P.events[P.i++];
      const p = evPos(e.src);
      const speed = Math.max(0.09, 0.26 - P.i * 0.014);
      P.timer = speed;
      const pitch = 1 + Math.min(1.2, P.i * 0.06);
      switch (e.k) {
        case 'type': {
          const Ty = OM.SHOT_TYPES[e.v];
          T.shotName = Ty.name.toUpperCase() + ' nv.' + e.lvl; T.shotColor = e.v === 'limpia' ? 'h' : e.v === 'masacre' ? 'c' : '8';
          T.chips = e.chips; T.mult = e.mult; T.multStr = fmtMult(T.mult); T.bump.c = T.bump.m = 1;
          OM.FX.popText(F.x + F.w / 2, F.y + F.h / 2 - 20, Ty.name.toUpperCase(), T.shotColor, { size: 2 });
          OM.sfx('card_flip');
          if (e.v === 'masacre' || e.v === 'limpia') { OM.FX.shake(3, 0.3); OM.FX.flash('c', 0.2, 0.2); }
          P.timer = 0.35;
          break;
        }
        case 'chips': T.chips += e.v; T.bump.c = 1; OM.FX.popText(p.x, p.y, '+' + OM.fmt(e.v), 'q'); OM.sfx('chips', { pitch }); break;
        case 'mult': T.mult += e.v; T.multStr = fmtMult(T.mult); T.bump.m = 1; OM.FX.popText(p.x, p.y, '+' + e.v + ' Mult', 'c'); OM.sfx('mult', { pitch }); break;
        case 'xmult': T.mult *= e.v; T.multStr = fmtMult(T.mult); T.bump.m = 1.6; OM.FX.popText(p.x, p.y, 'x' + (Math.round(e.v * 100) / 100), 'c', { size: 2 }); OM.sfx('xmult', { pitch }); OM.FX.shake(2, 0.15); P.timer += 0.08; break;
        case 'money': R.money += e.v; OM.FX.popText(p.x, p.y - 8, (e.v > 0 ? '+$' : '-$') + Math.abs(e.v), 'h'); if (e.v > 0) { OM.sfx('coin'); OM.FX.burst(p.x, p.y, 'gold', 6); } break;
        case 'msg':
          OM.FX.popText(e.src ? p.x : F.x + F.w / 2, e.src ? p.y - 10 : F.y + F.h / 2, e.v, e.color || '8', { size: 2 });
          if (e.curse) { OM.sfx('curse'); OM.FX.flash('a', 0.5, 0.5); OM.FX.shake(4, 0.4); OM.FX.burst(F.x + F.w / 2, F.y + F.h / 2, 'blood', 30); }
          else if (e.v === 'FALTA') OM.sfx('lose', { vol: 0.5 });
          P.timer = 0.5;
          break;
      }
      return;
    }
    if (!P.done) {
      P.done = true;
      const total = T.S.total;
      const before = T.score;
      T.score += total;
      R.stats.bestShot = Math.max(R.stats.bestShot, total);
      if (total > OM.META.bestShot) { OM.META.bestShot = total; OM.saveMeta(); }
      if (total > 0) {
        OM.FX.popText(F.x + F.w / 2, F.y + F.h / 2 + 8, OM.fmt(total), total >= T.target * 0.5 ? 'd' : '8', { size: 2, big: true });
        const big = total >= T.target * 0.4;
        OM.sfx('score_total', { pitch: big ? 1.2 : 1 });
        if (big) { OM.FX.shake(4, 0.35); OM.FX.burst(F.x + F.w / 2, F.y + F.h / 2, 'ember', 40); }
        if (before < T.target && T.score >= T.target) { OM.FX.flash('h', 0.3, 0.4); OM.FX.burst(100, 90, 'gold', 30); }
      }
      P.timer = total > 0 ? 0.9 : 0.4;
      return;
    }
    afterShot();
  }

  function afterShot() {
    const R = OM.R, cur = T.cur, S = T.S;
    OM.Run.afterShot(R, S);
    R.stats.balls += cur.pocketed.length;
    // cristal: puede romperse
    cur.pocketed.forEach((pb) => {
      if (pb.ball.kind === 'cristal' && R.rng() < 0.25) {
        const i = R.balls.indexOf(pb.ball);
        if (i >= 0) R.balls.splice(i, 1);
        OM.FX.burst(pb.pocket.x, pb.pocket.y, 'shard', 20); OM.sfx('glass_break');
        OM.FX.popText(pb.pocket.x, pb.pocket.y - 14, '¡ROTA!', 'r');
      }
    });
    if (T.boss === 'verdugo' && cur.scratch) { T.shots = Math.max(0, T.shots - 1); OM.FX.popText(100, 200, '-1 TIRO', 'b', { size: 2 }); }
    T.shotIndex++;
    // la 8 maldita vuelve al punto
    if (S.cursed !== undefined && cur.eight && T.W.balls.some((b) => b.alive && b.num !== 0)) {
      const e = T.W.balls.find((b) => b.num === 8);
      if (e) {
        let x = FOOT.x, y = FOOT.y;
        while (!OM.Physics.freeSpot(T.W, x, y, e.r, e) && x < F.x + F.w - 10) x += 3;
        e.alive = true; e.sinking = false; e.x = x; e.y = y; e.vx = e.vy = 0;
        OM.FX.burst(x, y, 'smoke', 16);
      }
    }
    // victoria
    if (T.score >= T.target) { win(); return; }
    if (T.shots <= 0) { T.phase = 'lost'; T.endT = 1.8; OM.sfx('lose'); OM.FX.flash('a', 0.5, 1); OM.music('gameover'); return; }
    // mesa vacía → nuevo triángulo
    const left = T.W.balls.filter((b) => b.alive && b.num !== 0).length;
    if (left === 0) {
      OM.FX.popText(F.x + F.w / 2, F.y + F.h / 2, '¡NUEVO TRIÁNGULO!', 'n', { size: 2 });
      T.W.balls = T.W.balls.filter((b) => b.num === 0 && b.alive);
      rack(true);
      const c = ensureCue(false); c.x = HEAD_X - 30; c.y = F.y + F.h / 2;
      return;
    }
    if (cur.scratch) ensureCue(true);
    else T.phase = 'aim';
    // intensidad musical
    try { OM.AUDIO.intensity(Math.min(1, T.score / T.target * 0.7 + (T.shots <= 1 ? 0.3 : 0))); } catch (e) {}
  }

  function win() {
    const R = OM.R;
    T.phase = 'won';
    R.stats.tables++;
    R.jokers.forEach((J) => J.def.onTableEnd && J.def.onTableEnd(R, J));
    OM.sfx('win_table');
    OM.FX.burst(F.x + F.w / 2, F.y + F.h / 2, 'gold', 40);
    T.cashout = { lines: OM.Run.cashout(R, T.shots), t: 0 };
    T.cashout.total = T.cashout.lines.reduce((a, l) => a + l.v, 0);
    try { OM.AUDIO.intensity(0); } catch (e) {}
  }

  function collect() {
    const R = OM.R;
    R.money += T.cashout.total;
    R.stats.money += T.cashout.total;
    OM.sfx('coin');
    R.tableIdx++;
    if (R.tableIdx > 2) {
      R.tableIdx = 0; R.circle++;
      OM.META.best = Math.max(OM.META.best, R.circle); OM.saveMeta();
      if (R.circle >= OM.CIRCLES.length && !R.infinite) { OM.go('victory'); return; }
    }
    OM.go('shop');
  }

  // ---------------- dibujo ----------------
  function drawTable(ctx, t) {
    const R = OM.R, W = T.W, G = OM.G, IN = OM.IN;
    const theme = OM.Run.circleDef(R).theme;
    const sh = OM.FX.shakeOffset();
    ctx.save();
    OM.TABLE.drawBackdrop(ctx, theme, t);
    ctx.translate(Math.round(sh.x), Math.round(sh.y));
    OM.TABLE.drawTable(ctx, theme, t, { sealedSides: T.boss === 'sepulturero', pocketScale: W.pockets[0].r / L.pocketR });
    if (T.glow) { T.glow.t -= 1 / 60; if (T.glow.t > 0) OM.TABLE.drawPocketGlow(ctx, T.glow.p, t, T.glow.color); else T.glow = null; }
    // bolas
    for (const b of W.balls) if (b.alive) OM.TABLE.drawBallShadow(ctx, Math.round(b.x), Math.round(b.y));
    for (const b of W.balls) {
      if (!b.alive && !b.sinking) continue;
      if (b.sinking) {
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - b.sink);
        const s = 1 - b.sink * 0.5;
        ctx.translate(b.x, b.y); ctx.scale(s, s);
        OM.TABLE.drawBall(ctx, b, 0, 0, t);
        ctx.restore();
      } else OM.TABLE.drawBall(ctx, b, Math.round(b.x), Math.round(b.y), t);
    }
    const c = cueBall();
    if (T.boss === 'niebla' && c) OM.TABLE.drawFog(ctx, c.x, c.y, 62, t);
    // guía + taco
    if (c && c.alive && (T.phase === 'aim' || T.phase === 'strike') && !T.paused) {
      const g = T.guide;
      const tr = OM.Physics.trace(W, c, T.angle, g >= 2 ? 2 : 0, g >= 2 ? 900 : 380);
      const opts = {};
      if (tr.ghost) {
        const ol = (g >= 2 ? 90 : 34) * Math.max(0.25, tr.objDir.k), cl = (g >= 2 ? 60 : 22) * tr.cueDir.k;
        opts.objPath = [{ x: tr.target.x, y: tr.target.y }, { x: tr.target.x + tr.objDir.x * ol, y: tr.target.y + tr.objDir.y * ol }];
        if (cl > 3) opts.cuePath = [{ x: tr.ghost.x, y: tr.ghost.y }, { x: tr.ghost.x + tr.cueDir.x * cl, y: tr.ghost.y + tr.cueDir.y * cl }];
      }
      OM.TABLE.drawAim(ctx, tr.pts, tr.ghost, t, opts);
      const pull = T.phase === 'strike' ? -2 + (T.strike / 0.08) * (4 + T.strikePow * 26) : 4 + T.power * 26;
      OM.TABLE.drawCue(ctx, R.cue, c.x - Math.cos(T.angle) * (c.r + 1), c.y - Math.sin(T.angle) * (c.r + 1), T.angle, pull, t);
    }
    if (T.phase === 'place' && c) {
      ctx.globalAlpha = 0.5 + Math.sin(t * 6) * 0.2;
      if (!T.placeAny) { ctx.fillStyle = OM.PAL['7']; for (let y = F.y + 2; y < F.y + F.h; y += 4) ctx.fillRect(HEAD_X, y, 1, 2); }
      ctx.globalAlpha = 1;
    }
    OM.FX.draw(ctx);
    ctx.restore();

    // ---- HUD ----
    const multStr = T.multStr;
    OM.HUD.drawPanel(ctx, R, t, {
      title: (T.boss ? OM.bossDef(T.boss).name : OM.TABLE_KINDS[R.tableIdx].name).toUpperCase(),
      bossId: T.boss, target: T.target, score: T.score, scoreShown: T.scoreShown,
      sub: T.boss ? null : 'Recompensa: $' + OM.TABLE_KINDS[R.tableIdx].reward,
      shotName: T.shotName || (T.phase === 'aim' ? 'apunta...' : ''), shotColor: T.shotName ? T.shotColor : '5',
      chips: T.chips, mult: T.mult, multStr, bump: T.bump, shots: T.shots,
      buttons(y) {
        if (G.button(L.panel.x + 8, y, 80, 16, 'BOLAS', 'blue')) { T.showBalls = true; }
        if (G.button(L.panel.x + 92, y, 80, 16, 'MENÚ', 'dark')) { T.paused = true; }
      },
    });
    const ui = T.phase === 'aim' || T.phase === 'place';
    OM.HUD.drawJokers(ctx, R, t, { interactive: ui });
    OM.HUD.drawItems(ctx, R, t, 'table', OM.SCENES.table.api);
    // barra inferior
    const B = L.bottom;
    if (T.charging || T.phase === 'strike') {
      OM.FONT.draw(ctx, 'POTENCIA', B.x + 8, B.y + 12, { color: '7' });
      OM.UI.bar(ctx, B.x + 64, B.y + 10, 300, 10, T.phase === 'strike' ? T.strikePow : T.power, T.power > 0.85 ? 'c' : T.power > 0.5 ? 'v' : 'h');
      OM.FONT.draw(ctx, Math.round((T.phase === 'strike' ? T.strikePow : T.power) * 100) + '%', B.x + 372, B.y + 12, { color: '8' });
    } else {
      let hint = '';
      if (T.phase === 'place') hint = T.placeAny ? 'BOLA EN MANO · haz clic para colocar la blanca' : 'SAQUE · coloca la blanca detrás de la línea y haz clic';
      else if (T.phase === 'aim') hint = 'Apunta con el ratón · mantén pulsado y arrastra hacia atrás · suelta para tirar';
      else if (T.phase === 'rolling') hint = '...';
      if (hint) OM.FONT.draw(ctx, hint, B.x + B.w / 2, B.y + 12, { color: '6', align: 'center' });
      if (T.phase === 'aim') OM.FONT.draw(ctx, '← → / rueda: ajuste fino · Espacio: potencia · ESC: menú', B.x + B.w / 2, B.y + 24, { color: '4', align: 'center' });
    }
    // intro de mesa
    if (T.intro > 0) {
      const a = Math.min(1, T.intro * 1.5);
      ctx.globalAlpha = a;
      const bw = 300, bx = (L.felt.x + L.felt.w / 2) - bw / 2, by = 150;
      OM.UI.panel(ctx, bx, by, bw, 64, T.boss ? 'blood' : 'dark');
      if (T.boss) {
        const bd = OM.bossDef(T.boss);
        OM.FONT.draw(ctx, bd.name.toUpperCase(), bx + bw / 2, by + 10, { color: 'c', size: 2, align: 'center', shadow: '0', wave: 1, t });
        OM.FONT.draw(ctx, bd.desc, bx + bw / 2, by + 34, { color: '7', align: 'center' });
        OM.FONT.draw(ctx, 'Objetivo: ' + OM.fmt(T.target), bx + bw / 2, by + 48, { color: 'd', align: 'center' });
      } else {
        OM.FONT.draw(ctx, OM.TABLE_KINDS[R.tableIdx].name.toUpperCase(), bx + bw / 2, by + 12, { color: '8', size: 2, align: 'center', shadow: '0' });
        OM.FONT.draw(ctx, 'Consigue ' + OM.fmt(T.target) + ' puntos en ' + T.shots + ' tiros', bx + bw / 2, by + 40, { color: '7', align: 'center' });
      }
      ctx.globalAlpha = 1;
    }
    // overlays
    if (T.phase === 'won') drawCashout(ctx, t);
    if (T.phase === 'lost') {
      const a = Math.min(1, (1.8 - T.endT));
      ctx.globalAlpha = a * 0.6; ctx.fillStyle = OM.PAL['9']; ctx.fillRect(0, 0, OM.W, OM.H); ctx.globalAlpha = 1;
      OM.FONT.draw(ctx, 'SIN TIROS', L.felt.x + L.felt.w / 2, 170, { color: 'c', size: 2, align: 'center', shadow: '0', wave: 2, t });
    }
    if (T.showBalls) OM.HUD.drawBallsView(ctx, R, t, () => (T.showBalls = false));
    if (OM.HUD.picker) OM.HUD.drawPicker(ctx, R, t);
    if (T.paused) OM.drawPause(ctx, t, () => (T.paused = false));
  }

  function drawCashout(ctx, t) {
    const C = T.cashout, G = OM.G;
    C.t += 1 / 60;
    const w = 260, h = 70 + C.lines.length * 14 + 30, x = L.felt.x + L.felt.w / 2 - w / 2, y = 110;
    ctx.globalAlpha = Math.min(0.6, C.t * 2); ctx.fillStyle = OM.PAL['0']; ctx.fillRect(L.table.x, L.table.y, L.table.w, L.table.h); ctx.globalAlpha = 1;
    OM.UI.panel(ctx, x, y, w, h, 'gold');
    OM.FONT.draw(ctx, '¡MESA SUPERADA!', x + w / 2, y + 10, { color: 'i', size: 2, align: 'center', shadow: '0', wave: 1, t });
    OM.FONT.draw(ctx, OM.fmt(T.score) + ' / ' + OM.fmt(T.target), x + w / 2, y + 32, { color: '7', align: 'center' });
    C.lines.forEach((l, i) => {
      if (C.t < 0.3 + i * 0.25) return;
      if (!l.shown) { l.shown = true; OM.sfx('coin', { pitch: 1 + i * 0.1 }); }
      const yy = y + 50 + i * 14;
      OM.FONT.draw(ctx, l.label, x + 16, yy, { color: '7' });
      OM.FONT.draw(ctx, '+$' + l.v, x + w - 16, yy, { color: 'h', align: 'right' });
    });
    const ready = C.t > 0.3 + C.lines.length * 0.25;
    if (ready && G.button(x + w / 2 - 60, y + h - 24, 120, 18, 'COBRAR $' + C.total, 'gold', false, 'Enter')) collect();
  }
  // depuración / playtest automatizado
  OM.dbg = () => T && { balls: T.W.balls, phase: T.phase, T };
})();

</script>
<script>/* src/game/scene_menus.js */
// OCHO MALDITO — escenas: título, taco, mapa, tienda, sobres, colección, game over, victoria, pausa.
window.OM = window.OM || {};
OM.SCENES = OM.SCENES || {};

(function () {
  const L = OM.LAYOUT;
  const CX = OM.W / 2;
  const AREA = { x: 192, y: 72, w: 442, h: 282 };

  // ---------------- PAUSA ----------------
  OM.drawPause = function (ctx, t, onClose) {
    const G = OM.G;
    ctx.globalAlpha = 0.7; ctx.fillStyle = OM.PAL['0']; ctx.fillRect(0, 0, OM.W, OM.H); ctx.globalAlpha = 1;
    const w = 200, h = 176, x = CX - w / 2, y = 90;
    OM.UI.panel(ctx, x, y, w, h, 'dark');
    OM.FONT.draw(ctx, 'PAUSA', CX, y + 10, { color: '8', size: 2, align: 'center', shadow: '0' });
    let yy = y + 38;
    if (G.button(x + 20, yy, w - 40, 18, 'CONTINUAR', 'green', false, 'Escape')) onClose(); yy += 24;
    if (G.button(x + 20, yy, w - 40, 18, 'CRT: ' + (OM.META.crt ? 'SÍ' : 'NO'), 'dark')) { OM.META.crt = !OM.META.crt; OM.saveMeta(); } yy += 24;
    if (G.button(x + 20, yy, w - 40, 18, 'MÚSICA: ' + (OM.META.music ? 'SÍ' : 'NO'), 'dark')) { OM.META.music = !OM.META.music; OM.saveMeta(); OM.music(OM._track); } yy += 24;
    if (G.button(x + 20, yy, w - 40, 18, 'SONIDO: ' + (OM.META.sfx ? 'SÍ' : 'NO'), 'dark')) { OM.META.sfx = !OM.META.sfx; OM.saveMeta(); } yy += 24;
    if (G.button(x + 20, yy, w - 40, 18, 'ABANDONAR', 'red')) { onClose(); OM.go('gameover', { reason: 'quit' }); }
  };

  // ---------------- TÍTULO ----------------
  OM.SCENES.title = {
    enter() { OM.music('menu'); this.opts = false; },
    update() {},
    draw(ctx, t) {
      const G = OM.G, M = OM.META;
      OM.UI.drawBackground(ctx, t, 'title');
      OM.UI.logo(ctx, CX, 20, t);
      OM.FONT.draw(ctx, 'un roguelite de billar en el bar del infierno', CX, 170, { color: '6', align: 'center', shadow: '0' });
      const bw = 170, bx = CX - bw / 2;
      if (G.button(bx, 196, bw, 22, 'NUEVA PARTIDA', 'red', false, 'Enter')) OM.go('cues');
      if (G.button(bx, 224, bw, 18, 'COLECCIÓN', 'blue')) OM.go('collection');
      if (G.button(bx, 248, 82, 16, 'CRT ' + (M.crt ? 'SÍ' : 'NO'), 'dark')) { M.crt = !M.crt; OM.saveMeta(); }
      if (G.button(bx + 88, 248, 82, 16, 'MÚSICA ' + (M.music ? 'SÍ' : 'NO'), 'dark')) { M.music = !M.music; OM.saveMeta(); OM.music('menu'); }
      const seen = Object.keys(M.seen).length;
      const stats = 'Partidas ' + M.runs + '   ·   Victorias ' + M.wins + '   ·   Mejor círculo ' + (M.best ? ['I', 'II', 'III', 'IV', 'V', 'VI', 'VI+'][Math.min(6, M.best)] : '-') + '   ·   Récord de tiro ' + OM.fmt(M.bestShot) + '   ·   Comodines ' + seen + '/' + OM.JOKERS.length;
      OM.FONT.draw(ctx, stats, CX, 300, { color: '5', align: 'center' });
      OM.FONT.draw(ctx, 'v1.0 · M: silenciar música', CX, 345, { color: '3', align: 'center' });
    },
  };

  // ---------------- SELECCIÓN DE TACO ----------------
  OM.SCENES.cues = {
    enter() { this.sel = 0; },
    draw(ctx, t) {
      const G = OM.G;
      OM.UI.drawBackground(ctx, t, 'map');
      OM.FONT.draw(ctx, 'ELIGE TU TACO', CX, 24, { color: '8', size: 2, align: 'center', shadow: '0' });
      OM.FONT.draw(ctx, 'Cada taco cambia las reglas de tu descenso', CX, 46, { color: '6', align: 'center' });
      const cw = 140, gap = 10, total = OM.CUES.length * cw + (OM.CUES.length - 1) * gap;
      OM.CUES.forEach((c, i) => {
        const x = Math.round(CX - total / 2 + i * (cw + gap)), y = 72;
        const sel = this.sel === i, hov = G.inside(x, y, cw, 200);
        OM.UI.panel(ctx, x, y - (sel ? 4 : 0), cw, 200, sel ? 'gold' : 'dark');
        const yy = y - (sel ? 4 : 0);
        ctx.save(); ctx.translate(x + cw / 2 - 24, yy + 14); ctx.scale(2, 2);
        OM.PX.draw(ctx, 'cue_' + c.id, 0, 0);
        ctx.restore();
        OM.FONT.draw(ctx, c.name, x + cw / 2, yy + 70, { color: sel ? 'i' : '8', align: 'center', shadow: '0' });
        OM.FONT.wrap(OM.colorize(c.desc), cw - 16).forEach((ln, j) => OM.FONT.draw(ctx, ln, x + 8, yy + 88 + j * 11, { color: '7' }));
        if (c.joker) OM.CARDS.drawJoker(ctx, OM.jokerDef(c.joker), x + cw / 2 - 20, yy + 136, { t });
        if (hov) { G.cursor = 'grab'; if (G.clicked(x, y, cw, 200)) { this.sel = i; OM.sfx('card_flip'); } }
      });
      if (G.button(CX - 90, 296, 180, 24, 'DESCENDER', 'red', false, 'Enter')) {
        OM.R = OM.Run.create(OM.CUES[this.sel].id);
        OM.R.jokers.forEach((J) => (OM.META.seen[J.id] = 1));
        OM.META.runs++; OM.saveMeta();
        OM.go('map');
      }
      if (G.button(12, 330, 70, 18, 'VOLVER', 'dark', false, 'Escape')) OM.go('title');
    },
  };

  // ---------------- MAPA (selección de mesa) ----------------
  OM.SCENES.map = {
    enter() { OM.music('menu'); OM.HUD.sel = null; this.paused = false; this.showBalls = false; },
    update() { if (OM.IN.kp.Escape && !OM.HUD.picker) this.paused = !this.paused; },
    draw(ctx, t) {
      const R = OM.R, G = OM.G;
      const theme = OM.Run.circleDef(R).theme;
      OM.TABLE.drawBackdrop(ctx, theme, t);
      ctx.globalAlpha = 0.55; ctx.fillStyle = OM.PAL['0']; ctx.fillRect(0, 0, OM.W, OM.H); ctx.globalAlpha = 1;
      const self = this;
      OM.HUD.drawPanel(ctx, R, t, {
        title: 'PREPARACIÓN', target: OM.Run.target(R), score: 0, scoreShown: 0, sub: 'Próxima mesa',
        shotName: ' ', chips: 0, mult: 0, shots: R.baseShots + OM.Run.mods(R).extraShots,
        buttons(y) {
          if (G.button(L.panel.x + 8, y, 80, 16, 'BOLAS', 'blue')) self.showBalls = true;
          if (G.button(L.panel.x + 92, y, 80, 16, 'MENÚ', 'dark')) self.paused = true;
        },
      });
      OM.HUD.drawJokers(ctx, R, t, {});
      OM.HUD.drawItems(ctx, R, t, 'map', OM.SCENES.map.api);
      const cd = OM.Run.circleDef(R);
      OM.FONT.draw(ctx, R.infinite ? 'INFINITO · ' + (R.circle + 1) : 'CÍRCULO ' + cd.name, AREA.x + AREA.w / 2, AREA.y + 6, { color: 't', size: 2, align: 'center', shadow: '0' });
      const cw = 132, gap = 12;
      OM.TABLE_KINDS.forEach((k, i) => {
        const x = AREA.x + (AREA.w - (3 * cw + 2 * gap)) / 2 + i * (cw + gap), y = AREA.y + 30;
        const done = i < R.tableIdx, cur = i === R.tableIdx;
        const isBoss = i === 2, boss = isBoss ? OM.bossDef(OM.Run.bossId(R)) : null;
        ctx.globalAlpha = done ? 0.45 : cur ? 1 : 0.7;
        OM.UI.panel(ctx, x, y - (cur ? 4 + Math.round(Math.sin(t * 3)) : 0), cw, 220, isBoss ? 'blood' : cur ? 'gold' : 'dark');
        const yy = y - (cur ? 4 + Math.round(Math.sin(t * 3)) : 0);
        OM.FONT.draw(ctx, k.name.toUpperCase(), x + cw / 2, yy + 8, { color: isBoss ? 'd' : '8', align: 'center', shadow: '0' });
        if (boss) {
          OM.CARDS.drawBossMedal(ctx, boss, x + cw / 2 - 24, yy + 24, { t });
          OM.FONT.draw(ctx, boss.name, x + cw / 2, yy + 78, { color: 'c', align: 'center', shadow: '0' });
          OM.FONT.wrap(boss.desc, cw - 14).forEach((ln, j) => OM.FONT.draw(ctx, ln, x + cw / 2, yy + 92 + j * 10, { color: '7', align: 'center' }));
        } else {
          ctx.save(); ctx.translate(x + cw / 2, yy + 50); ctx.scale(3, 3);
          OM.TABLE.drawBall(ctx, { num: i === 0 ? 1 : 9, kind: 'normal', rollX: t * 4, rollY: 0 }, 0, 0, t);
          ctx.restore();
        }
        OM.FONT.draw(ctx, 'OBJETIVO', x + cw / 2, yy + 132, { color: '6', align: 'center' });
        OM.FONT.draw(ctx, OM.fmt(OM.Run.target(R, R.circle, i)), x + cw / 2, yy + 144, { color: 'c', size: 2, align: 'center', shadow: '0' });
        OM.FONT.draw(ctx, 'Recompensa {h}$' + k.reward + '{/}', x + cw / 2, yy + 166, { color: '7', align: 'center' });
        ctx.globalAlpha = 1;
        if (done) OM.FONT.draw(ctx, 'SUPERADA', x + cw / 2, yy + 196, { color: 'm', align: 'center', shadow: '0' });
        if (cur && G.button(x + 16, yy + 190, cw - 32, 20, 'JUGAR', isBoss ? 'red' : 'green', false, 'Enter')) OM.go('table');
      });
      if (this.showBalls) OM.HUD.drawBallsView(ctx, R, t, () => (this.showBalls = false));
      if (OM.HUD.picker) OM.HUD.drawPicker(ctx, R, t);
      if (this.paused) OM.drawPause(ctx, t, () => (this.paused = false));
    },
    api: { canUseItem: () => true, onEngrave() {} },
  };

  // ---------------- TIENDA ----------------
  OM.SCENES.shop = {
    enter() {
      const R = OM.R;
      this.shop = OM.Run.makeShop(R);
      R.rerollCost = 5;
      this.sel = null; this.pack = null; this.paused = false; this.showBalls = false;
      OM.HUD.sel = null;
      OM.music('shop');
      this.flip = 0;
    },
    update(dt) { this.flip += dt; if (OM.IN.kp.Escape && !OM.HUD.picker && !this.pack) this.paused = !this.paused; },
    draw(ctx, t) {
      const R = OM.R, G = OM.G, S = this.shop;
      OM.UI.drawBackground(ctx, t, 'shop');
      const self = this;
      OM.HUD.drawPanel(ctx, R, t, {
        title: 'TIENDA', target: OM.Run.target(R), sub: 'Objetivo de la próxima mesa', score: 0, scoreShown: 0, shotName: ' ', chips: 0, mult: 0,
        shots: R.baseShots + OM.Run.mods(R).extraShots,
        buttons(y) {
          if (G.button(L.panel.x + 8, y, 80, 16, 'BOLAS', 'blue')) self.showBalls = true;
          if (G.button(L.panel.x + 92, y, 80, 16, 'MENÚ', 'dark')) self.paused = true;
        },
      });
      OM.HUD.drawJokers(ctx, R, t, {});
      OM.HUD.drawItems(ctx, R, t, 'shop', OM.SCENES.map.api);
      // mostrador
      OM.UI.panel(ctx, AREA.x, AREA.y, AREA.w, AREA.h, 'dark');
      OM.FONT.draw(ctx, 'LA TIENDA DEL BARQUERO', AREA.x + AREA.w / 2, AREA.y + 8, { color: 'h', size: 2, align: 'center', shadow: '0' });
      const offers = [];
      S.slots.forEach((o, i) => offers.push({ o, x: AREA.x + 30 + i * 62, y: AREA.y + 44, w: L.cardW, h: L.cardH }));
      S.items.forEach((o, i) => offers.push({ o, x: AREA.x + 170 + i * 52, y: AREA.y + 50, w: L.smallCardW, h: L.smallCardH }));
      S.packs.forEach((o, i) => offers.push({ o, x: AREA.x + 290 + i * 62, y: AREA.y + 44, w: L.cardW, h: L.cardH }));
      OM.FONT.draw(ctx, 'COMODINES', AREA.x + 81, AREA.y + 32, { color: '6', align: 'center' });
      OM.FONT.draw(ctx, 'CONSUMIBLES', AREA.x + 211, AREA.y + 32, { color: '6', align: 'center' });
      OM.FONT.draw(ctx, 'SOBRES', AREA.x + 341, AREA.y + 32, { color: '6', align: 'center' });
      offers.forEach((of, idx) => {
        const o = of.o;
        if (o.sold) return;
        const hov = G.inside(of.x, of.y, of.w, of.h) && !this.pack && !OM.HUD.picker;
        const sel = this.sel === o;
        const yy = of.y - (sel ? 5 : 0);
        if (o.type === 'joker') OM.CARDS.drawJoker(ctx, o.J.def, of.x, yy, { t, hover: hov, selected: sel, wobble: true, seed: idx });
        else if (o.type === 'item') OM.CARDS.drawItem(ctx, OM.itemDef(o.id), of.x, yy, { t, hover: hov, selected: sel });
        else OM.CARDS.drawPack(ctx, o.kind, of.x, yy, { t, hover: hov, selected: sel });
        // etiqueta de precio
        OM.UI.panel(ctx, of.x + of.w / 2 - 14, of.y + of.h + 4, 28, 13, 'inset');
        OM.FONT.draw(ctx, '$' + o.price, of.x + of.w / 2, of.y + of.h + 7, { color: R.money >= o.price ? 'h' : 'b', align: 'center' });
        if (hov) {
          G.cursor = 'grab';
          if (o.type === 'joker') { const rl = OM.RARITY[o.J.def.rarity]; G.tooltip(of.x + of.w / 2, of.y + of.h + 36, o.J.def.name, OM.HUD.jokerDesc(o.J), rl.color, rl.name); }
          else if (o.type === 'item') { const d = OM.itemDef(o.id); G.tooltip(of.x + of.w / 2, of.y + of.h + 36, d.name, OM.colorize(d.desc), 't', d.kind === 'luna' ? 'Luna Negra' : d.kind === 'grabado' ? 'Grabado' : 'Arcano'); }
          else G.tooltip(of.x + of.w / 2, of.y + of.h + 36, PACKS[o.kind].name, PACKS[o.kind].desc, 'h', 'Sobre');
          if (G.clicked(of.x, of.y, of.w, of.h)) { this.sel = sel ? null : o; OM.sfx('card_flip'); }
        }
        if (sel) {
          const full = (o.type === 'joker' && R.jokers.length >= R.jokerSlots) || (o.type === 'item' && R.items.length >= R.itemSlots);
          const can = R.money >= o.price && !full;
          const bw = 50;
          if (G.button(of.x + of.w / 2 - bw / 2, of.y + of.h + 20, bw, 15, full ? 'LLENO' : 'COMPRAR', 'green', !can)) this.buy(o);
        }
      });
      // botones inferiores
      const by = AREA.y + AREA.h - 34;
      if (G.button(AREA.x + 20, by, 150, 24, 'SIGUIENTE MESA', 'red')) { OM.go('map'); }
      if (G.button(AREA.x + 180, by, 110, 24, 'REROLL $' + R.rerollCost, 'green', R.money < R.rerollCost)) {
        R.money -= R.rerollCost; R.rerollCost++;
        const keepPacks = S.packs;
        this.shop = OM.Run.makeShop(R); this.shop.packs = keepPacks; this.sel = null;
        OM.sfx('reroll');
      }
      OM.FONT.draw(ctx, 'Interés: {h}$1{/} por cada {h}$5{/} (máx. {h}$' + R.interestCap + '{/})', AREA.x + AREA.w / 2, by - 16, { color: '6', align: 'center' });
      // frase del barquero
      OM.FONT.draw(ctx, QUOTES[Math.floor(t / 6) % QUOTES.length], AREA.x + AREA.w / 2, AREA.y + 150, { color: '5', align: 'center' });
      // overlays
      if (this.pack) this.drawPack(ctx, t);
      if (this.showBalls) OM.HUD.drawBallsView(ctx, R, t, () => (this.showBalls = false));
      if (OM.HUD.picker) OM.HUD.drawPicker(ctx, R, t);
      if (this.paused) OM.drawPause(ctx, t, () => (this.paused = false));
    },
    buy(o) {
      const R = OM.R;
      R.money -= o.price; o.sold = true; this.sel = null;
      OM.sfx('buy');
      OM.FX.burst(OM.IN.mx, OM.IN.my, 'gold', 10);
      if (o.type === 'joker') { R.jokers.push(o.J); OM.META.seen[o.id] = 1; OM.saveMeta(); }
      else if (o.type === 'item') R.items.push(o.id);
      else { this.pack = { kind: o.kind, opts: OM.Run.openPack(R, o.kind), t: 0 }; OM.sfx('pack_open'); OM.FX.flash('h', 0.25, 0.3); }
    },
    drawPack(ctx, t) {
      const R = OM.R, G = OM.G, P = this.pack;
      P.t += 1 / 60;
      ctx.globalAlpha = 0.8; ctx.fillStyle = OM.PAL['0']; ctx.fillRect(0, 0, OM.W, OM.H); ctx.globalAlpha = 1;
      OM.FONT.draw(ctx, PACKS[P.kind].name.toUpperCase(), CX, 66, { color: 'h', size: 2, align: 'center', shadow: '0', wave: 1, t });
      OM.FONT.draw(ctx, 'Elige una carta', CX, 88, { color: '7', align: 'center' });
      P.opts.forEach((op, i) => {
        const big = op.type === 'joker';
        const w = big ? L.cardW : L.smallCardW, h = big ? L.cardH : L.smallCardH;
        const x = CX - 100 + i * 100 - w / 2, y = 150 + (big ? 0 : 8);
        const appear = Math.min(1, Math.max(0, (P.t - i * 0.15) * 4));
        if (appear <= 0) return;
        if (appear < 1) { OM.CARDS.drawBack(ctx, x, y, big ? 'joker' : 'item', { t }); return; }
        if (!op.flipped) { op.flipped = true; OM.sfx('card_flip', { pitch: 1 + i * 0.1 }); }
        const hov = G.inside(x, y, w, h) && !OM.HUD.picker;
        ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(2, 2); ctx.translate(-w / 2, -h / 2);
        if (big) OM.CARDS.drawJoker(ctx, op.J.def, 0, 0, { t, hover: hov, wobble: true, seed: i });
        else OM.CARDS.drawItem(ctx, OM.itemDef(op.id), 0, 0, { t, hover: hov });
        ctx.restore();
        let name, desc, color, sub;
        if (big) { name = op.J.def.name; desc = OM.HUD.jokerDesc(op.J); const rl = OM.RARITY[op.J.def.rarity]; color = rl.color; sub = rl.name; }
        else { const d = OM.itemDef(op.id); name = d.name; desc = OM.colorize(d.desc); color = 't'; sub = d.kind; }
        if (hov) { G.cursor = 'grab'; G.tooltip(x + w / 2, y + h * 1.5 + 30, name, desc, color, sub); }
        const full = big && R.jokers.length >= R.jokerSlots;
        if (G.button(x + w / 2 - 30, y + h + 36, 60, 16, full ? 'LLENO' : 'ELEGIR', 'green', full || !!OM.HUD.picker)) {
          this.pack = null;
          if (big) { R.jokers.push(op.J); OM.META.seen[op.id] = 1; OM.saveMeta(); OM.sfx('buy'); }
          else OM.HUD.useItem(R, -1, 'shop', OM.SCENES.map.api, op.id);
        }
      });
      if (G.button(CX - 40, 300, 80, 16, 'SALTAR', 'dark')) this.pack = null;
    },
  };

  const PACKS = {
    arcano: { name: 'Sobre Arcano', desc: 'Elige 1 de 3 Arcanos. Se usa al instante.' },
    luna: { name: 'Sobre Lunar', desc: 'Elige 1 de 3 Lunas Negras. Se usa al instante.' },
    grabado: { name: 'Sobre de Grabados', desc: 'Elige 1 de 3 Grabados para tus bolas.' },
    maldito: { name: 'Sobre Maldito', desc: 'Elige 1 de 3 comodines. Puede contener LEGENDARIOS.' },
  };
  const QUOTES = [
    '"Aquí abajo nadie juega limpio, forastero."',
    '"La 8 siempre vuelve. Siempre."',
    '"¿Dinero? Lo que cuenta es el Mult."',
    '"Cada bola que metes es un alma que te debe un favor."',
    '"Vende lo que no te sirva. Aquí todo tiene precio."',
  ];

  // ---------------- COLECCIÓN ----------------
  OM.SCENES.collection = {
    draw(ctx, t) {
      const G = OM.G;
      OM.UI.drawBackground(ctx, t, 'map');
      OM.FONT.draw(ctx, 'COLECCIÓN DE COMODINES', CX, 14, { color: '8', size: 2, align: 'center', shadow: '0' });
      const per = 10, cw = 40, ch = 54, gx = 18, gy = 20;
      const x0 = CX - (per * cw + (per - 1) * gx) / 2;
      OM.JOKERS.forEach((j, i) => {
        const x = x0 + (i % per) * (cw + gx), y = 46 + Math.floor(i / per) * (ch + gy);
        const seen = OM.META.seen[j.id];
        if (seen) OM.CARDS.drawJoker(ctx, j, x, y, { t, hover: G.inside(x, y, cw, ch) });
        else OM.CARDS.drawBack(ctx, x, y, 'joker', { t });
        if (G.inside(x, y, cw, ch)) {
          if (seen) { const rl = OM.RARITY[j.rarity]; G.tooltip(x + cw / 2, y + ch + 4, j.name, OM.colorize(j.desc), rl.color, rl.name); }
          else G.tooltip(x + cw / 2, y + ch + 4, '???', 'Aún no descubierto.', '5', OM.RARITY[j.rarity].name);
        }
      });
      if (G.button(CX - 50, 330, 100, 18, 'VOLVER', 'dark', false, 'Escape')) OM.go('title');
    },
  };

  // ---------------- GAME OVER ----------------
  OM.SCENES.gameover = {
    enter(arg) { this.arg = arg || {}; OM.music('gameover'); OM.sfx('lose'); this.t0 = OM.time; OM.saveMeta(); },
    draw(ctx, t) {
      const R = OM.R, G = OM.G;
      OM.UI.drawBackground(ctx, t, 'gameover');
      OM.FONT.draw(ctx, 'HAS CAÍDO', CX, 40, { color: 'c', size: 2, align: 'center', shadow: '0', wave: 1, t, scale: 2 });
      if (!R) { if (G.button(CX - 60, 300, 120, 22, 'MENÚ', 'dark')) OM.go('title'); return; }
      const cd = OM.Run.circleDef(R);
      const w = 300, x = CX - w / 2, y = 96;
      OM.UI.panel(ctx, x, y, w, 150, 'blood');
      const rows = [
        ['Círculo alcanzado', cd.name],
        ['Mesas superadas', String(R.stats.tables)],
        ['Mejor tiro', OM.fmt(R.stats.bestShot)],
        ['Bolas embocadas', String(R.stats.balls)],
        ['Tiros totales', String(R.stats.shots)],
        ['Semilla', R.seedStr],
      ];
      if (this.arg.reason === 'score') rows.unshift(['Puntuación', OM.fmt(this.arg.score) + ' / ' + OM.fmt(this.arg.target)]);
      rows.forEach((r, i) => {
        OM.FONT.draw(ctx, r[0], x + 14, y + 12 + i * 18, { color: '7' });
        OM.FONT.draw(ctx, r[1], x + w - 14, y + 12 + i * 18, { color: i === 0 ? 'c' : '8', align: 'right' });
      });
      R.jokers.forEach((J, i) => OM.CARDS.drawJoker(ctx, J.def, CX - (R.jokers.length * 46) / 2 + i * 46 + 3, 254, { t }));
      if (G.button(CX - 130, 322, 124, 22, 'NUEVA PARTIDA', 'red', false, 'Enter')) OM.go('cues');
      if (G.button(CX + 6, 322, 124, 22, 'MENÚ', 'dark', false, 'Escape')) OM.go('title');
    },
  };

  // ---------------- VICTORIA ----------------
  OM.SCENES.victory = {
    drawsFX: true,
    enter() { OM.META.wins++; OM.saveMeta(); OM.music('menu'); OM.sfx('win_table'); this.t0 = OM.time; },
    draw(ctx, t) {
      const R = OM.R, G = OM.G;
      OM.UI.drawBackground(ctx, t, 'victory');
      if ((t * 10 | 0) % 7 === 0) OM.FX.burst(100 + Math.random() * 440, 60 + Math.random() * 100, 'gold', 4);
      OM.FX.draw(ctx);
      OM.FONT.draw(ctx, '¡HAS ESCAPADO', CX, 40, { color: 'h', size: 2, align: 'center', shadow: '0', wave: 1, t, scale: 2 });
      OM.FONT.draw(ctx, 'DEL ABISMO!', CX, 76, { color: 'h', size: 2, align: 'center', shadow: '0', wave: 1, t, scale: 2 });
      OM.FONT.draw(ctx, 'La 8 maldita se rinde ante ti. Por ahora.', CX, 120, { color: '7', align: 'center' });
      const rows = [['Mejor tiro', OM.fmt(R.stats.bestShot)], ['Bolas embocadas', String(R.stats.balls)], ['Dinero ganado', '$' + R.stats.money], ['Semilla', R.seedStr]];
      rows.forEach((r, i) => {
        OM.FONT.draw(ctx, r[0], CX - 110, 150 + i * 16, { color: '6' });
        OM.FONT.draw(ctx, r[1], CX + 110, 150 + i * 16, { color: '8', align: 'right' });
      });
      R.jokers.forEach((J, i) => OM.CARDS.drawJoker(ctx, J.def, CX - (R.jokers.length * 46) / 2 + i * 46 + 3, 226, { t, wobble: true, seed: i }));
      if (G.button(CX - 150, 316, 140, 22, 'MODO INFINITO', 'gold')) { R.infinite = true; OM.go('shop'); }
      if (G.button(CX + 10, 316, 140, 22, 'MENÚ', 'dark')) OM.go('title');
    },
  };
})();

</script>
<script>OM.boot();</script>
