<script>/* src/core/px.js */
// OCHO MALDITO — núcleo de píxeles: paleta, layout y registro de sprites.
// Todo el arte del juego debe usar ESTA paleta (32 colores). Ver docs/ART_CONTRACT.md
window.OM = window.OM || {};

OM.W = 640; // resolución interna (se escala x2/x3 con nearest-neighbor)
OM.H = 360;

// Paleta "Cripta" — 32 colores. Clave de 1 carácter -> hex.
OM.PAL = {
  '0': '#07050d', // vacío
  '1': '#120d1f', // noche profunda
  '2': '#1f1633', // púrpura oscuro
  '3': '#2e2147', // púrpura
  '4': '#45305e', // violeta
  '5': '#6b4a7d', // malva
  '6': '#9a7aa0', // lila polvo
  '7': '#d9c8d0', // hueso
  '8': '#fff4e0', // brillo
  '9': '#3a0d1a', // sangre seca
  'a': '#6e1428', // sangre
  'b': '#a8233a', // carmesí
  'c': '#e8435a', // rojo caliente (MULT)
  'd': '#ff8f6b', // brasa
  'e': '#4a2a12', // madera oscura
  'f': '#7a4a22', // madera
  'g': '#b5793a', // latón
  'h': '#f2c14e', // oro ($)
  'i': '#fff09a', // oro pálido
  'j': '#0b2620', // paño profundo
  'k': '#12402f', // paño
  'l': '#1d6b45', // paño claro
  'm': '#3fbf6a', // verde tóxico
  'n': '#a6f07a', // lima ácida
  'o': '#0d1f3a', // azul abisal
  'p': '#1f4a7a', // azul
  'q': '#3d8fd1', // azul cian (FICHAS)
  'r': '#7ee0f0', // cian hielo
  's': '#5a1f6b', // magenta oscuro
  't': '#a83fc4', // magenta
  'u': '#ff6ad5', // rosa neón
  'v': '#ff9a1f', // naranja
};
OM.col = (c) => (c && c.length === 1 ? OM.PAL[c] : c);

// Layout de pantalla compartido (640x360). Ver docs/ART_CONTRACT.md
OM.LAYOUT = {
  panel:   { x: 6,   y: 6,  w: 176, h: 348 },       // panel izquierdo (puntuación, tiros, $)
  jokers:  { x: 192, y: 6,  w: 300, h: 58 },        // fila de comodines (5 cartas 40x54)
  consum:  { x: 500, y: 6,  w: 134, h: 58 },        // consumibles (2-3 cartas)
  table:   { x: 192, y: 72, w: 436, h: 236 },       // mesa exterior (madera + bandas)
  felt:    { x: 210, y: 90, w: 400, h: 200 },       // paño jugable
  bottom:  { x: 192, y: 314, w: 442, h: 40 },       // barra inferior (potencia, info)
  ballR: 6, pocketR: 11, cardW: 40, cardH: 54, smallCardW: 30, smallCardH: 40,
};

// ---------- Helpers de píxel ----------
OM.PX = (function () {
  const store = {};
  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { c, ctx };
  }
  // "g": pincel de píxel sobre un canvas pequeño.
  function painter(ctx, w, h) {
    const g = {
      w, h, ctx,
      p(x, y, c) { ctx.fillStyle = OM.col(c); ctx.fillRect(x | 0, y | 0, 1, 1); },
      rect(x, y, rw, rh, c) { ctx.fillStyle = OM.col(c); ctx.fillRect(x | 0, y | 0, rw | 0, rh | 0); },
      frame(x, y, rw, rh, c) { g.rect(x, y, rw, 1, c); g.rect(x, y + rh - 1, rw, 1, c); g.rect(x, y, 1, rh, c); g.rect(x + rw - 1, y, 1, rh, c); },
      clear(x = 0, y = 0, rw = w, rh = h) { ctx.clearRect(x, y, rw, rh); },
      circle(cx, cy, r, c) { // círculo relleno nítido
        ctx.fillStyle = OM.col(c);
        for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
          if (x * x + y * y <= r * r + r * 0.8) ctx.fillRect((cx + x) | 0, (cy + y) | 0, 1, 1);
      },
      ring(cx, cy, r, c) {
        ctx.fillStyle = OM.col(c);
        for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
          const d = x * x + y * y;
          if (d <= r * r + r * 0.8 && d > (r - 1) * (r - 1) + (r - 1) * 0.8) ctx.fillRect((cx + x) | 0, (cy + y) | 0, 1, 1);
        }
      },
      line(x0, y0, x1, y1, c) { // Bresenham
        x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
        ctx.fillStyle = OM.col(c);
        const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
        let err = dx + dy;
        for (;;) {
          ctx.fillRect(x0, y0, 1, 1);
          if (x0 === x1 && y0 === y1) break;
          const e2 = 2 * err;
          if (e2 >= dy) { err += dy; x0 += sx; }
          if (e2 <= dx) { err += dx; y0 += sy; }
        }
      },
      dither(x, y, rw, rh, a, b, mode = 'checker') { // tramado 2 colores
        for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) {
          let useB;
          if (mode === 'checker') useB = (i + j) % 2 === 0;
          else if (mode === 'sparse') useB = i % 2 === 0 && j % 2 === 0;
          else if (mode === 'lines') useB = j % 2 === 0;
          else useB = false;
          const c = useB ? b : a;
          if (c) g.p(x + i, y + j, c);
        }
      },
      // contorno de 1px alrededor de los píxeles opacos actuales
      outline(c, diag = false) {
        const img = ctx.getImageData(0, 0, w, h).data;
        const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && img[(y * w + x) * 4 + 3] > 0;
        const pts = [];
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          if (op(x, y)) continue;
          if (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1) ||
            (diag && (op(x - 1, y - 1) || op(x + 1, y - 1) || op(x - 1, y + 1) || op(x + 1, y + 1)))) pts.push([x, y]);
        }
        ctx.fillStyle = OM.col(c);
        pts.forEach(([x, y]) => ctx.fillRect(x, y, 1, 1));
      },
      // dibuja filas de caracteres de paleta ('.' o ' ' = transparente)
      rows(x, y, rows, map) {
        rows.forEach((row, j) => {
          for (let i = 0; i < row.length; i++) {
            let ch = row[i];
            if (map && map[ch] !== undefined) ch = map[ch];
            if (!ch || ch === '.' || ch === ' ') continue;
            g.p(x + i, y + j, ch);
          }
        });
      },
      sprite(name, x, y) { const s = store[name]; if (s) ctx.drawImage(s.c, x | 0, y | 0); },
    };
    return g;
  }
  // Registrar sprite procedural: make('nombre', w, h, g => {...})
  function make(name, w, h, fn) {
    const { c, ctx } = canvas(w, h);
    fn(painter(ctx, w, h));
    store[name] = { c, w, h };
    return store[name];
  }
  // Registrar sprite desde filas de texto
  function sprite(name, rows, map) {
    const h = rows.length, w = Math.max(...rows.map((r) => r.length));
    return make(name, w, h, (g) => g.rows(0, 0, rows, map));
  }
  function get(name) { return store[name]; }
  function has(name) { return !!store[name]; }
  function draw(ctx, name, x, y, o) {
    const s = store[name];
    if (!s) return false;
    o = o || {};
    ctx.save();
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    const sc = o.scale || 1;
    if (o.flipX || o.rot || sc !== 1) {
      ctx.translate((x | 0) + (s.w * sc) / 2, (y | 0) + (s.h * sc) / 2);
      if (o.rot) ctx.rotate(o.rot);
      ctx.scale(o.flipX ? -sc : sc, sc);
      ctx.drawImage(s.c, -s.w / 2, -s.h / 2);
    } else ctx.drawImage(s.c, x | 0, y | 0);
    ctx.restore();
    return true;
  }
  function names() { return Object.keys(store); }
  return { canvas, painter, make, sprite, get, has, draw, names, store };
})();

</script>

    3: ['######.', '#######', '.....##', '.....##', '..####.', '..#####', '.....##', '.....##', '.....##', '#######', '######.'],
    4: ['##...##', '##...##', '##...##', '##...##', '##...##', '#######', '#######', '.....##', '.....##', '.....##', '.....##'],
    5: ['#######', '#######', '##.....', '##.....', '######.', '#######', '.....##', '.....##', '.....##', '#######', '######.'],
    6: ['.######', '#######', '##.....', '##.....', '######.', '#######', '##...##', '##...##', '##...##', '#######', '.#####.'],
    7: ['#######', '#######', '.....##', '....##.', '...##..', '..##...', '..##...', '..##...', '..##...', '..##...', '..##...'],
    8: ['.#####.', '#######', '##...##', '##...##', '.#####.', '#######', '##...##', '##...##', '##...##', '#######', '.#####.'],
    9: ['.#####.', '#######', '##...##', '##...##', '##...##', '#######', '.######', '.....##', '.....##', '#######', '######.'],

    '.': ['', '', '', '', '', '', '', '', '', '##', '##'],
    ',': ['', '', '', '', '', '', '', '', '', '##', '##', '.#', '#.'],
    ':': ['', '', '##', '##', '', '', '', '##', '##', '', ''],
    '!': ['##', '##', '##', '##', '##', '##', '##', '', '', '##', '##'],
    '?': ['.#####.', '#######', '##...##', '.....##', '...####', '..###..', '..##...', '..##...', '.......', '..##...', '..##...'],
    "'": ['##', '##', '.#'],
    '"': ['##.##', '##.##', '.#..#'],
    '(': ['.##', '##.', '##.', '##.', '##.', '##.', '##.', '##.', '##.', '##.', '.##'],
    ')': ['##.', '.##', '.##', '.##', '.##', '.##', '.##', '.##', '.##', '.##', '##.'],
    '+': ['', '', '..##..', '..##..', '######', '######', '..##..', '..##..', '', '', ''],
    '-': ['', '', '', '', '#####', '#####', '', '', '', '', ''],
    '=': ['', '', '######', '######', '', '', '######', '######', '', '', ''],
    '/': ['....##', '....##', '...##.', '...##.', '..##..', '..##..', '.##...', '.##...', '##....', '##....', '##....'],
    '%': ['###..##', '###.##.', '###.##.', '...##..', '...##..', '..##...', '..##...', '.##.###', '.##.###', '##..###', '##.....'],
    '$': ['..##...', '.######', '#######', '##.##..', '######.', '.######', '..##.##', '#######', '######.', '..##...', '..##...'],
    'x': ['', '', '', '', '##..##', '.####.', '..##..', '.####.', '##..##', '', ''],
    '×': ['', '', '', '', '##..##', '.####.', '..##..', '.####.', '##..##', '', ''],
    '#': ['.##.##.', '.##.##.', '#######', '#######', '.##.##.', '.##.##.', '#######', '#######', '.##.##.', '.##.##.', ''],
    '*': ['', '', '..##..', '##..##', '.####.', '######', '.####.', '##..##', '..##..', '', ''],
    '<': ['', '', '....##', '...##.', '..##..', '.##...', '..##..', '...##.', '....##', '', ''],
    '>': ['', '', '##....', '.##...', '..##..', '...##.', '..##..', '.##...', '##....', '', ''],
    '&': ['.####..', '##..##.', '##..##.', '.####..', '.###...', '#####.#', '##.####', '##..##.', '##..###', '#######', '.###.##'],
    '♥': ['', '.##.##.', '#######', '#######', '#######', '.#####.', '..###..', '...#...', '', '', ''],
    '★': ['...#...', '..###..', '..###..', '#######', '.#####.', '..###..', '.##.##.', '.#...#.', '', '', ''],
    '_': ['', '', '', '', '', '', '', '', '', '', '', '#######'],
  };
  const S2_SPACE = 4;

  // Acentos (fila relativa a la línea de mayúscula; mayúsculas usan filas negativas)
  const ACC1 = {
    acute: ['.#', '#.'], grave: ['#.', '.#'], diaer: ['#.#'], tilde: ['.##.#', '#.##.'], circ: ['.#.', '#.#'],
  };
  const ACC2 = {
    acute: ['..##', '.##.'], grave: ['##..', '.##.'], diaer: ['##.##', '##.##'], tilde: ['.###..#', '#..###.'], circ: ['..##..', '.####.'],
  };
  const ACCENTED = {
    'Á': ['A', 'acute'], 'É': ['E', 'acute'], 'Í': ['I', 'acute'], 'Ó': ['O', 'acute'], 'Ú': ['U', 'acute'],
    'Ü': ['U', 'diaer'], 'Ñ': ['N', 'tilde'], 'À': ['A', 'grave'], 'È': ['E', 'grave'], 'Ò': ['O', 'grave'],
    'á': ['a', 'acute'], 'é': ['e', 'acute'], 'í': ['ı', 'acute'], 'ó': ['o', 'acute'], 'ú': ['u', 'acute'],
    'ü': ['u', 'diaer'], 'ñ': ['n', 'tilde'], 'à': ['a', 'grave'], 'è': ['e', 'grave'], 'ò': ['o', 'grave'],
  };
  S1['ı'] = ['', '', '#', '#', '#', '#', '#']; // i sin punto (base de í)

  // ------------------------------------------------------------------
  // Compilación de glifos -> {w, px:[[x,y],...], top, bottom}
  // ------------------------------------------------------------------
  function parse(rows, dy) {
    const px = [];
    let w = 0;
    rows.forEach((r, j) => {
      w = Math.max(w, r.length);
      for (let i = 0; i < r.length; i++) if (r[i] === '#') px.push([i, j + (dy || 0)]);
    });
    return { w, px };
  }
  function rot180(rows) {
    const w = Math.max(...rows.map((r) => r.length));
    const h = rows.length;
    const out = [];
    for (let j = h - 1; j >= 0; j--) out.push(rows[j].padEnd(w, '.').split('').reverse().join(''));
    return out;
  }
  S2['¡'] = rot180(S2['!']);
  S2['¿'] = rot180(S2['?']);

  const GL = { 1: {}, 2: {} };
  function compile(size) {
    const src = size === 1 ? S1 : S2;
    const acc = size === 1 ? ACC1 : ACC2;
    const capH = size === 1 ? 7 : 11;
    const out = GL[size];
    for (const ch in src) out[ch] = parse(src[ch]);
    out[' '] = { w: size === 1 ? S1_SPACE : S2_SPACE, px: [] };
    for (const ch in ACCENTED) {
      let [base, a] = ACCENTED[ch];
      if (size === 2) base = base === 'ı' ? 'I' : base.toUpperCase();
      const b = out[base];
      if (!b) continue;
      const lower = size === 1 && base === base.toLowerCase() && base !== base.toUpperCase() || base === 'ı';
      const arows = acc[a];
      const aw = Math.max(...arows.map((r) => r.length));
      const w = Math.max(b.w, aw);
      const bx = Math.floor((w - b.w) / 2);
      const ax = Math.ceil((w - aw) / 2);
      // filas del acento: mayúsculas 3px por encima (con 1px de aire); minúsculas sobre la x-height
      const top = lower ? (arows.length === 1 ? 0 : -1) : -(arows.length + 1);
      const px = b.px.map(([x, y]) => [x + bx, y]);
      arows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === '#') px.push([i + ax, top + j]); });
      out[ch] = { w, px };
    }
    for (const ch in out) {
      const g = out[ch];
      let t = 0, b = capH - 1;
      g.px.forEach(([, y]) => { if (y < t) t = y; if (y > b) b = y; });
      g.top = t; g.bot = b;
    }
  }
  compile(1);
  compile(2);

  const SPACING = { 1: 1, 2: 1 };
  const CAP = { 1: 7, 2: 11 };
  const LINE = { 1: 10, 2: 15 };

  function glyphFor(size, ch) {
    const set = GL[size];
    if (set[ch]) return { g: set[ch], s: size };
    if (size === 2) {
      const up = ch.toUpperCase();
      if (set[up]) return { g: set[up], s: 2 };
      if (GL[1][ch]) return { g: GL[1][ch], s: 1 }; // reserva: glifo pequeño centrado
    }
    return { g: set['?'], s: size };
  }

  // Rampas para el degradado arcade del tamaño display (claro arriba, oscuro abajo)
  const RAMP = {
    '8': ['8', '8', '7'], '7': ['8', '7', '6'], '6': ['7', '6', '5'], '5': ['6', '5', '4'], '4': ['5', '4', '3'],
    'h': ['i', 'h', 'g'], 'i': ['8', 'i', 'h'], 'g': ['h', 'g', 'f'], 'v': ['h', 'v', 'b'], 'd': ['i', 'd', 'c'],
    'c': ['d', 'c', 'b'], 'b': ['c', 'b', 'a'], 'a': ['b', 'a', '9'],
    'q': ['r', 'q', 'p'], 'r': ['8', 'r', 'q'], 'p': ['q', 'p', 'o'],
    'm': ['n', 'm', 'l'], 'n': ['8', 'n', 'm'], 'l': ['m', 'l', 'k'],
    'u': ['8', 'u', 't'], 't': ['u', 't', 's'], 's': ['t', 's', '3'],
  };

  // ------------------------------------------------------------------
  // Caché de glifos renderizados
  // ------------------------------------------------------------------
  const cache = new Map();
  const PAD = 3;
  function renderGlyph(size, ch, color, outline, shadow, grad) {
    const key = size + '\u0001' + ch + '\u0001' + color + '\u0001' + (outline || '') + '\u0001' + (shadow || '') + '\u0001' + (grad ? 1 : 0);
    let e = cache.get(key);
    if (e) return e;
    const { g, s } = glyphFor(size, ch);
    // reserva de tamaño 1 dentro de display: centrar verticalmente
    const dy = s !== size ? Math.floor((CAP[size] - CAP[s]) / 2) : 0;
    const top = g.top + dy, bot = g.bot + dy;
    const W = g.w + PAD * 2, H = bot - top + 1 + PAD * 2;
    const ox = PAD, oy = PAD - top; // origen (línea de mayúscula) dentro del canvas
    const c = document.createElement('canvas');
    c.width = Math.max(1, W); c.height = Math.max(1, H);
    const x = c.getContext('2d');
    const on = new Set(g.px.map(([a, b]) => a + ',' + (b + dy)));
    const fill = (pts, col) => { x.fillStyle = OM.col(col); pts.forEach(([a, b]) => x.fillRect(a + ox, b + oy, 1, 1)); };
    let body = g.px.map(([a, b]) => [a, b + dy]);
    let dil = null;
    if (outline) {
      const ds = new Set();
      body.forEach(([a, b]) => {
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
          if (size === 1 && i && j) continue; // contorno en cruz para el tamaño pequeño (más limpio)
          const k = (a + i) + ',' + (b + j);
          if (!on.has(k)) ds.add(k);
        }
      });
      dil = [...ds].map((k) => k.split(',').map(Number));
    }
    if (shadow) {
      const sh = size === 2 ? [1, 2] : [1, 1];
      const base = outline ? body.concat(dil) : body;
      const all = new Set(base.map(([a, b]) => a + ',' + b));
      const pts = [];
      base.forEach(([a, b]) => { for (let k = 1; k <= sh[1]; k++) { const kk = (a + (k === 1 ? sh[0] : sh[0])) + ',' + (b + k); if (!all.has(kk)) pts.push([a + sh[0], b + k]); } });
      fill(pts, shadow);
    }
    if (dil) fill(dil, outline);
    if (grad && RAMP[color]) {
      const r = RAMP[color];
      const capH = CAP[size];
      body.forEach(([a, b]) => {
        let col = r[1];
        if (size === 2) { if (b <= 1) col = r[0]; else if (b >= capH - 2) col = r[2]; }
        else { if (b <= 0) col = r[0]; else if (b >= capH - 1) col = r[2]; }
        x.fillStyle = OM.col(col); x.fillRect(a + ox, b + oy, 1, 1);
      });
    } else fill(body, color);
    e = { c, ox, oy, w: g.w };
    cache.set(key, e);
    return e;
  }

  // ------------------------------------------------------------------
  // Parseo de códigos de color: "{q}hola{/}" -> runs
  // ------------------------------------------------------------------
  const parsed = new Map();
  function runs(text) {
    let r = parsed.get(text);
    if (r) return r;
    r = [];
    let col = null, i = 0, buf = '';
    while (i < text.length) {
      const ch = text[i];
      if (ch === '{') {
        const j = text.indexOf('}', i);
        if (j > i && j - i <= 3) {
          const code = text.slice(i + 1, j);
          if (code === '/' || code === '' || OM.PAL[code]) {
            if (buf) r.push([buf, col]);
            buf = '';
            col = code === '/' || code === '' ? null : code;
            i = j + 1;
            continue;
          }
        }
      }
      buf += ch; i++;
    }
    if (buf) r.push([buf, col]);
    if (parsed.size > 4000) parsed.clear();
    parsed.set(text, r);
    return r;
  }
  function strip(text) { return runs(String(text)).map((r) => r[0]).join(''); }

  function advance(size, ch) { return glyphFor(size, ch).g.w; }
  function measureLine(text, size) {
    size = size === 2 ? 2 : 1;
    const s = strip(text);
    let w = 0;
    for (let i = 0; i < s.length; i++) { w += advance(size, s[i]); if (i < s.length - 1) w += SPACING[size]; }
    return w;
  }
  function measure(text, size) {
    text = String(text);
    if (text.indexOf('\n') < 0) return measureLine(text, size);
    return Math.max(...text.split('\n').map((l) => measureLine(l, size)));
  }
  function lineH(size) { return LINE[size === 2 ? 2 : 1]; }
  function capH(size) { return CAP[size === 2 ? 2 : 1]; }

  function wrap(text, maxW, size) {
    size = size === 2 ? 2 : 1;
    const out = [];
    let carry = null; // color abierto que cruza de línea
    String(text).split('\n').forEach((para) => {
      const words = para.split(' ');
      let line = carry ? '{' + carry + '}' : '';
      let lineHasWord = false;
      const flush = () => { out.push(line); };
      words.forEach((w) => {
        const test = lineHasWord ? line + ' ' + w : line + w;
        if (lineHasWord && measureLine(test, size) > maxW) {
          flush();
          line = (carry ? '{' + carry + '}' : '') + w;
        } else line = test;
        lineHasWord = true;
        // seguir el color abierto
        const rr = w.match(/\{([^}]{0,2})\}/g);
        if (rr) rr.forEach((m) => { const c = m.slice(1, -1); carry = c === '/' || c === '' ? null : (OM.PAL[c] ? c : carry); });
      });
      flush();
    });
    return out;
  }

  // ------------------------------------------------------------------
  // Dibujo
  // ------------------------------------------------------------------
  function drawLine(ctx, text, x, y, o) {
    const size = o.size;
    const sc = o.scale;
    const rr = runs(text);
    const w = measureLine(text, size) * sc;
    let cx = x;
    if (o.align === 'center') cx = x - Math.floor(w / 2);
    else if (o.align === 'right') cx = x - w;
    cx = Math.round(cx); y = Math.round(y);
    const sp = SPACING[size];
    let idx = 0;
    for (let r = 0; r < rr.length; r++) {
      const str = rr[r][0];
      const col = rr[r][1] || o.color;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const e = renderGlyph(size, ch, col, o.outline, o.shadow, o.grad);
        let gy = y;
        if (o.wave) gy += Math.round(Math.sin((o.t || 0) * 6 + idx * 0.55) * o.wave);
        if (ch !== ' ') {
          if (sc === 1) ctx.drawImage(e.c, cx - e.ox, gy - e.oy);
          else ctx.drawImage(e.c, cx - e.ox * sc, gy - e.oy * sc, e.c.width * sc, e.c.height * sc);
        }
        cx += (e.w + sp) * sc;
        idx++;
      }
    }
    return w;
  }

  const DEF = { color: '7', align: 'left', shadow: null, size: 1, scale: 1, outline: null, wave: 0, t: 0 };
  function draw(ctx, text, x, y, opts) {
    text = String(text);
    const o = Object.assign({}, DEF, opts || {});
    o.size = o.size === 2 ? 2 : 1;
    o.scale = Math.max(1, Math.round(o.scale || 1));
    if (o.grad === undefined) o.grad = o.size === 2;
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    let w = 0;
    if (text.indexOf('\n') >= 0) {
      const lines = text.split('\n');
      lines.forEach((l, i) => { w = Math.max(w, drawLine(ctx, l, x, y + i * LINE[o.size] * o.scale, o)); });
    } else w = drawLine(ctx, text, x, y, o);
    ctx.imageSmoothingEnabled = prev;
    return w;
  }

  // Renderiza un texto a un canvas propio (útil para popTexts escalados o cachear títulos).
  function bake(text, opts) {
    const o = Object.assign({}, DEF, opts || {}, { align: 'left', wave: 0, scale: 1 });
    o.size = o.size === 2 ? 2 : 1;
    const w = measure(text, o.size);
    const lines = String(text).split('\n').length;
    const pad = 4;
    const c = document.createElement('canvas');
    c.width = w + pad * 2; c.height = CAP[o.size] + (lines - 1) * LINE[o.size] + pad * 2 + 4;
    const x = c.getContext('2d');
    draw(x, text, pad, pad + 3, o);
    return { c, ox: pad, oy: pad + 3, w, h: CAP[o.size] };
  }

  return { draw, measure, lineH, capH, wrap, strip, bake, glyphs: GL, cacheSize: () => cache.size };
})();

<script>/* src/art/ui_art.js */
// OCHO MALDITO — UI: paneles 9-slice, botones, iconos, cajas de Fichas/Mult, barras,
// cursor, fondos animados de escena y el LOGO. Ver docs/ART_CONTRACT.md
// Todo procedural, paleta OM.PAL, coordenadas enteras. Lo estático se cachea en canvases.
window.OM = window.OM || {};
OM.ART_INIT = OM.ART_INIT || [];

OM.UI = (function () {
  const PAL = OM.PAL;
  const W = OM.W || 640, H = OM.H || 360;

  // ---------------------------------------------------------------- utilidades
  function mk(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { c, ctx, g: OM.PX.painter(ctx, c.width, c.height) };
  }
  // caché LRU de canvases (paneles/botones de tamaños variados)
  const lru = new Map();
  function cached(key, w, h, fn) {
    let e = lru.get(key);
    if (e) { lru.delete(key); lru.set(key, e); return e; }
    e = mk(w, h);
    fn(e.g, e.ctx, w, h);
    lru.set(key, e);
    if (lru.size > 400) lru.delete(lru.keys().next().value);
    return e;
  }
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bayer = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function vnoise(x, y) { // ruido de valor suave
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }
  function pick(ramp, v, x, y) { // cuantiza v∈[0,1] en una rampa con tramado Bayer
    v = clamp(v, 0, 0.9999);
    const f = v * (ramp.length - 1);
    let i = Math.floor(f);
    if (f - i > bayer(x, y)) i++;
    return ramp[Math.min(i, ramp.length - 1)];
  }
  // buffer de píxeles para generar fondos estáticos una sola vez (putImageData en la carga)
  const P32 = {};
  for (const k in PAL) {
    const h = PAL[k];
    const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    P32[k] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }
  function Buf(w, h) {
    const img = new ImageData(w, h);
    const d = new Uint32Array(img.data.buffer);
    return {
      w, h, img, d,
      set(x, y, k) { x |= 0; y |= 0; if (k && x >= 0 && y >= 0 && x < w && y < h) d[y * w + x] = P32[k]; },
      rect(x, y, rw, rh, k) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) this.set(x + i, y + j, k); },
      toCanvas() { const m = mk(w, h); m.ctx.putImageData(img, 0, 0); return m; },
    };
  }
  const font = () => OM.FONT;
  function txt(ctx, s, x, y, o) { if (OM.FONT) return OM.FONT.draw(ctx, s, x, y, o); return 0; }

  // =========================================================== PANELES 9-SLICE
  // Cada estilo se dibuja proceduralmente al tamaño pedido y se cachea (w,h,estilo).
  function cutCorners(g, w, h, r) { // esquinas redondeadas a píxel (transparente)
    const ctx = g.ctx;
    for (let i = 0; i < r; i++) {
      const n = r - i;
      ctx.clearRect(0, i, n, 1); ctx.clearRect(w - n, i, n, 1);
      ctx.clearRect(0, h - 1 - i, n, 1); ctx.clearRect(w - n, h - 1 - i, n, 1);
    }
  }
  function roundFrame(g, x, y, w, h, c, r) { // marco de 1px con esquina recortada r
    g.rect(x + r, y, w - 2 * r, 1, c); g.rect(x + r, y + h - 1, w - 2 * r, 1, c);
    g.rect(x, y + r, 1, h - 2 * r, c); g.rect(x + w - 1, y + r, 1, h - 2 * r, c);
    for (let i = 1; i < r; i++) { g.p(x + i, y + r - i, c); g.p(x + w - 1 - i, y + r - i, c); g.p(x + i, y + h - 1 - r + i, c); g.p(x + w - 1 - i, y + h - 1 - r + i, c); }
  }
  function fillTex(g, x, y, w, h, ramp, top, bottom, seed) { // relleno con degradado vertical tramado + motas
    for (let j = 0; j < h; j++) {
      const v = top + (bottom - top) * (j / Math.max(1, h - 1));
      for (let i = 0; i < w; i++) {
        let vv = v + (hash(i + seed, j) < 0.035 ? 0.18 : 0);

    const P = (i, j, c) => g.p(x + i * fx, y + j * fy, c);
    for (let i = 0; i < 6; i++) { P(i, 0, i < 5 ? A : B); P(0, i, i < 5 ? A : B); }
    for (let i = 1; i < 4; i++) { P(i, 1, B); P(1, i, B); }
    P(2, 2, C); P(3, 2, B); P(2, 3, B);
  }

  function buttonBody(g, w, h, st, state) {
    const r = st.r;
    const down = state === 'down';
    const hov = state === 'hover';
    const fy = down ? 2 : 0; // cara desplazada al pulsar
    const fh = h - 2;        // alto de la cara
    g.clear();

    if (!down) {
      g.rect(1, 2, w - 2, h - 2, '0'); g.rect(0, 3, w, h - 4, '0');

    }
    // cara
    const fx0 = 0, fy0 = fy;
    g.rect(fx0 + 1, fy0, w - 2, fh, '0'); g.rect(fx0, fy0 + 1, w, fh - 2, '0');
    const face = hov ? r[1] : r[2], light = hov ? r[0] : r[1], dark = r[3];
    g.rect(1, fy0 + 1, w - 2, fh - 2, face);

    }
  }

  function valueBox(ctx, x, y, w, h, value, kind, opts) {

  const BAR = {
    q: ['r', 'q', 'p'], c: ['d', 'c', 'b'], h: ['i', 'h', 'g'], m: ['n', 'm', 'l'], b: ['c', 'b', 'a'],
    v: ['h', 'v', 'b'], t: ['u', 't', 's'], '7': ['8', '7', '6'], r: ['8', 'r', 'q'], u: ['8', 'u', 't'],
  };
  function bar(ctx, x, y, w, h, frac, color) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    if (w < 4 || h < 3) return;
    frac = clamp(+frac || 0, 0, 1);
    const tr = cached('bar|' + w + '|' + h, w, h, (g) => {
      g.clear();
      roundFrame(g, 0, 0, w, h, '0', 1);
      g.rect(1, 1, w - 2, h - 2, '1');
      g.rect(1, 1, w - 2, 1, '0');
      g.rect(1, h - 2, w - 2, 1, '2');
      for (let i = 6; i < w - 2; i += 6) g.rect(i, 2, 1, h - 4, '2');
    });
    ctx.drawImage(tr.c, x, y);
    const fw = Math.round((w - 2) * frac);
    if (fw <= 0) return;
    const fill = (fx, fwid, ramp) => {
      ctx.fillStyle = PAL[ramp[1]]; ctx.fillRect(fx, y + 1, fwid, h - 2);
      ctx.fillStyle = PAL[ramp[0]]; ctx.fillRect(fx, y + 1, fwid, 1);
      ctx.fillStyle = PAL[ramp[2]]; ctx.fillRect(fx, y + h - 2, fwid, 1);
    };
    if (color === 'power') { // verde → oro → naranja → rojo por tramos
      const seg = [['n', 'm', 'l'], ['i', 'h', 'g'], ['h', 'v', 'b'], ['d', 'c', 'b']];
      for (let i = 0; i < fw; i++) { const s = seg[Math.min(3, Math.floor((i / (w - 2)) * 4))]; fill(x + 1 + i, 1, s); }
    } else fill(x + 1, fw, BAR[color] || BAR.c);

  // =================================================== ELEMENTOS COMPARTIDOS DE ESCENA
  // halo de luz tramado (pre-renderizado) para velas/lámparas; se pinta con globalAlpha
  const halos = {};
  function halo(r, col) {
    const key = r + col;
    if (halos[key]) return halos[key];
    const m = mk(r * 2 + 1, r * 2 + 1);
    m.ctx.fillStyle = PAL[col];
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      const d = Math.sqrt(i * i + j * j) / r;
      if (d > 1) continue;
      const v = (1 - d) * (1 - d);
      // tres niveles de densidad tramada
      if (v > bayer(i + r, j + r) * 0.9) m.ctx.fillRect(i + r, j + r, 1, 1);
    }
    halos[key] = m.c;
    return m.c;
  }
  function drawHalo(ctx, x, y, r, col, a) {
    const c = halo(r, col);
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    ctx.drawImage(c, (x | 0) - r, (y | 0) - r);
    ctx.restore();
  }
  // llama animada (5-9 px de alto) — se dibuja cada frame
  function flame(ctx, x, y, t, seed, big) {
    const f = Math.sin(t * 13 + seed * 7) * 0.5 + Math.sin(t * 23 + seed * 3) * 0.5;
    const h = (big ? 8 : 5) + Math.round(f * 1.5);
    const sway = Math.round(Math.sin(t * 5 + seed) * (big ? 1.2 : 0.7));
    x |= 0; y |= 0;
    const P = (px, py, c) => { ctx.fillStyle = PAL[c]; ctx.fillRect(px, py, 1, 1); };
    const R = (px, py, w, hh, c) => { ctx.fillStyle = PAL[c]; ctx.fillRect(px, py, w, hh); };
    if (big) {
      R(x - 2, y - 3, 5, 3, 'v'); R(x - 1, y - h + 2, 3, h - 2, 'v');
      R(x - 1, y - 4, 3, 3, 'h'); R(x, y - h + 3 + 0, 1, h - 4, 'i');
      P(x + sway, y - h, 'h'); P(x + sway, y - h + 1, 'v');
      P(x, y - 2, '8');
      R(x - 1, y - 1, 3, 1, 'b');
    } else {
      R(x - 1, y - 2, 3, 2, 'v'); R(x, y - h + 1, 1, h - 1, 'h');
      P(x + sway, y - h, 'v'); P(x, y - 2, 'i'); P(x, y - 1, 'b');
    }
  }
  // velas estáticas (cuerpo) en un buffer/canvas
  function candleBody(g, x, y, h, w) {
    w = w || 3;
    g.rect(x - 1, y, w + 2, h + 1, '0');
    g.rect(x, y, w, h, '7'); g.rect(x + w - 1, y, 1, h, '6'); g.rect(x, y, 1, h, '8');
    g.p(x + 1, y + 1, '8'); g.p(x + w - 1, y + 2 + (h > 6 ? 2 : 0), '7'); // goterón de cera
    g.p(x + (w >> 1), y - 1, '1'); // mecha
  }
  // cadenas colgantes
  function chain(ctx, x, y0, len, sway) {
    const R = (a, b, w, h, c) => { ctx.fillStyle = PAL[c]; ctx.fillRect(a, b, w, h); };
    for (let i = 0, n = 0; i < len; i += 4, n++) {
      const k = i / Math.max(1, len);
      const xx = Math.round(x + Math.sin(k * 1.6) * sway * k), y = y0 + i;
      if (n & 1) { // eslabón de frente (anillo)
        R(xx - 2, y - 1, 5, 7, '0');
        R(xx - 1, y, 1, 5, '6'); R(xx + 1, y, 1, 5, '4'); R(xx, y, 1, 1, '5'); R(xx, y + 4, 1, 1, '3');
      } else { // eslabón de canto
        R(xx - 1, y - 1, 3, 7, '0'); R(xx, y, 1, 5, '5'); R(xx, y, 1, 1, '7');
      }
    }
  }
  // niebla: textura tileable horizontal con tramado
  const fogC = {};
  function fogTex(col, h, seed) {
    const key = col + h + seed;
    if (fogC[key]) return fogC[key];
    const w = 320;
    const m = mk(w, h);
    m.ctx.fillStyle = PAL[col];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const a = x / w * Math.PI * 2;
      let v = 0.5 + 0.25 * Math.sin(a * 2 + seed) + 0.17 * Math.sin(a * 5 + seed * 2 + y * 0.05) + 0.1 * Math.sin(a * 9 + y * 0.12 + seed);
      const vy = Math.sin((y / h) * Math.PI); // se desvanece arriba y abajo
      v = v * vy * vy;
      if (v > bayer(x, y) * 0.95 + 0.12) m.ctx.fillRect(x, y, 1, 1);
    }
    fogC[key] = m.c;
    return m.c;
  }
  function drawFog(ctx, y, h, col, alpha, speed, t, seed) {
    const c = fogTex(col, h, seed);
    const off = Math.floor(((t * speed) % 320 + 320) % 320);
    ctx.save(); ctx.globalAlpha = alpha;
    for (let x = -off; x < W; x += 320) ctx.drawImage(c, x, y | 0);
    ctx.restore();
  }
  // campo de partículas deterministas por tiempo (sin estado)
  function field(ctx, t, n, seed, fn) {
    for (let i = 0; i < n; i++) fn(hash(i, seed), hash(seed, i * 1.7), hash(i * 2.3, seed + 5), i);
  }
  function embers(ctx, t, n, seed, cols, y0, y1, speed) {
    field(ctx, t, n, seed, (a, b, c, i) => {
      const life = (y1 - y0) / (speed * (0.6 + c));
      const ph = ((t / life + b) % 1);
      const y = Math.round(y1 - ph * (y1 - y0));
      const x = Math.round(a * W + Math.sin(t * (1 + c) + i) * 6 + ph * 12 * (c - 0.5));
      const col = ph < 0.4 ? cols[0] : ph < 0.75 ? cols[1] : cols[2];
      ctx.fillStyle = PAL[col];
      ctx.fillRect(x, y, 1, 1);
      if (c > 0.75 && ph < 0.5) ctx.fillRect(x, y + 1, 1, 1);
    });
  }
  function dust(ctx, t, n, seed, col, x0, y0, w, h) {
    field(ctx, t, n, seed, (a, b, c, i) => {
      const x = Math.round(x0 + ((a * w + t * (3 + c * 4) + Math.sin(t * 0.7 + i) * 8) % w + w) % w);
      const y = Math.round(y0 + ((b * h + Math.sin(t * 0.5 + i * 1.3) * 10 + t * (1 + c * 2)) % h + h) % h);
      if (Math.sin(t * 2 + i) > -0.3) { ctx.fillStyle = PAL[col]; ctx.fillRect(x, y, 1, 1); }
    });
  }

  // ------------------------------------------------------------ ladrillo iluminado
  // light(x,y) -> {v: brillo 0..1, warm: 0..1, red: 0..1}
  function bricks(B, x0, y0, w, h, bw, bh, light, ramps, seed) {
    for (let y = y0; y < y0 + h; y++) {
      const row = Math.floor((y - y0) / bh);
      const ly = (y - y0) % bh;
      const off = (row & 1) ? bw >> 1 : 0;
      for (let x = x0; x < x0 + w; x++) {
        const col = Math.floor((x - x0 + off) / bw);
        const lx = (x - x0 + off) % bw;
        let tone;
        if (ly === bh - 1 || lx === bw - 1) tone = 0.12; // mortero
        else {
          tone = 0.55 + (hash(col + seed, row) - 0.5) * 0.22;
          if (ly === 0) tone += 0.16; else if (ly === bh - 2) tone -= 0.12;
          if (lx === 0) tone += 0.06;
          if (hash(x * 1.3 + seed, y * 0.7) < 0.06) tone -= 0.12; // poros
          if (hash(col * 3, row * 5 + seed) < 0.08 && lx > 2 && lx < 6) tone -= 0.25; // grieta
        }
        const L = light(x, y);
        const v = tone * L.v;
        B.set(x, y, pick(chooseRamp(ramps, L, x, y), v, x, y));
      }
    }
  }
  function chooseRamp(ramps, L, x, y) {
    const u = bayer(x + 1, y + 2);
    const wr = L.red || 0, ww = L.warm || 0;
    const s = wr + ww + 0.45;
    if (u < wr / s) return ramps.red || ramps.cold;
    if (u < (wr + ww) / s) return ramps.warm || ramps.cold;
    return ramps.cold;
  }
  const RAMP_COLD = ['0', '1', '2', '3', '4', '5'];
  const RAMP_WARM = ['0', '1', '9', 'e', 'f', 'g', 'h'];
  const RAMP_RED = ['0', '1', '9', 'a', 'b', 'c'];
  const RAMP_WOOD = ['0', '1', 'e', 'f', 'g'];

  function lightAt(lights, x, y, amb) {
    let v = amb, warm = 0, red = 0;
    for (let i = 0; i < lights.length; i++) {
      const L = lights[i];
      const dx = (x - L.x) / (L.sx || 1), dy = (y - L.y) / (L.sy || 1);
      const d = Math.sqrt(dx * dx + dy * dy) / L.r;
      if (d >= 1) continue;
      const k = (1 - d) * (1 - d) * L.s;
      v += k;
      if (L.kind === 'warm') warm += k; else if (L.kind === 'red') red += k;
    }
    return { v: Math.min(1.4, v), warm: Math.min(1, warm * 1.4), red: Math.min(1, red * 1.4) };
  }

  // arco gótico (apuntado) — test de punto dentro
  function inArch(x, y, ax, ay, aw, ah) {
    const half = aw / 2;
    const cx = ax + half;
    if (x < ax || x >= ax + aw || y >= ay + ah) return false;
    const springY = ay + half * 1.0;
    if (y >= springY) return true;
    // dos arcos de radio aw centrados en los lados opuestos
    const r = aw * 0.85;
    const dy = y - springY;
    // arco apuntado: cada mitad es un arco centrado hacia el lado contrario
    const dl = Math.hypot(x - (ax + r), dy), dr = Math.hypot(x - (ax + aw - r), dy);
    return x < cx ? dl <= r : dr <= r;
  }

  // ================================================================ FONDOS
  // mesa de billar en perspectiva vista desde la barra: (cx, yTop, semiancho lejano, alto del paño, ensanche)
  function pokerTable(g, cx, y0, hw, fh, spread) {
    const ctx = g.ctx;
    const P = (x, y, c) => { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, 1, 1); };
    const rail = 6;
    // patas y faldón
    const yb = y0 + fh;
    const fx0 = cx - hw - spread - rail, fx1 = cx + hw + spread + rail;
    g.rect(fx0 + 14, yb + rail + 14, 14, 30, '0'); g.rect(fx1 - 28, yb + rail + 14, 14, 30, '0');
    g.rect(fx0 + 16, yb + rail + 14, 4, 30, 'e'); g.rect(fx1 - 26, yb + rail + 14, 4, 30, 'e');
    g.rect(fx0 - 1, yb + rail - 1, fx1 - fx0 + 2, 18, '0');
    for (let y = yb + rail; y < yb + rail + 16; y++) for (let x = fx0; x < fx1; x++) {
      const k = (y - yb - rail) / 16;
      let v = 0.55 - k * 0.35 + (hash(x >> 2, 7) - 0.5) * 0.08;
      if (y === yb + rail) v = 0.9;
      const px = (x - fx0) % 64;
      if (px < 2 || y === yb + rail + 15) v = 0.1;
      P(x, y, pick(['0', 'e', 'f', 'g'], v, x, y));
    }
    // emblema: calavera de latón en el faldón
    g.rows(cx - 4, yb + rail + 4, ['.ggggg.', 'ghhhhhg', 'h0hh0hg', 'ghhhhhf', '.g0g0f.', '..fff..'], null);
    // banda (madera) alrededor del paño
    for (let y = y0 - rail; y < yb + rail; y++) {
      const k = clamp((y - y0) / fh, -0.3, 1.3);
      const xl = Math.round(cx - hw - spread * k) - rail, xr = Math.round(cx + hw + spread * k) + rail;
      for (let x = xl; x < xr; x++) {
        const inFelt = y >= y0 && y < yb && x >= xl + rail && x < xr - rail;
        if (inFelt) {
          // paño: claro al centro (lámpara), oscuro a los lados, tramado sutil
          const dx = (x - cx) / (hw + spread), dy = (y - y0 - fh * 0.45) / fh;
          const v = 0.62 - dx * dx * 0.7 - dy * dy * 0.5 + (hash(x, y) < 0.05 ? -0.12 : 0);
          P(x, y, pick(['j', 'k', 'l'], v, x, y));
        } else {
          let v = 0.55;
          if (y === y0 - rail) v = 0.95; else if (y === y0 - rail + 1) v = 0.75;
          if (y >= yb) v = 0.65 - (y - yb) / rail * 0.3;
          if (y === yb + rail - 1) v = 0.1;
          if (x === xl || x === xr - 1) v = 0.05;
          // canto interior (cojín) más oscuro
          if (y >= y0 - 2 && y < y0 && x > xl + rail - 2 && x < xr - rail + 1) v = 0.2;
          if (y < yb && y >= y0 && (x === xl + rail - 1 || x === xr - rail)) v = 0.2;
          P(x, y, pick(['0', 'e', 'f', 'g', 'h'], v, x, y));
        }
      }
    }
    // diamantes de banda
    for (let i = 1; i < 8; i++) { if (i === 4) continue; const x = Math.round(cx - hw + (2 * hw) * i / 8); P(x, y0 - rail + 3, 'i'); }
    // troneras
    const pocket = (x, y) => { g.rect(x - 4, y - 2, 9, 5, '0'); g.rect(x - 3, y - 3, 7, 7, '0'); g.rect(x - 2, y - 2, 5, 1, '1'); };
    pocket(cx - hw - 1, y0 - 1); pocket(cx + hw + 1, y0 - 1); pocket(cx, y0 - 3);
    pocket(cx - hw - spread - 1, yb + 1); pocket(cx + hw + spread + 1, yb + 1); pocket(cx, yb + 3);
    // bolas sobre el paño
    const ball = (x, y, c, stripe) => {
      g.rect(x - 2, y + 3, 6, 1, 'j');
      g.rect(x - 2, y - 3, 5, 7, '0'); g.rect(x - 3, y - 2, 7, 5, '0');
      g.rect(x - 2, y - 2, 5, 5, c); g.rect(x - 1, y - 3, 3, 1, c); g.rect(x - 1, y + 3, 3, 1, c);
      if (stripe) { g.rect(x - 2, y - 2, 5, 1, '7'); g.rect(x - 2, y + 2, 5, 1, '7'); }
      g.p(x - 1, y - 1, c === '1' ? '5' : '8'); g.rect(x + 1, y + 1, 2, 2, c === '7' ? '6' : c === '1' ? '0' : '9');
      if (c === '1') { g.p(x, y, '7'); g.p(x + 1, y, '7'); }
    };
    ball(cx - 60, y0 + 14, '7'); ball(cx + 30, y0 + 10, '1'); ball(cx + 44, y0 + 20, 'c'); ball(cx + 52, y0 + 9, 'h', true);
    ball(cx + 80, y0 + 24, 'q'); ball(cx - 110, y0 + 26, 'm', true);
    // taco cruzado sobre la mesa
    g.line(cx - 160, y0 + 34, cx - 66, y0 + 15, '0'); g.line(cx - 160, y0 + 33, cx - 66, y0 + 14, 'f'); g.line(cx - 160, y0 + 32, cx - 100, y0 + 20, 'e');
    g.line(cx - 72, y0 + 16, cx - 66, y0 + 14, '7'); g.p(cx - 65, y0 + 14, 'q');
  }
  // pasada de iluminación: oscurece por pasos de paleta según light(x,y)∈[0,1] (solo en la carga)
  const SHADE = { '0': '0', '1': '0', '2': '1', '3': '2', '4': '3', '5': '4', '6': '5', '7': '6', '8': '7', '9': '1', a: '9', b: 'a', c: 'b', d: 'c', e: '1', f: 'e', g: 'f', h: 'g', i: 'h', j: '0', k: 'j', l: 'k', m: 'l', n: 'm', o: '1', p: 'o', q: 'p', r: 'q', s: '2', t: 's', u: 't', v: 'g' };
  function shadePass(m, light, steps) {
    steps = steps || 3;
    const w = m.c.width, h = m.c.height;
    const img = m.ctx.getImageData(0, 0, w, h);
    const d = new Uint32Array(img.data.buffer);
    const rev = {};
    for (const k in P32) rev[P32[k]] = k;
    const S32 = {};
    for (const k in P32) S32[P32[k]] = P32[SHADE[k]];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      let px = d[i];
      if ((px >>> 24) === 0 || rev[px] === undefined) continue;
      const dark = clamp(1 - light(x, y), 0, 1) * steps;
      let n = Math.floor(dark);
      if (dark - n > bayer(x, y)) n++;
      for (let k = 0; k < n; k++) px = S32[px];
      d[i] = px;
    }
    m.ctx.putImageData(img, 0, 0);
  }

  const SCN = {}; // escena -> {base: canvas, draw(ctx,t)}

  // ---------- TÍTULO: sala gótica del bar con rosetón infernal, telones y velas
  function buildTitle() {
    const B = Buf(W, H);
    const lights = [
      { x: 320, y: 96, r: 230, s: 0.75, kind: 'red', sy: 0.8 },
      { x: 128, y: 168, r: 110, s: 0.75, kind: 'warm' },
      { x: 512, y: 168, r: 110, s: 0.75, kind: 'warm' },
      { x: 320, y: 360, r: 260, s: 0.25, kind: 'red', sy: 0.5 },
    ];
    const L = (x, y) => { const l = lightAt(lights, x, y, 0.32); l.v *= 0.65 + 0.35 * Math.min(1, y / 120); return l; };
    bricks(B, 0, 0, W, 262, 20, 10, L, { cold: RAMP_COLD, warm: RAMP_WARM, red: RAMP_RED }, 3);
    // zócalo de madera
    for (let y = 262; y < 276; y++) for (let x = 0; x < W; x++) {
      const l = L(x, y);
      let tone = y === 262 ? 0.9 : y === 263 ? 0.7 : y === 275 ? 0.15 : 0.45 + (hash(x >> 3, 1) - 0.5) * 0.15;
      if (x % 40 === 0) tone = 0.2;
      B.set(x, y, pick(RAMP_WOOD, tone * l.v, x, y));
    }
    // suelo de baldosas en perspectiva (ajedrez)
    for (let y = 276; y < H; y++) {
      const z = 1 / ((y - 262) / 98);
      for (let x = 0; x < W; x++) {
        const u = (x - 320) * z / 34, v = z * 3.2;
        const chk = ((Math.floor(u) + Math.floor(v)) & 1);
        const l = L(x, y);
        let tone = chk ? 0.5 : 0.22;
        const fu = u - Math.floor(u), fv = v - Math.floor(v);
        if (fu < 0.04 * z || fv < 0.05) tone = 0.08;
        const fade = Math.min(1, (y - 276) / 60 + 0.25);
        B.set(x, y, pick(chooseRamp({ cold: RAMP_COLD, red: RAMP_RED, warm: RAMP_WARM }, l, x, y), tone * l.v * fade, x, y));
      }
    }
    // rosetón
    const cx = 320, cy = 96, R = 78;
    for (let y = cy - R - 6; y <= cy + R + 6; y++) for (let x = cx - R - 6; x <= cx + R + 6; x++) {
      const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy);
      if (d > R + 5) continue;
      const a = Math.atan2(dy, dx);
      if (d > R) { // marco de piedra exterior
        const tone = d > R + 4 ? 0.1 : 0.45 + (dy < 0 ? 0.25 : 0) - (d > R + 3 ? 0.2 : 0);
        B.set(x, y, pick(['0', '1', '2', '3', '4', '5', '6'], tone, x, y));
        continue;
      }
      // tracería: anillos y 12 radios
      const seg = 12;
      const as = ((a / (Math.PI * 2)) * seg + seg) % 1;
      const spokeW = 1.6 / Math.max(8, d) * seg / (Math.PI * 2);
      const onSpoke = d > 24 && (as < spokeW || as > 1 - spokeW);
      const onRing = Math.abs(d - 24) < 1.6 || Math.abs(d - 52) < 1.3 || Math.abs(d - R + 1) < 1.5;
      // pétalos (arcos lobulados) en el anillo exterior
      const lobe = Math.abs(d - (52 + 13 * Math.sin(as * Math.PI))) < 1.0 && d > 52;
      if (onSpoke || onRing || lobe) {
        const tone = (dy < 0 ? 0.55 : 0.35) + (onRing ? 0.1 : 0);
        B.set(x, y, pick(['0', '1', '2', '3', '4'], tone, x, y));
        continue;
      }
      // vidrio: rojo sangre / magenta alternando, más brillante al centro
      const pane = Math.floor(((a / (Math.PI * 2)) * seg + seg) % seg);
      const glow = 1 - d / R;
      let ramp;
      if (d < 24) ramp = ['9', 'a', 'b', 'c', 'd', 'v'];
      else if (d < 52) ramp = pane & 1 ? ['1', '9', 'a', 'b', 'c'] : ['1', 's', 't', 'u'];
      else ramp = pane & 1 ? ['1', 's', 't'] : ['1', '9', 'a', 'b'];
      const flick = hash(pane * 7, Math.floor(d / 6)) * 0.18;
      B.set(x, y, pick(ramp, 0.1 + glow * 0.5 + flick * 0.6, x, y));
    }
    // ojo/pentáculo central del rosetón: un "8" ardiente
    const m = B.toCanvas();
    const g = m.g, ctx = m.ctx;
    // telones de terciopelo a los lados
    const curtain = (x0, w, flip) => {
      for (let x = 0; x < w; x++) {
        const fold = Math.sin(x / 7 * Math.PI) * 0.5 + 0.5;
        for (let y = 0; y < H; y++) {
          const gx = flip ? x0 + w - 1 - x : x0 + x;
          const edgeWave = Math.round(w - 6 - Math.max(0, (y - 150)) * 0.18 + Math.sin(y * 0.09) * 2);
          if (x > edgeWave) continue;
          let v = 0.18 + fold * 0.55 - (y / H) * 0.15;
          if (x === edgeWave) v = 0.05;
          const col = pick(['0', '9', 'a', 'b', 'c'], v, gx, y);
          ctx.fillStyle = PAL[col]; ctx.fillRect(gx, y, 1, 1);
        }
      }
      // cenefa con flecos dorados
      for (let x = 0; x < w + 30; x++) {
        const gx = flip ? x0 + w - 1 - x : x0 + x;
        const hh = 14 + Math.round(Math.sin((x / (w + 30)) * Math.PI) * 10);
        for (let y = 0; y < hh; y++) { const v = 0.6 - y / hh * 0.35 + ((x % 9) < 4 ? 0.1 : 0); ctx.fillStyle = PAL[pick(['9', 'a', 'b', 'c'], v, gx, y)]; ctx.fillRect(gx, y, 1, 1); }
        ctx.fillStyle = PAL['0']; ctx.fillRect(gx, hh, 1, 1);
        if (x % 3 === 0) { ctx.fillStyle = PAL['h']; ctx.fillRect(gx, hh, 1, 3); ctx.fillStyle = PAL['g']; ctx.fillRect(gx, hh + 3, 1, 1); }
      }
    };
    curtain(0, 54, false);
    curtain(W - 54, 54, true);
    // candelabros de pared (latón) con 3 velas
    const sconce = (x, y) => {
      g.rect(x - 14, y + 6, 29, 3, '0'); g.rect(x - 13, y + 6, 27, 1, 'h'); g.rect(x - 13, y + 7, 27, 1, 'g');
      g.rect(x - 1, y + 8, 3, 14, '0'); g.rect(x, y + 8, 1, 13, 'g');
      g.rect(x - 4, y + 20, 9, 4, '0'); g.rect(x - 3, y + 20, 7, 2, 'g'); g.p(x - 2, y + 20, 'i');
      [-11, 0, 11].forEach((dx, i) => {
        g.rect(x + dx - 3, y + 4, 7, 3, '0'); g.rect(x + dx - 2, y + 4, 5, 1, 'h'); g.rect(x + dx - 2, y + 5, 5, 1, 'f');
        candleBody(g, x + dx - 1, y - (i === 1 ? 10 : 6), i === 1 ? 14 : 10);
      });
    };
    sconce(128, 160); sconce(512, 160);
    // mesa de billar en primer plano (perspectiva)
    pokerTable(g, 320, 300, 250, 40, 34);
    return m.c;
  }

  // ---------- TIENDA: estanterías del diablo, lámpara colgante, mostrador
  function buildShop() {
    const B = Buf(W, H);
    const lights = [
      { x: 320, y: 70, r: 300, s: 0.9, kind: 'warm', sy: 0.8 },
      { x: 560, y: 150, r: 90, s: 0.3, kind: 'red' },
    ];
    const L = (x, y) => ({ v: 1, warm: 0.6, red: 0 });
    // tablones verticales
    for (let y = 0; y < 262; y++) for (let x = 0; x < W; x++) {
      const pl = Math.floor(x / 22), lx = x % 22;
      let tone = 0.5 + (hash(pl, 3) - 0.5) * 0.2;
      tone += Math.sin((y + hash(pl, 9) * 80) * 0.11 + Math.sin(x * 0.4) * 0.6) * 0.06; // veta
      if (lx === 0) tone = 0.1; else if (lx === 1) tone += 0.15; else if (lx === 21) tone -= 0.15;
      if ((y + pl * 37) % 90 === 0 && lx > 2) tone = 0.15; // junta horizontal
      if (hash(x, y) < 0.02) tone -= 0.15;
      const l = L(x, y);
      B.set(x, y, pick(['1', 'e', 'f', 'g'], tone * 0.85, x, y));
    }
    // mostrador
    for (let y = 262; y < H; y++) for (let x = 0; x < W; x++) {
      let tone;
      if (y < 266) tone = y === 262 ? 0.95 : 0.7;
      else if (y < 270) tone = 0.25;
      else {
        const px = x % 80, py = (y - 270);
        tone = 0.45;
        if (px < 3 || px > 76 || py < 3) tone = 0.25;
        else if (px < 5 || py < 5) tone = 0.62;
        tone += Math.sin(x * 0.3 + y * 0.05) * 0.05;
      }
      const l = L(x, y);
      B.set(x, y, pick(['0', 'e', 'f', 'g', 'h'], tone, x, y));
    }
    const m = B.toCanvas();
    const g = m.g;
    // latón del mostrador
    g.rect(0, 266, W, 1, 'g'); g.rect(0, 267, W, 1, 'e');
    for (let x = 40; x < W; x += 80) { g.rect(x - 1, 280, 3, 3, '0'); g.p(x, 281, 'h'); }
    // puerta oscura (donde acecha el tendero)
    const dx = 520, dy = 96, dw = 70, dh = 166;
    for (let y = dy - 6; y < dy + dh; y++) for (let x = dx - 6; x < dx + dw + 6; x++) {
      if (inArch(x, y, dx, dy, dw, dh)) { m.ctx.fillStyle = PAL[pick(['0', '0', '1', '2'], 0.35 - (y - dy) / dh * 0.2, x, y)]; m.ctx.fillRect(x, y, 1, 1); }
      else if (inArch(x, y, dx - 5, dy - 5, dw + 10, dh + 5)) { m.ctx.fillStyle = PAL[pick(['0', 'e', 'f', 'g'], 0.4 + (x < dx ? 0.2 : 0), x, y)]; m.ctx.fillRect(x, y, 1, 1); }
    }
    // estanterías
    const shelves = [64, 130, 196];
    const glass = [['k', 'l', 'm', 'n'], ['s', 't', 'u', '8'], ['o', 'p', 'q', 'r'], ['9', 'a', 'b', 'c'], ['e', 'f', 'v', 'h']];
    let seed = 1;
    shelves.forEach((sy, si) => {
      const x0 = 30, x1 = 500;
      g.rect(x0, sy, x1 - x0, 5, '0'); g.rect(x0, sy, x1 - x0, 1, 'g'); g.rect(x0, sy + 1, x1 - x0, 2, 'f'); g.rect(x0, sy + 3, x1 - x0, 1, 'e');
      // ménsulas
      for (let bx = x0 + 10; bx < x1; bx += 90) { g.rect(bx, sy + 5, 3, 6, '0'); g.rect(bx, sy + 5, 1, 5, 'e'); }
      // objetos
      let x = x0 + 6;
      while (x < x1 - 16) {
        const r = hash(x * 0.37, si * 13 + seed);
        const kind = r < 0.5 ? 'bottle' : r < 0.65 ? 'jar' : r < 0.8 ? 'skull' : r < 0.9 ? 'books' : 'candle';
        if (kind === 'bottle') {
          const gl = glass[Math.floor(hash(x, si) * glass.length)];
          const bh = 14 + Math.floor(hash(x, si + 4) * 12), bw = 7 + Math.floor(hash(si, x) * 4);
          const top = sy - bh;
          g.rect(x - 1, top + 5, bw + 2, bh - 4, '0');
          g.rect(x + (bw >> 1) - 2, top - 1, 5, 7, '0');
          g.rect(x, top + 6, bw, bh - 6, gl[1]);
          g.rect(x, top + 6 + Math.floor((bh - 6) * 0.35), bw, Math.ceil((bh - 6) * 0.65), gl[2]);
          g.rect(x + (bw >> 1) - 1, top, 3, 6, gl[1]);
          g.rect(x + 1, top + 7, 1, bh - 9, gl[3]);
          g.p(x + (bw >> 1) - 1, top, 'e'); g.p(x + (bw >> 1), top, 'f'); g.p(x + (bw >> 1) + 1, top, 'e');
          if (hash(x, 7) < 0.5) { g.rect(x + 1, top + 10, bw - 2, 4, '7'); g.rect(x + 2, top + 11, bw - 4, 1, '6'); }
          x += bw + 3 + Math.floor(hash(x, 2) * 4);
        } else if (kind === 'jar') {
          const jw = 12, jh = 13, top = sy - jh;
          g.rect(x - 1, top, jw + 2, jh, '0');
          g.rect(x, top + 3, jw, jh - 3, 'k'); g.rect(x, top + 3, jw, 3, 'l'); g.rect(x + 1, top + 4, 1, jh - 6, 'n');
          g.rect(x + 1, top, jw - 2, 3, 'g'); g.rect(x + 1, top, jw - 2, 1, 'h');
          // ojo flotando
          g.rect(x + 4, top + 6, 4, 4, '7'); g.rect(x + 5, top + 7, 2, 2, 'c'); g.p(x + 6, top + 8, '0');
          x += jw + 4;
        } else if (kind === 'skull') {
          const top = sy - 9;
          g.rows(x, top, [
            '.00000.',
            '0777770',
            '7787877',
            '7007007',
            '7777777',
            '0770770',
            '.07870.',
            '.06060.',
            '..000..',
          ], { '0': '0' });
          x += 10;
        } else if (kind === 'books') {
          const cols = ['a', 'p', 'l', 's', 'f'];
          for (let b = 0; b < 4; b++) {
            const bh = 14 + Math.floor(hash(x + b, 3) * 6), c = cols[Math.floor(hash(b, x) * cols.length)];
            g.rect(x + b * 4, sy - bh, 4, bh, '0'); g.rect(x + b * 4 + 1, sy - bh + 1, 2, bh - 1, c); g.p(x + b * 4 + 1, sy - bh + 4, 'h'); g.p(x + b * 4 + 2, sy - bh + 4, 'h');
          }
          x += 20;
        } else {
          candleBody(g, x + 1, sy - 8, 8);
          SHOP_CANDLES.push([x + 2, sy - 9]);
          x += 9;
        }
        seed++;
      }
    });
    // monedas y calavera sobre el mostrador
    for (let i = 0; i < 6; i++) { const cx = 70 + i * 3, cy = 260 - i * 2; g.rect(cx - 1, cy, 9, 3, '0'); g.rect(cx, cy, 7, 1, 'i'); g.rect(cx, cy + 1, 7, 1, 'g'); }
    for (let i = 0; i < 4; i++) { const cx = 90, cy = 260 - i * 2; g.rect(cx - 1, cy, 9, 3, '0'); g.rect(cx, cy, 7, 1, 'i'); g.rect(cx, cy + 1, 7, 1, 'g'); }
    candleBody(g, 586, 238, 22, 5); SHOP_CANDLES.push([588, 237, 1]);
    candleBody(g, 600, 248, 12, 4); SHOP_CANDLES.push([601, 247, 1]);
    // iluminación: lámpara central cálida + velas; la puerta queda en tinieblas
    const lamps = [{ x: 320, y: 70, r: 380, s: 0.9, sy: 0.7 }, { x: 588, y: 236, r: 70, s: 0.5 }];
    SHOP_CANDLES.forEach(([x, y]) => lamps.push({ x, y: y - 3, r: 34, s: 0.35 }));
    shadePass(m, (x, y) => clamp(0.38 + lightAt(lamps, x, y, 0).v * 1.1 - (y > 262 ? 0.1 : 0), 0, 1), 3);
    return m.c;
  }
  const SHOP_CANDLES = [];
  function drawShop(ctx, t) {

  // ---------- MAPA: el embudo de los seis círculos con lava al fondo
  function buildMap() {
    const B = Buf(W, H);
    // suelo de roca alrededor del pozo (losas irregulares en perspectiva)
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const n1 = vnoise(x / 22, y / 9), n2 = vnoise(x / 7 + 40, y / 4);
      let v = 0.2 + n1 * 0.22 + n2 * 0.08;
      const cr = Math.abs(vnoise(x / 30 + 9, y / 12 + 3) - 0.5);
      if (cr < 0.018) v = 0.06; else if (cr < 0.03) v += 0.1; // grietas con canto
      v *= 0.55 + y / H * 0.6;
      B.set(x, y, pick(['0', '1', '2', '3'], v, x, y));
    }
    // embudo de los círculos: cada nivel es una elipse; se ve su pared trasera (media luna superior)
    // y su suelo; el siguiente nivel, más pequeño y hondo, se dibuja encima.
    const levels = 7;
    for (let i = 0; i < levels; i++) {
      const rx = 360 * Math.pow(0.77, i), ry = rx * 0.27, cy = 92 + i * 38 - (i * i) * 1.2;
      const wallH = Math.max(6, 30 * Math.pow(0.8, i));
      const deep = i / (levels - 1);
      const x0 = Math.max(0, Math.floor(320 - rx - 1)), x1 = Math.min(W, Math.ceil(320 + rx + 1));
      const y0 = Math.max(0, Math.floor(cy - ry - 1)), y1 = Math.min(H, Math.ceil(cy + ry + wallH + 1));
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const nx = (x - 320) / rx;
        const jag = (hash(x >> 1, i * 7) - 0.5) * 2.4;
        const inTop = nx * nx + ((y - cy) / ry) ** 2 <= 1;                 // elipse del borde
        const inFloor = nx * nx + ((y - cy - wallH) / ry) ** 2 <= 1;      // suelo, más abajo
        if (!inTop) continue;
        if (i === levels - 1) { // fondo: lago de lava
          const d = Math.sqrt(nx * nx + ((y - cy - wallH * 0.5) / (ry + wallH * 0.5)) ** 2);
          B.set(x, y, pick(['a', 'b', 'v', 'h', 'i', '8'], 1 - d * 0.9 + (hash(x >> 1, y) - 0.5) * 0.1, x, y));
          continue;
        }
        if (inFloor && y > cy + jag) {
          // suelo del círculo: piedra oscura, labio frontal iluminado por la lava de abajo
          const ey = (y - cy - wallH) / ry;
          const rim = 1 - (nx * nx + ey * ey);
          let v = 0.32 + (hash(x >> 1, y >> 1) - 0.5) * 0.12 + deep * 0.08;
          const ty = (y - cy) / ry, lip = 1 - (nx * nx + ty * ty); // canto del borde frontal del pozo
          if (lip < 0.05 && ty > 0) { B.set(x, y, pick(['3', '4', '5', '6'], 0.35 + (1 - Math.abs(nx)) * 0.5, x, y)); continue; }
          void rim;
          B.set(x, y, pick(['0', '1', '2', '3', '9'], v, x, y));
        } else {
          // pared trasera: estratos verticales, más cálida hacia abajo (luz de lava)
          const k = clamp((y - (cy - ry * Math.sqrt(Math.max(0, 1 - nx * nx)))) / (wallH + 1), 0, 1);
          let v = 0.18 + k * 0.5 + (hash(x >> 1, i) - 0.5) * 0.18 + (1 - Math.abs(nx)) * 0.15;
          if ((x + i * 3) % 9 === 0) v -= 0.06;
          B.set(x, y, pick(['0', '1', '2', '9', 'a', 'b'], v * (0.75 + deep * 0.4), x, y));
          if (k < 0.08) B.set(x, y, pick(['3', '4', '5'], 0.3 + (1 - Math.abs(nx)) * 0.5, x, y)); // canto
        }
      }
    }
    // paredes rocosas laterales con estalactitas
    for (let x = 0; x < W; x++) {
      const side = Math.min(x, W - 1 - x);
      const edge = 70 - side * 0.9 + Math.sin(x * 0.11) * 8 + Math.sin(x * 0.37) * 4;
      for (let y = 0; y < H; y++) {
        const wallX = 40 + Math.sin(y * 0.05) * 10 + Math.sin(y * 0.17) * 5 + y * 0.12;
        if (side < wallX) {
          const v = 0.15 + (side / wallX) * 0.3 + (hash(x >> 2, y >> 2) - 0.5) * 0.15 + (y / H) * 0.15;
          B.set(x, y, pick(['0', '1', '2', '9', 'a'], v, x, y));
        }
      }
      // estalactitas arriba
      const st = Math.max(0, edge * 0.4 + (hash(x >> 2, 1) < 0.3 ? hash(x >> 2, 4) * 26 : 0));
      for (let y = 0; y < st; y++) B.set(x, y, pick(['0', '1', '2'], 0.4 - y / Math.max(1, st) * 0.3, x, y));
    }
    return B.toCanvas().c;
  }
  function drawMap(ctx, t) {
    ctx.drawImage(SCN.map.base, 0, 0);
    const p = 0.5 + 0.5 * Math.sin(t * 1.7);
    drawHalo(ctx, 320, 282, 110, 'b', 0.07 + p * 0.05);
    drawHalo(ctx, 320, 282, 36, 'h', 0.10 + p * 0.08);
    drawFog(ctx, 120, 60, '9', 0.22, 7, t, 4);
    drawFog(ctx, 210, 70, 'a', 0.16, -9, t, 5);
    embers(ctx, t, 60, 11, ['i', 'v', 'b'], 0, 290, 30);
    // ceniza que cae
    field(ctx, t, 40, 21, (a, b, c, i) => {
      const y = Math.round(((b * H + t * (8 + c * 10)) % H));
      const x = Math.round(a * W + Math.sin(t + i) * 5);
      ctx.fillStyle = PAL[c > 0.5 ? '5' : '4']; ctx.fillRect(x, y, 1, 1);
    });
  }

  // ---------- GAME OVER: bola 8 agrietada gigante, sangre que gotea
  const GO_DRIPS = [];
  function buildGameover() {
    const B = Buf(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x - 320) / 360, dy = (y - 170) / 220;
      const v = clamp(0.7 - Math.sqrt(dx * dx + dy * dy), 0, 1);
      B.set(x, y, pick(['0', '1', '9', 'a'], v * 0.8 + (hash(x >> 1, y >> 1) - 0.5) * 0.05, x, y));
    }
    // charco de sangre bajo la bola
    const px0 = 320, py0 = 292;
    for (let y = py0 - 30; y < py0 + 34; y++) for (let x = 60; x < 580; x++) {
      const ex = (x - px0) / (230 + Math.sin(x * 0.07) * 6), ey = (y - py0) / 26;
      const d = ex * ex + ey * ey;
      if (d > 1) continue;
      let v = 0.3 + (1 - d) * 0.25 + (ey < -0.2 ? 0.1 : 0);

      for (let i = 0; i <= 26; i++) {
        const t = i / 26;
        const x = cx + dir * (10 + t * 19 - t * t * 7);
        const y = cy - R + 11 - t * 27 + t * t * 5;
        const wd = (1 - t) * 5 + 0.4 + grow;
        for (let j = -Math.ceil(wd); j <= Math.ceil(wd); j++) for (let k = -Math.ceil(wd); k <= Math.ceil(wd); k++) if (j * j + k * k <= wd * wd) g.p(Math.round(x + k), Math.round(y + j), typeof col === 'function' ? col(j, k, t) : col);
      }
    };
    [-1, 1].forEach((dir) => hornShape(dir, '0', 1));
    [-1, 1].forEach((dir) => hornShape(dir, (j, k, t) => (t > 0.85 ? 'd' : j < -1 || k * dir < -1 ? 'c' : j > 1 ? 'a' : 'b'), 0));
    // esfera
    for (let y = -R - 1; y <= R + 1; y++) for (let x = -R - 1; x <= R + 1; x++) {
      const d2 = x * x + y * y;
      if (d2 > (R + 1) * (R + 1) + R) continue;
      if (d2 > R * R + R * 0.8) { g.p(cx + x, cy + y, '0'); continue; }
      const nx = x / R, ny = y / R, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const l = clamp(-nx * 0.45 - ny * 0.6 + nz * 0.65, 0, 1);
      let k = pick(['0', '1', '2', '3', '4'], l * 0.85, cx + x, cy + y);
      // luz roja maldita de rebote abajo-derecha
      const rim = nx * 0.5 + ny * 0.7;
      if (rim > 0.62 && nz < 0.6) k = pick(['1', '9', 'a', 'b'], (rim - 0.62) * 2.2, cx + x, cy + y);
      g.p(cx + x, cy + y, k);
    }
    // círculo blanco
    const wx = cx - 4, wy = cy - 5, wr = 15;
    for (let y = -wr - 1; y <= wr + 1; y++) for (let x = -wr - 1; x <= wr + 1; x++) {
      const d2 = x * x + y * y * 1.08;
      if (d2 > (wr + 1) * (wr + 1)) continue;
      if (d2 > wr * wr + 2) { g.p(wx + x, wy + y, '1'); continue; }
      const l = clamp(0.75 - (x + y) / (wr * 4), 0, 1);
      g.p(wx + x, wy + y, pick(['6', '7', '8'], l, wx + x, wy + y));
    }
    // "8" en display
    LOGO.ball = bc.c; LOGO.ballCx = cx; LOGO.ballCy = cy; LOGO.ballR = R;
    const m8 = scale2x(glyphMask('8', 0));
    bc.ctx.fillStyle = PAL['1'];
    for (let y = 0; y < m8.h; y++) for (let x = 0; x < m8.w; x++) if (m8.m[y * m8.w + x]) bc.ctx.fillRect(wx - (m8.w >> 1) + x, wy - (m8.h >> 1) + y, 1, 1);
    // brillo especular
    g.rect(cx - 19, cy - 17, 4, 2, '6'); g.rect(cx - 21, cy - 15, 2, 4, '5'); g.rect(cx - 17, cy - 19, 3, 1, '7'); g.p(cx - 16, cy - 18, '8');
    LOGO.ready = true;
    // métricas: línea 1 = bola + "CHO"; línea 2 = MALDITO
    LOGO.l1w = S - 6 + LOGO.w1.w - 2 * LOGO.w1.pad;
    LOGO.width = Math.max(LOGO.l1w, LOGO.w2.w - 2 * LOGO.w2.pad);
    LOGO.height = 142;
  }
  function logo(ctx, x, y, t) {
    buildLogo();
    t = t || 0;
    x |= 0; y |= 0;
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    const L = LOGO;
    const w1 = L.w1, w2 = L.w2;
    // --- línea 2: MALDITO (neón rojo con parpadeo de fallo)
    const l2x = x - ((w2.w - 2 * w2.pad) >> 1) - w2.pad;
    const l2y = y + 72 - w2.pad;
    // patrón de parpadeo de neón defectuoso
    const cyc = t % 5.2;
    const flick = (cyc > 3.0 && cyc < 3.08) || (cyc > 3.16 && cyc < 3.2) || (cyc > 4.6 && cyc < 4.64);
    const glowA = flick ? 0.05 : 0.32 + 0.08 * Math.sin(t * 3.1) + 0.04 * Math.sin(t * 17);
    ctx.save(); ctx.globalAlpha = glowA;
    ctx.drawImage(L.glow2, l2x + L.glowPad, l2y + L.glowPad);
    ctx.restore();
    ctx.drawImage(w2.c, l2x, l2y);
    if (flick) { ctx.save(); ctx.globalAlpha = 0.6; ctx.drawImage(L.shade2, l2x, l2y); ctx.restore(); }
    // goteo de sangre (gota que crece, se estira y cae)
    L.drips.forEach((d) => {
      const per = 2.6 + d.sp * 2;
      const ph = ((t * 0.9 + d.ph * per) % per) / per;
      const bx = l2x + d.x, by = l2y + d.y - 1;
      const grow = Math.min(1, ph / 0.62);
      const len = Math.round(1 + grow * d.len);
      const R = (xx, yy, ww, hh, c) => { ctx.fillStyle = PAL[c]; ctx.fillRect(xx, yy, ww, hh); };
      R(bx - 1, by, 4, len + 1, '0');
      R(bx, by, 2, len, 'b'); R(bx + 1, by, 1, len, 'a');
      if (ph < 0.62) { // cabeza de la gota colgando
        const hy = by + len - 1;
        R(bx - 1, hy - 1, 4, 5, '0'); R(bx - 2, hy, 6, 3, '0');
        R(bx - 1, hy, 4, 3, 'b'); R(bx, hy - 1, 2, 4, 'b');
        R(bx + 1, hy + 1, 2, 2, 'a'); R(bx - 1, hy, 1, 1, 'd');
      } else { // la gota cae y se aleja
        const f = (ph - 0.62) / 0.38;
        const yy = by + len + 2 + Math.round(f * f * 46);
        R(bx - 1, yy - 1, 4, 5, '0');
        R(bx, yy, 2, 3, 'b'); R(bx, yy, 1, 1, 'd'); R(bx + 1, yy + 2, 1, 1, 'a');
      }
    });
    // --- línea 1: [bola] CHO
    const S = L.ball.width;
    const l1x = x - (L.l1w >> 1);
    const bob = Math.round(Math.sin(t * 2.2) * 1.5);
    const l1y = y + 18;
    // aura maldita de la bola
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.7);
    const by0 = l1y + 22 - L.ballCy + bob;
    drawHalo(ctx, l1x + L.ballCx, by0 + L.ballCy, 40, 'b', 0.16 + pulse * 0.14);
    ctx.drawImage(w1.c, l1x + S - 6 - w1.pad, l1y - w1.pad);
    // barrido de brillo cada 4 s sobre OCHO
    const sw = (t % 4) / 1.1;
    if (sw < 1) {
      const bx = Math.round(-20 + sw * (w1.w + 40));
      ctx.save();
      ctx.beginPath();
      for (let k = 0; k < 6; k++) ctx.rect(l1x + S - 6 - w1.pad + bx + k * 0 - (k) , l1y - w1.pad + k * 8, 6, 8);
      ctx.rect(l1x + S - 6 - w1.pad + bx + 10, l1y - w1.pad, 2, w1.h);
      ctx.clip();
      ctx.globalAlpha = 0.85;
      ctx.drawImage(L.shine1, l1x + S - 6 - w1.pad, l1y - w1.pad);
      ctx.restore();
    }
    ctx.drawImage(L.ball, l1x, by0);
    // ojo: destello en la bola
    if ((t % 3.3) < 0.25) {
      const sx = l1x + L.ballCx + 13, sy = by0 + L.ballCy - 14;
      ctx.fillStyle = PAL['8']; ctx.fillRect(sx, sy - 2, 1, 5); ctx.fillRect(sx - 2, sy, 5, 1);
    }
    ctx.imageSmoothingEnabled = prev;
  }
  function logoSize() { buildLogo(); return { w: LOGO.width, h: LOGO.height }; }

  // ================================================================== INIT
  function init() {
    initIcons();
    OM.PX.sprite('ui_cursor_normal', CURSORS.normal.rows);
    OM.PX.sprite('ui_cursor_aim', CURSORS.aim.rows);
    OM.PX.sprite('ui_cursor_grab', CURSORS.grab.rows);
    if (OM.FONT) buildLogo();
  }
  OM.ART_INIT.push(init);

  return {
    panel, button, icon, valueBox, scoreRow, bar, drawBackground, logo, logoSize, cursor,
    drawHalo, flame, chain, drawFog,
    iconNames: () => Object.keys(ICONS),
    prebuild(scene) { const s = SCN[scene]; if (s && !s.base) s.base = s.build(); },
  };
})();

<script>/* src/art/fx.js */
// OCHO MALDITO — FX: partículas, textos flotantes, sacudida, flash, post-proceso CRT y transiciones.
// Ver docs/ART_CONTRACT.md. Sin getImageData por frame: todo es composición de canvases.
window.OM = window.OM || {};
OM.ART_INIT = OM.ART_INIT || [];

OM.FX = (function () {
  const PAL = OM.PAL;
  const W = () => OM.W || 640, H = () => OM.H || 360;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const MAXP = 1600;

  // ============================================================ PARTÍCULAS
  const parts = [];
  // rampa de color por defecto (de joven a vieja) para cada tipo
  const RAMPS = {
    spark: ['8', 'i', 'h', 'v', 'b'],
    dust: ['8', 'r', 'q', '6', '5'],
    blood: ['c', 'b', 'b', 'a', '9'],
    gold: ['i', 'h', 'g'],
    smoke: ['5', '4', '3', '2'],
    ember: ['i', 'h', 'v', 'd', 'b', 'a'],
    shard: ['8', 'r', '7', 'q', '6'],
    pocket: ['8', 'i', 'h', 'v'],
    ring: ['8', 'i', 'v', 'b', 'a'],
  };
  function ramp(kind, opts) {
    const c = opts && opts.color;
    if (Array.isArray(c)) return c;
    if (typeof c === 'string' && PAL[c]) {
      const R = { q: ['8', 'r', 'q', 'p'], c: ['8', 'd', 'c', 'b', 'a'], h: ['8', 'i', 'h', 'g'], m: ['8', 'n', 'm', 'l'], t: ['8', 'u', 't', 's'], u: ['8', 'u', 't', 's'], b: ['d', 'c', 'b', 'a'], r: ['8', 'r', 'q', 'p'] };
      return R[c] || [c];
    }
    return RAMPS[kind] || RAMPS.spark;
  }
  function add(p) { if (parts.length >= MAXP) parts.shift(); parts.push(p); }

  function burst(x, y, kind, n, opts) {
    opts = opts || {};
    kind = kind || 'spark';
    if (kind === 'explosion') return explosion(x, y, n, opts);
    n = n == null ? ({ spark: 14, dust: 10, blood: 16, gold: 10, smoke: 8, ember: 12, shard: 12, pocket: 18 }[kind] || 10) : n;
    const R = ramp(kind, opts);
    const sp = opts.speed || 1;
    const ang = opts.angle, spread = opts.spread != null ? opts.spread : Math.PI * 2;
    const ivx = opts.vx || 0, ivy = opts.vy || 0;
    for (let i = 0; i < n; i++) {
      const a = ang != null ? ang + (Math.random() - 0.5) * spread : Math.random() * Math.PI * 2;
      const p = { kind, x, y, vx: 0, vy: 0, t: 0, life: 1, R, g: 0, drag: 0, size: 1, spin: 0, rot: 0, floor: opts.floor, cx: x, cy: y };
      let s;
      switch (kind) {
        case 'spark':
          s = rnd(70, 200) * sp; p.life = rnd(0.15, 0.42); p.drag = 5; p.g = 60;
          break;
        case 'dust':
          s = rnd(8, 40) * sp; p.life = rnd(0.5, 1.1); p.drag = 3; p.g = -12; p.size = Math.random() < 0.4 ? 2 : 1;
          break;
        case 'blood':
          s = rnd(40, 150) * sp; p.life = rnd(0.5, 1.1); p.drag = 0.6; p.g = 320; p.size = Math.random() < 0.35 ? 2 : 1;
          if (ang == null) { p.vy0 = -rnd(30, 90); }
          break;
        case 'gold':
          s = rnd(50, 140) * sp; p.life = rnd(0.8, 1.5); p.drag = 0.4; p.g = 380; p.spin = rnd(8, 16); p.rot = Math.random() * 4;
          if (ang == null) p.vy0 = -rnd(80, 170);
          break;
        case 'smoke':
          s = rnd(5, 26) * sp; p.life = rnd(0.8, 1.7); p.drag = 1.5; p.g = -22; p.size = rnd(2, 3.5); p.grow = rnd(2, 4);
          break;
        case 'ember':
          s = rnd(15, 60) * sp; p.life = rnd(0.6, 1.6); p.drag = 1.2; p.g = -45; p.wig = rnd(2, 5); p.ph = Math.random() * 6;
          break;
        case 'shard':
          s = rnd(60, 170) * sp; p.life = rnd(0.5, 1.0); p.drag = 0.8; p.g = 300; p.spin = rnd(-14, 14); p.rot = Math.random() * 6; p.size = Math.random() < 0.5 ? 3 : 2;
          if (ang == null) p.vy0 = -rnd(40, 110);
          break;
        case 'pocket':
          s = 0; p.life = rnd(0.45, 0.85); p.ang = Math.random() * Math.PI * 2; p.rad = rnd(8, 18) * (opts.radius ? opts.radius / 12 : 1); p.av = rnd(8, 14) * (Math.random() < 0.5 ? 1 : 1);
          break;
        default:
          s = rnd(30, 100) * sp; p.life = rnd(0.3, 0.8);
      }
      if (opts.life) p.life *= opts.life;
      p.vx = Math.cos(a) * s + ivx;
      p.vy = Math.sin(a) * s + ivy + (p.vy0 || 0);
      if (opts.gravity != null) p.g = opts.gravity;
      if (opts.size) p.size = opts.size;
      add(p);
    }
  }
  function explosion(x, y, n, opts) {
    n = n || 1;
    const k = clamp(n > 3 ? n / 24 : n, 0.4, 3);
    add({ kind: 'ring', x, y, t: 0, life: 0.35, R: RAMPS.ring, r0: 3, r1: 20 * k, vx: 0, vy: 0, g: 0, drag: 0 });
    add({ kind: 'ring', x, y, t: -0.06, life: 0.4, R: ['i', 'v', 'b', 'a'], r0: 2, r1: 30 * k, vx: 0, vy: 0, g: 0, drag: 0 });
    add({ kind: 'core', x, y, t: 0, life: 0.18, R: ['8', 'i', 'h'], r0: 9 * k, vx: 0, vy: 0, g: 0, drag: 0 });
    burst(x, y, 'spark', Math.round(22 * k), { speed: 1.4 });
    burst(x, y, 'ember', Math.round(14 * k), { speed: 1.6 });
    burst(x, y, 'smoke', Math.round(9 * k), { speed: 1.5, color: ['4', '3', '2', '1'] });
    if (opts.shards !== false) burst(x, y, 'shard', Math.round(6 * k), { color: ['i', 'h', 'v', 'b'] });
  }

  function update(dt) {
    dt = Math.min(0.05, Math.max(0, dt || 0));
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      if (p.t < 0) continue;
      if (p.kind === 'pocket') {
        const k = p.t / p.life;
        p.ang += p.av * dt * (1 + k * 2);
        const r = p.rad * (1 - k) * (1 - k);
        p.x = p.cx + Math.cos(p.ang) * r; p.y = p.cy + Math.sin(p.ang) * r * 0.85;
        continue;
      }
      const dr = Math.exp(-p.drag * dt);
      p.vx *= dr; p.vy *= dr;
      p.vy += p.g * dt;
      if (p.wig) p.vx += Math.sin(p.t * 8 + p.ph) * p.wig;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.spin) p.rot += p.spin * dt;
      if (p.grow) p.size += p.grow * dt;
      if (p.floor != null && p.y > p.floor && p.vy > 0) { p.y = p.floor; p.vy *= -0.45; p.vx *= 0.7; if (Math.abs(p.vy) < 20) { p.vy = 0; p.g = 0; p.drag = 6; } }
    }
    // textos
    for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.t += dt; if (p.t >= p.life + p.delay) pops.splice(i, 1); }
    // sacudida
    if (shk.t < shk.dur) {
      shk.t += dt;
      const k = 1 - shk.t / shk.dur;
      const a = shk.i * k * k;
      shk.x = Math.round((Math.random() * 2 - 1) * a);
      shk.y = Math.round((Math.random() * 2 - 1) * a);
    } else { shk.x = 0; shk.y = 0; }
    // flash
    if (fl.t < fl.dur) fl.t += dt;
    // transición
    if (tr) {
      tr.t += dt;
      if (!tr.mid && tr.t >= tr.dur * (tr.mode === 'both' ? 0.5 : 1)) { tr.mid = true; if (tr.onMid) try { tr.onMid(); } catch (e) { console.error(e); } }
      if (tr.t >= tr.dur) {
        const done = tr.onDone;
        if (tr.mode === 'out') { tr.hold = true; tr.t = tr.dur; } else tr = null;
        if (done) try { done(); } catch (e) { console.error(e); }
      }
    }
  }

  // círculos de píxel precalculados (anillos) por radio
  const ringPts = {};
  function ring(r) {
    r = Math.max(1, Math.round(r));
    if (ringPts[r]) return ringPts[r];
    const pts = [];
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const d = x * x + y * y;
      if (d <= r * r + r * 0.8 && d > (r - 1) * (r - 1) + (r - 1) * 0.8) pts.push(x, y);
    }
    return (ringPts[r] = pts);
  }
  function disc(ctx, x, y, r, dith) {
    r = Math.max(1, Math.round(r));
    for (let j = -r; j <= r; j++) {
      const hw = Math.floor(Math.sqrt(r * r + r * 0.8 - j * j));
      if (!dith) ctx.fillRect(x - hw, y + j, hw * 2 + 1, 1);
      else for (let i = -hw; i <= hw; i++) if (((x + i + y + j) & 1) === 0) ctx.fillRect(x + i, y + j, 1, 1);
    }
  }
  function colAt(p) {
    const k = clamp(p.t / p.life, 0, 0.999);
    return PAL[p.R[Math.floor(k * p.R.length)]];
  }

  function draw(ctx) {
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.t < 0) continue;
      const k = p.t / p.life;
      const x = Math.round(p.x), y = Math.round(p.y);
      ctx.fillStyle = colAt(p);
      switch (p.kind) {
        case 'spark': {
          const len = Math.min(6, Math.hypot(p.vx, p.vy) * 0.03);
          const nx = p.vx / (Math.hypot(p.vx, p.vy) || 1), ny = p.vy / (Math.hypot(p.vx, p.vy) || 1);
          for (let s = 0; s <= len; s++) ctx.fillRect(Math.round(p.x - nx * s), Math.round(p.y - ny * s), 1, 1);
          if (k < 0.3) { ctx.fillStyle = PAL['8']; ctx.fillRect(x, y, 1, 1); }
          break;
        }
        case 'dust':
          if (k > 0.7 && ((i + Math.floor(p.t * 30)) & 1)) break;
          ctx.fillRect(x, y, p.size, p.size);
          break;
        case 'blood':
          ctx.fillRect(x, y, p.size, p.size + (Math.abs(p.vy) > 60 ? 1 : 0));
          break;
        case 'gold': {
          const ph = Math.floor(Math.abs(p.rot) * 2) % 4;
          const w = [4, 3, 1, 3][ph];
          ctx.fillStyle = PAL['0']; ctx.fillRect(x - (w >> 1) - 1, y, w + 2, 4); ctx.fillRect(x - (w >> 1), y - 1, w, 6);
          ctx.fillStyle = PAL[ph === 2 ? 'g' : 'h']; ctx.fillRect(x - (w >> 1), y, w, 4);
          if (w > 1) { ctx.fillStyle = PAL['i']; ctx.fillRect(x - (w >> 1), y, 1, 2); }
          if (w === 4) { ctx.fillStyle = PAL['g']; ctx.fillRect(x + 1, y + 1, 1, 2); }
          break;
        }
        case 'smoke':
          disc(ctx, x, y, p.size, k > 0.45);
          break;
        case 'ember':
          if (k > 0.8 && (Math.floor(p.t * 20) & 1)) break;
          ctx.fillRect(x, y, 1, 1);
          if (k < 0.3) ctx.fillRect(x, y + 1, 1, 1);
          break;
        case 'shard': {
          const c = Math.cos(p.rot), s = Math.sin(p.rot);
          for (let q = -1; q < p.size - 1; q++) ctx.fillRect(Math.round(p.x + c * q), Math.round(p.y + s * q), 1, 1);
          ctx.fillStyle = PAL['8']; if (Math.sin(p.rot * 3) > 0.6) ctx.fillRect(x, y, 1, 1);
          break;
        }
        case 'pocket':
          ctx.fillRect(x, y, 1, 1);
          if (k < 0.5) ctx.fillRect(x + 1, y, 1, 1);
          break;
        case 'ring': {
          const r = p.r0 + (p.r1 - p.r0) * (1 - (1 - k) * (1 - k));
          const pts = ring(r);
          for (let q = 0; q < pts.length; q += 2) ctx.fillRect(x + pts[q], y + pts[q + 1], 1, 1);
          if (k < 0.5) { const pts2 = ring(r - 1); for (let q = 0; q < pts2.length; q += 2) ctx.fillRect(x + pts2[q], y + pts2[q + 1], 1, 1); }
          break;
        }
        case 'core':
          disc(ctx, x, y, p.r0 * (1 - k * 0.5), k > 0.5);
          break;
        default:
          ctx.fillRect(x, y, 1, 1);
      }
    }
    drawPops(ctx);
    drawFlash(ctx);
    ctx.imageSmoothingEnabled = prev;
  }
  function clear() { parts.length = 0; pops.length = 0; shk.t = shk.dur = 0; shk.x = shk.y = 0; fl.t = fl.dur = 0; }

  // ============================================================ TEXTOS FLOTANTES
  const pops = [];
  const bakeCache = new Map();
  function bakeText(text, color, size, outline, shadow) {
    const key = text + '|' + color + '|' + size + '|' + outline + '|' + shadow;
    let b = bakeCache.get(key);
    if (b) return b;
    b = OM.FONT.bake(text, { color, size, outline, shadow, grad: size === 2 });
    if (bakeCache.size > 300) bakeCache.delete(bakeCache.keys().next().value);
    bakeCache.set(key, b);
    return b;
  }
  function popText(x, y, text, color, opts) {
    opts = opts || {};
    const size = opts.size === 1 ? 1 : 2;
    const p = {
      x, y, text: String(text), color: color || '8', size,
