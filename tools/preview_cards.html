<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OCHO MALDITO — preview cartas</title>
<style>
  html, body { margin: 0; background: #07050d; overflow: hidden; }
  canvas { display: block; width: 640px; height: 360px; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<script src="../src/core/px.js"></script>
<script src="../src/game/data.js"></script>
<script src="../src/art/cards_art.js"></script>
<script>
// Páginas: ?page=1 comodines | 2 consumibles+jefes+tacos+reversos+sobres | 3,4 comodines x3 |
//          5 consumibles x4 | 6 jefes x3 + emblemas | 7 cartas x3 (marcos/estados)
(function () {
  OM.ART_INIT.forEach((f) => f());
  const page = +(new URLSearchParams(location.search).get('page') || 1);
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const P = OM.PAL;
  // mini texto (sin depender de font.js)
  function label(s, x, y, col) { ctx.fillStyle = col || P['6']; ctx.font = '7px monospace'; ctx.fillText(s, x, y); }
  function bg() {
    ctx.fillStyle = P['1']; ctx.fillRect(0, 0, 640, 360);
    ctx.fillStyle = P['2'];
    for (let y = 0; y < 360; y += 4) for (let x = (y / 4) % 2 * 2; x < 640; x += 4) ctx.fillRect(x, y, 1, 1);
  }
  function zoom(name, x, y, s) {
    const sp = OM.PX.get(name); if (!sp) { ctx.fillStyle = P.b; ctx.fillRect(x, y, 10, 10); return; }
    ctx.fillStyle = P['2']; ctx.fillRect(x - 1, y - 1, sp.w * s + 2, sp.h * s + 2);
    ctx.fillStyle = P['1']; ctx.fillRect(x, y, sp.w * s, sp.h * s);
    ctx.drawImage(sp.c, x, y, sp.w * s, sp.h * s);
  }
  function frame(t) {
    bg();
    if (page === 1) {
      OM.JOKERS.forEach((j, i) => {
        const x = 12 + (i % 10) * 62, y = 8 + Math.floor(i / 10) * 72;
        OM.CARDS.drawJoker(ctx, j, x, y, { t, wobble: true });
        label(j.id, x - 4, y + 64);
      });
      const y = 226;
      OM.CARDS.drawBack(ctx, 12, y, 'joker', { t });
      OM.CARDS.drawBack(ctx, 66, y + 7, 'item', { t });
      ['arcano', 'luna', 'grabado', 'maldito'].forEach((k, i) => { OM.CARDS.drawPack(ctx, k, 112 + i * 52, y, { t }); label(k, 112 + i * 52, y + 64); });
      // estados
      const jd = OM.JOKERS;
      OM.CARDS.drawJoker(ctx, jd[0], 340, y, { t, hover: true }); label('hover', 340, y + 64);
      OM.CARDS.drawJoker(ctx, jd[14], 392, y, { t, selected: true }); label('selected', 390, y + 64);
      OM.CARDS.drawJoker(ctx, jd[24], 444, y, { t, sold: true }); label('sold', 444, y + 64);
      OM.CARDS.drawJoker(ctx, jd[3], 496, y, { t, edition: 'holo' }); label('holo', 496, y + 64);
      OM.CARDS.drawJoker(ctx, jd[5], 548, y, { t, edition: 'foil' }); label('foil', 548, y + 64);
      OM.CARDS.drawJoker(ctx, jd[28], 596, y, { t, scale: 1 });
      OM.CARDS.drawJoker(ctx, jd[29], 596, y + 58, { t, scale: 0.5 });
    } else if (page === 2) {
      OM.ITEMS.forEach((it, i) => {
        const x = 10 + (i % 9) * 40, y = 8 + Math.floor(i / 9) * 52;
        OM.CARDS.drawItem(ctx, it, x, y, { t, wobble: true });
      });
      OM.BOSSES.forEach((b, i) => {
        const x = 10 + (i % 5) * 58, y = 116 + Math.floor(i / 5) * 60;
        OM.CARDS.drawBossMedal(ctx, b, x, y, { t, hover: i === 1, defeated: i === 2 });
        label(b.id, x, y + 56);
      });
      OM.CUES.forEach((c, i) => { zoom('cue_' + c.id, 380 + i * 60, 10, 2); label(c.id, 380 + i * 60, 66); });
      OM.ITEMS.slice(0, 3).forEach((it, i) => OM.CARDS.drawItem(ctx, it, 380 + i * 40, 80, { t, hover: i === 1, selected: i === 2 }));
      ['arcano', 'luna', 'grabado', 'maldito'].forEach((k, i) => OM.CARDS.drawPack(ctx, k, 330 + i * 52, 250, { t, hover: i === 3, wobble: true }));
      OM.CARDS.drawBack(ctx, 548, 250, 'joker', { t, hover: true });
      OM.CARDS.drawBack(ctx, 596, 257, 'item', { t });
    } else if (page === 3 || page === 4) {
      const list = OM.JOKERS.slice(page === 3 ? 0 : 18, page === 3 ? 18 : 36);
      list.forEach((j, i) => { const x = 8 + (i % 6) * 105, y = 6 + Math.floor(i / 6) * 118; zoom('joker_' + j.id, x, y, 3); label(j.id, x, y + 105); });
    } else if (page === 5) {
      OM.ITEMS.forEach((it, i) => { const x = 8 + (i % 6) * 105, y = 6 + Math.floor(i / 6) * 118; zoom('item_' + it.id, x, y, 4); label(it.id, x, y + 106); });
    } else if (page === 6) {
      OM.BOSSES.forEach((b, i) => { const x = 8 + (i % 6) * 105, y = 6 + Math.floor(i / 6) * 118; zoom('boss_' + b.id, x, y, 3); label(b.id, x, y + 105); });
      ['arcano', 'luna', 'grabado', 'maldito'].forEach((k, i) => { const q = i + 10; zoom('pack_emb_' + k, 8 + (q % 6) * 105 + 8, 6 + Math.floor(q / 6) * 118 + 8, 3); });
      OM.CUES.forEach((c, i) => { const q = i + 14; zoom('cue_' + c.id, 8 + (q % 6) * 105 + 8, 6 + Math.floor(q / 6) * 118 + 8, 3); label(c.id, 8 + (q % 6) * 105, 6 + Math.floor(q / 6) * 118 + 105); });
    } else if (page === 7) {
      ctx.save(); ctx.scale(3, 3);
      const js = [OM.JOKERS[0], OM.JOKERS[13], OM.JOKERS[23], OM.JOKERS[28]];
      js.forEach((j, i) => OM.CARDS.drawJoker(ctx, j, 4 + i * 44, 4, { t }));
      OM.CARDS.drawItem(ctx, OM.ITEMS[0], 180, 4, { t });
      OM.CARDS.drawItem(ctx, OM.ITEMS[8], 180, 62, { t });
      OM.CARDS.drawItem(ctx, OM.ITEMS[14], 4, 62, { t });
      OM.CARDS.drawPack(ctx, 'maldito', 38, 62, { t });
      OM.CARDS.drawBack(ctx, 82, 62, 'joker', { t });
      OM.CARDS.drawBossMedal(ctx, OM.BOSSES[9], 126, 64, { t });
      ctx.restore();
    }
    requestAnimationFrame((ms) => frame(ms / 1000));
  }
  frame(0);
})();
</script>
</body>
</html>
